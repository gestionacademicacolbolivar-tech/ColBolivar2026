.opts.vf .opt{flex-direction:column;justify-content:center;text-align:center;min-height:110px;font-size:1.25rem;gap:4px}.opts.vf .opt:nth-child(1){--c:#1f9d55;--d:#14733c}.opts.vf .opt:nth-child(2){--c:#e8473b;--d:#a82a20}.opts.vf .sh{width:54px;height:54px;font-size:2rem;border-radius:50%}

.opt.right .sh::after{content:"✓"}.opt.wrong .sh::after{content:"✗"}.opt.right .sh,.opt.wrong .sh{font-size:0}.opt.right .sh::after,.opt.wrong .sh::after{font-size:1.5rem}

.fb img{width:84px;flex:none;filter:drop-shadow(0 4px 8px #0003)}.fb .t{font:800 1.05rem Sora,sans-serif;margin-bottom:2px}.fb p{margin:0 0 8px}.fb a.pg{display:inline-block;padding:6px 12px;border-radius:99px;background:#fff;border:2px solid #b9c7e8;color:#26407a;font-weight:800;text-decoration:none;font-size:.88rem}

.ring::before{content:"";position:absolute;inset:14px;border-radius:50%;background:#fff}.ring b{position:relative;font:800 2.4rem Sora,sans-serif;color:#17233a}.ring small{position:relative;display:block;text-align:center;font-weight:800;color:#51607a;margin-top:-6px}
.medal{text-align:center;font-size:3.4rem;line-height:1;animation:bob 2.4s ease-in-out infinite}.res h2{text-align:center;margin:6px 0}.res .sub{text-align:center}

<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="top"><a class="back" href="DOCUMENTOS%20INSTITUCIONALES.html">Documentos</a><b>🎓 Modo estudio</b><div class="hud" id="hud"></div></header>
<main id="app" aria-live="polite"><div class="card"><h2>Cargando preguntas…</h2></div></main>
<canvas id="cf" aria-hidden="true"></canvas>
<script>
(function(){'use strict';
var $=function(s,r){return(r||document).querySelector(s)},app=$('#app'),hud=$('#hud');
var ST={c:'assets/aria/c8a411b9a0.webp',g:'assets/aria/75b586d770.webp',t:'assets/aria/777199803b.webp',d:'assets/aria/dc6541147e.webp',n:'assets/aria/6ddea362d4.webp',h:'assets/aria/674286ee9f.webp'};
var DB=null,S={v:'home',doc:null,cfg:{n:10,l:0,t:'mix'},qs:[],i:0,sc:0,st:0,bs:0,res:[],lock:false};
var LS={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
S.cfg=Object.assign(S.cfg,LS.get('cbq:cfg',{}));
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function best(id){return LS.get('cbq:best:'+id,null)}
function stars(p){return p>=90?3:p>=75?2:p>=50?1:0}
function uix(ic,s){return '<i class="uix d" style="--s:'+(s||64)+'px;--c:'+(ic%4)+';--r:'+Math.floor(ic/4)+'" aria-hidden="true"></i>'}
// ---------- datos ----------
function cargar(n){return fetch('datos/estudio-preguntas.json'+(n?'?r='+Date.now():'')).then(function(r){if(!r.ok)throw 0;return r.json()}).catch(function(e){if(n>=2)throw e;return new Promise(function(ok){setTimeout(ok,1200)}).then(function(){return cargar(n+1)})})}
cargar(0).then(function(d){DB=d;var q=new URLSearchParams(location.search).get('d');var doc=q&&(q==='all'?'all':DB.docs.filter(function(x){return x.id===q})[0]);if(doc){S.doc=doc==='all'?'all':doc;S.v='setup'}go()}).catch(function(){app.innerHTML='<div class="card"><h2>No se pudieron cargar las preguntas</h2><p class="sub">Revisa tu conexión e inténtalo de nuevo.</p><button class="cta" data-a="reload">Reintentar</button></div>'});
function pool(){var all=S.doc==='all';return all?DB.docs.reduce(function(a,d){return a.concat(d.qs.map(function(q){return Object.assign({d:d},q)}))},[]):S.doc.qs.map(function(q){return Object.assign({d:S.doc},q)})}
function filtrar(){var P=pool(),c=S.cfg;if(c.t!=='mix')P=P.filter(function(q){return q.t===c.t});return P}
function armar(){var P=filtrar(),c=S.cfg,n=Math.min(c.n==='all'?999:c.n,P.length),R;
 if(c.l===0){var g=[1,2,3].map(function(l){return shuf(P.filter(function(q){return q.l===l}))}),pick=[],k=0;while(pick.length<n){var any=false;for(var j=0;j<3&&pick.length<n;j++){if(g[j].length){pick.push(g[j].shift());any=true}}if(!any)break}R=pick.sort(function(a,b){return a.l-b.l})}
 else{var ord=shuf(P).sort(function(a,b){return Math.abs(a.l-c.l)-Math.abs(b.l-c.l)});R=ord.slice(0,n);R=shuf(R)}
 return R.map(function(q){if(q.t==='mc'){var idx=shuf(q.o.map(function(_,i){return i}));return Object.assign({},q,{o2:idx.map(function(i){return q.o[i]}),a2:idx.indexOf(q.a)})}return Object.assign({},q)})}
// ---------- vistas ----------
function home(){var tot=DB.docs.length,done=DB.docs.filter(function(d){var b=best(d.id);return b&&b.p>=75}).length;
 var h='<div class="hero"><img class="st" src="'+ST.g+'" alt="ARIA"><div><h1>Inducción docente <em>en juego</em></h1><p>Elige un documento y practica con preguntas de opción múltiple y verdadero o falso. ¡Sin escribir nada!</p></div></div>';
 h+='<div class="prog" role="status"><span>🏅 Insignias</span><div class="bar" style="--w:'+Math.round(done/tot*100)+'%"><i></i></div><span>'+done+'/'+tot+'</span></div>';
 h+='<div class="grid"><button class="dcard wide" data-a="pick" data-id="all"><span class="em" aria-hidden="true">🎲</span><div><b>Reto general</b><small>Mezcla preguntas de los '+tot+' documentos. ¿Cuánto sabes del colegio?</small></div></button>';
 DB.docs.forEach(function(d){var b=best(d.id),s=b?stars(b.p):0;h+='<button class="dcard" style="--c:'+d.col+'" data-a="pick" data-id="'+d.id+'">'+uix(d.ic)+'<b>'+esc(d.t)+'</b><small>'+esc(d.sub)+'</small><span class="meta"><span>'+d.qs.length+' preguntas</span><span class="stars" aria-label="'+s+' de 3 estrellas"><b>'+'★'.repeat(s)+'</b>'+'★'.repeat(3-s)+'</span></span></button>'});
 h+='</div>';return h}
function setup(){var d=S.doc,all=d==='all',c=S.cfg,P=filtrar(),nl=function(l){return pool().filter(function(q){return(c.t==='mix'||q.t===c.t)&&q.l===l}).length};
 var avail=P.length,n=Math.min(c.n==='all'?999:c.n,avail),pl=c.l?nl(c.l):avail;
 var h='<div class="card"><h2>'+(all?'🎲 Reto general':esc(d.t))+'</h2><div class="sub">'+(all?'Preguntas de todos los documentos':esc(d.sub))+' · '+pool().length+' preguntas en total</div>';
 h+='<div class="lab">1 · ¿Cuántas preguntas?</div><div class="chips">'+[5,10,15,20,'all'].map(function(x){var dis=x!=='all'&&x>avail&&x!==5&&avail<x;return '<button class="chip" data-a="n" data-v="'+x+'" aria-pressed="'+(c.n===x)+'"'+(dis?' disabled':'')+'>'+(x==='all'?'Todas':x)+'</button>'}).join('')+'</div>';
 h+='<div class="lab">2 · ¿Qué nivel?</div><div class="chips">'+[[1,'🌱 Fácil'],[2,'🌿 Medio'],[3,'🌳 Difícil'],[0,'🎲 Mixto']].map(function(x){return '<button class="chip" data-a="l" data-v="'+x[0]+'" aria-pressed="'+(c.l===x[0])+'">'+x[1]+(x[0]?'<small>'+nl(x[0])+' preg.</small>':'<small>de fácil a difícil</small>')+'</button>'}).join('')+'</div>';
 h+='<div class="lab">3 · ¿Qué formato?</div><div class="chips">'+[['mc','🔘 Opción múltiple'],['vf','✔✘ Verdadero o falso'],['mix','🔀 Mixto']].map(function(x){return '<button class="chip" data-a="t" data-v="'+x[0]+'" aria-pressed="'+(c.t===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>';
 var msg=c.l&&pl<n?(pl===1?'Hay solo <b>1</b> pregunta de ese nivel con ese formato; completo':'Hay solo <b>'+pl+'</b> preguntas de ese nivel con ese formato; completo')+' con las del nivel más cercano.':'Jugarás <b>'+n+'</b> pregunta'+(n===1?'':'s')+'.';
 if(!avail)msg='No hay preguntas con ese formato en este documento. Prueba con «Mixto».';
 h+='<div class="hint" role="status">'+msg+'</div>';
 h+='<button class="cta" data-a="start"'+(avail?'':' disabled')+'>¡Empezar! 🚀</button><button class="cta sec" data-a="home">← Elegir otro documento</button></div>';return h}
function pbar(){var h='<div class="pb" aria-hidden="true">';S.qs.forEach(function(q,i){var r=S.res[i];h+='<i class="'+(r===true?'ok':r===false?'no':i===S.i?'on':'')+'"></i>'});return h+'</div>'}
var LB=['A','B','C','D'],SH=['▲','◆','●','■'];
function game(){var q=S.qs[S.i],h=pbar();
 h+='<div class="card"><div class="qhead"><span class="tag l'+q.l+'">'+['','🌱 Fácil','🌿 Medio','🌳 Difícil'][q.l]+'</span><span>Pregunta '+(S.i+1)+' de '+S.qs.length+'</span>'+(S.doc==='all'?'<span style="margin-left:auto">'+esc(q.d.t)+'</span>':'')+'</div><div class="q">'+esc(q.q)+'</div>';
 if(q.t==='vf')h+='<div class="opts vf"><button class="opt" data-a="ans" data-v="1"><span class="sh">✔</span>Verdadero</button><button class="opt" data-a="ans" data-v="0"><span class="sh">✘</span>Falso</button></div>';
 else h+='<div class="opts">'+q.o2.map(function(o,i){return '<button class="opt" data-a="ans" data-v="'+i+'"><span class="sh" aria-hidden="true">'+SH[i]+'</span><span><small style="opacity:.8">'+LB[i]+'</small> '+esc(o)+'</span></button>'}).join('')+'</div>';
 return h+'<div id="fb"></div></div>'}
function hudu(){hud.innerHTML=S.v==='game'?'<span title="Aciertos">⭐ '+S.sc+'</span>'+(S.st>=2?'<span title="Racha">🔥 '+S.st+'</span>':''):''}
function results(){var n=S.qs.length,p=Math.round(S.sc/n*100),m=p>=90?['🏆','¡Maestro del documento!']:p>=75?['🥇','¡Excelente trabajo!']:p>=50?['🥈','¡Muy bien, ya casi!']:['🥉','¡Buen comienzo, sigue practicando!'],d=S.doc==='all'?null:S.doc;
 var b=S.doc==='all'?'all':d.id,old=best(b);if(!old||p>old.p)LS.set('cbq:best:'+b,{p:p,t:Date.now()});
 var h='<div class="card res"><img class="coach" src="'+(p>=75?ST.g:ST.t)+'" alt="ARIA"><div class="medal" aria-hidden="true">'+m[0]+'</div><h2>'+m[1]+'</h2><div class="ring" style="--p:'+p+';--rc:'+(p>=75?'#1f9d55':p>=50?'#e29a00':'#e8473b')+'"><div><b>'+p+'%</b><small>'+S.sc+' de '+n+'</small></div></div>';
 h+='<div class="stats"><span>⭐ '+S.sc+' aciertos</span><span>🔥 racha máx. '+S.bs+'</span>'+(old&&old.p>=p?'<span>🏅 mejor: '+old.p+'%</span>':'<span>🎉 ¡Nuevo récord!</span>')+'</div>';
 h+='<button class="cta" data-a="again">🔁 Jugar otra vez</button><button class="cta sec" data-a="wa">📲 Compartir mi resultado</button><button class="cta sec" data-a="home">📚 Elegir otro documento</button>';
 h+='<div class="lab" style="margin-top:18px">Repaso de tus respuestas</div><ul class="rv">'+S.qs.map(function(q,i){var ok=S.res[i],corr=q.t==='vf'?(q.a?'Verdadero':'Falso'):q.o[q.a];return '<li class="'+(ok?'ok':'no')+'"><b aria-hidden="true">'+(ok?'✓':'✗')+'</b><div>'+esc(q.q)+'<small>Respuesta: '+esc(corr)+' · <a href="'+vurl(q)+'" target="_blank" rel="noopener">ver pág. '+q.p+'</a></small></div></li>'}).join('')+'</ul></div>';return h}
function vurl(q){return 'visor.html?'+new URLSearchParams({f:q.d.f,t:q.d.t,p:q.p}).toString()}
function go(){S.v=S.v||'home';app.innerHTML={home:home,setup:setup,game:game,results:results}[S.v]();hudu();scrollTo(0,0);var f=$('.cta:not([disabled]),.chip[aria-pressed=true]',app);if(S.v==='game'){var o=$('.opt',app)}}
function refreshSetup(){var y=scrollY;app.innerHTML=setup();scrollTo(0,y)}
// ---------- interacción ----------
function responder(v){if(S.lock)return;S.lock=true;var q=S.qs[S.i],ok=q.t==='vf'?((v===1)===q.a):(v===q.a2);S.res[S.i]=ok;
 if(ok){S.sc++;S.st++;S.bs=Math.max(S.bs,S.st);boom()}else S.st=0;
 var bs=app.querySelectorAll('.opt');bs.forEach(function(b,i){b.classList.add('dim')});
 var right=q.t==='vf'?(q.a?0:1):q.a2,cho=q.t==='vf'?(v===1?0:1):v;bs[right].classList.remove('dim');bs[right].classList.add('right');if(!ok){bs[cho].classList.remove('dim');bs[cho].classList.add('wrong')}
 var last=S.i===S.qs.length-1,img=ok?(S.st>=3?ST.g:ST.c):ST.t,msg=ok?(S.st>=3?'¡Racha de '+S.st+'! 🔥':'¡Correcto!'):'Casi… ¡tú puedes!';
 $('#fb').innerHTML='<div class="fb '+(ok?'ok':'no')+'" role="status"><img src="'+img+'" alt=""><div><div class="t">'+msg+'</div><p>'+esc(q.e)+'</p><a class="pg" href="'+vurl(q)+'" target="_blank" rel="noopener">📄 Ver en el documento · pág. '+q.p+'</a></div></div><button class="cta" data-a="next" id="nx">'+(last?'Ver mi resultado 🏁':'Siguiente ▶')+'</button>';
 var pb=$('.pb');pb.outerHTML=pbar();hudu();setTimeout(function(){var nx=$('#nx');nx&&nx.scrollIntoView({block:'nearest',behavior:'smooth'});nx&&nx.focus({preventScroll:true})},60)}
app.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b||b.disabled)return;var a=b.dataset.a,v=b.dataset.v;
 if(a==='pick'){var id=b.dataset.id;S.doc=id==='all'?'all':DB.docs.filter(function(d){return d.id===id})[0];S.v='setup';go()}
 else if(a==='n'){S.cfg.n=v==='all'?'all':+v;LS.set('cbq:cfg',S.cfg);refreshSetup()}
 else if(a==='l'){S.cfg.l=+v;LS.set('cbq:cfg',S.cfg);refreshSetup()}
 else if(a==='t'){S.cfg.t=v;LS.set('cbq:cfg',S.cfg);refreshSetup()}
 else if(a==='home'){S.v='home';history.replaceState(null,'','estudio.html');go()}
 else if(a==='start'||a==='again'){S.qs=armar();if(!S.qs.length)return;S.i=0;S.sc=0;S.st=0;S.bs=0;S.res=[];S.lock=false;S.v='game';go()}
 else if(a==='ans')responder(+v);
 else if(a==='next'){if(S.i>=S.qs.length-1){S.v='results';S.lock=false;go();if(S.sc/S.qs.length>=.75)boom(true)}else{S.i++;S.lock=false;go()}}
 else if(a==='wa'){var n=S.qs.length,t=(S.doc==='all'?'el Reto general':'«'+S.doc.t+'»');window.open('https://wa.me/?text='+encodeURIComponent('🎓 Saqué '+S.sc+' de '+n+' ('+Math.round(S.sc/n*100)+'%) en el Modo estudio de '+t+' del Colegio Simón Bolívar. ¿Puedes superarme? '+new URL('estudio.html?d='+(S.doc==='all'?'all':S.doc.id),location.href).href),'_blank','noopener')}
 else if(a==='reload')location.reload()});
addEventListener('keydown',function(e){if(S.v!=='game'||e.ctrlKey||e.metaKey||e.altKey)return;var k=e.key.toLowerCase(),q=S.qs[S.i];
 if(!S.lock){var m={'1':0,'2':1,'3':2,'4':3,a:0,b:1,c:2,d:3};if(q.t==='vf'){if(k==='v'||k==='1')responder(1);else if(k==='f'||k==='2')responder(0)}else if(k in m&&m[k]<q.o2.length)responder(m[k])}
 else if(k==='enter'||k===' '){var nx=$('#nx');if(nx&&document.activeElement!==nx){e.preventDefault();nx.click()}}});
// ---------- confeti ----------
var cv=$('#cf'),cx=cv.getContext('2d'),P=[],raf=0,RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
function fit(){cv.width=innerWidth;cv.height=innerHeight}fit();addEventListener('resize',fit);
function boom(big){if(RM)return;var n=big?160:46,ox=cv.width/2,oy=big?cv.height*.3:cv.height*.55,C=['#ffd23f','#ffa63d','#4be08a','#5aa2ff','#ff6b6b','#c79bff'];
 for(var i=0;i<n;i++)P.push({x:ox,y:oy,vx:(Math.random()-.5)*(big?16:9),vy:-Math.random()*(big?14:9)-3,g:.32,s:5+Math.random()*7,c:C[i%6],r:Math.random()*6,vr:(Math.random()-.5)*.4,l:90+Math.random()*50});
 if(!raf)raf=requestAnimationFrame(tick)}
function tick(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(function(p){return p.l>0&&p.y<cv.height+30});P.forEach(function(p){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.l/30);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);cx.restore()});raf=P.length?requestAnimationFrame(tick):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}
})();
