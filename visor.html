function panel(t){side(true);document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.t===t)});['bus','mk','inf'].forEach(function(x){$('#sb'+x.charAt(0).toUpperCase()+x.slice(1)).hidden=x!==t})}

document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){panel(b.dataset.t);if(b.dataset.t==='mk')marks()}});
// ---------- búsqueda ----------
function textos(){if(TXT)return Promise.resolve(TXT);TXT=[];var p=Promise.resolve();for(var n=1;n<=N;n++)(function(n){p=p.then(function(){return pdf.getPage(n).then(function(pg){return pg.getTextContent()}).then(function(tc){TXT[n]=tc.items.map(function(i){return i.str}).join(' ').replace(/\s+/g,' ');if(n%8===0||n===N)$('#resBus').innerHTML='<p class="small">Preparando la búsqueda… '+n+' de '+N+' páginas</p>'})})})(n);return p.then(function(){return TXT})}
function buscar(q,salto){q=q.trim();if(q.length<2)return;QRY=q;$('#resBus').innerHTML='<p class="small">Buscando…</p>';
 textos().then(function(T){var nq=norm(q),H=[];for(var n=1;n<=N;n++){var t=T[n]||'',nt=norm(t),i=nt.indexOf(nq),c=0;if(i<0)continue;var snip=t.slice(Math.max(0,i-60),i+q.length+90);for(var k=nt.indexOf(nq);k>=0;k=nt.indexOf(nq,k+nq.length))c++;H.push({p:n,c:c,s:snip,q:nq})}
  HIT=H;if(!H.length){$('#resBus').innerHTML='<p class="small">No encontré «'+esc(q)+'» en este documento. Prueba con otra palabra (sin tildes también funciona).</p>';return}
  $('#resBus').innerHTML='<p class="small"><b>'+H.length+' página'+(H.length>1?'s':'')+'</b> con «'+esc(q)+'»</p>'+H.slice(0,150).map(function(h){var s=esc(h.s).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');return '<button class="hit" data-p="'+h.p+'"><b>Pág. '+h.p+'</b>'+(h.c>1?' <span class="small">('+h.c+' veces)</span>':'')+'<br>…'+s+'…</button>'}).join('');
  divs.forEach(function(d){if(d._r){liberar(d);render(d)}});
  if(salto)ir(H[0].p);if(innerWidth<700&&!salto)setTimeout(function(){},0)})}
$('#fBus').onsubmit=function(e){e.preventDefault();buscar($('#qIn').value)};
$('#resBus').onclick=function(e){var b=e.target.closest('.hit');if(!b)return;ir(+b.dataset.p);if(innerWidth<700)side(false)};
// ---------- marcadores / info ----------
function marks(){var m=ST.marks.slice().sort(function(a,b){return a-b});$('#resMk').innerHTML=m.length?m.map(function(p){return '<button class="mk" data-p="'+p+'"><b>Página '+p+'</b><span class="small"> · toca para ir</span></button>'}).join('')+'<p class="small">Se guardan en este dispositivo.</p>':'<p class="small">Aún no tienes marcadores. Toca el icono de marcador de la barra para guardar la página en la que estás.</p>'}
$('#resMk').onclick=function(e){var b=e.target.closest('.mk');if(b){ir(+b.dataset.p);if(innerWidth<700)side(false)}};
$('#bMk').onclick=function(){var i=ST.marks.indexOf(cur);if(i>=0){ST.marks.splice(i,1);toast('Marcador quitado de la página '+cur)}else{ST.marks.push(cur);toast('Página '+cur+' marcada ✔')}save();$('#bMk').setAttribute('aria-pressed',ST.marks.indexOf(cur)>=0);marks()};
function info(i){var f=function(k,v){return v?'<p><b>'+k+':</b> '+esc(v)+'</p>':''};$('#resInf').innerHTML='<p><b>'+esc(TITLE)+'</b></p>'+f('Páginas',N)+f('Título interno',i.Title)+f('Autor',i.Author)+f('Creado con',i.Creator||i.Producer)+'<p class="small">Archivo: '+esc(NAME)+'.pdf</p>'}
// ---------- menú ----------
function menu(on){$('#menu').classList.toggle('on',on);$('#bMenu').setAttribute('aria-expanded',on)}
$('#bMenu').onclick=function(e){e.stopPropagation();menu(!$('#menu').classList.contains('on'))};document.addEventListener('click',function(e){if(!e.target.closest('#menu'))menu(false)});
function link(){var u=new URL(location.href);u.search='?'+new URLSearchParams({f:F,t:TITLE,p:cur}).toString();u.hash='';return u.href}
$('#mNoche').onclick=function(){night=!night;document.body.classList.toggle('night',night);try{localStorage.setItem('cbv:night',night?'1':'0')}catch(e){}menu(false)};
$('#mCopy').onclick=function(){var u=link();(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){toast('Enlace copiado (página '+cur+')')},function(){prompt('Copia este enlace:',u)});menu(false)};
$('#mWa').onclick=function(){window.open('https://wa.me/?text='+encodeURIComponent(TITLE+' (pág. '+cur+'): '+link()),'_blank','noopener');menu(false)};
$('#mFull').onclick=function(){var d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(d.requestFullscreen)d.requestFullscreen();else toast('Tu navegador no permite pantalla completa');menu(false)};
$('#bCerrar').onclick=function(){if(window.opener||history.length<=1)window.close();setTimeout(function(){location.href='DOCUMENTOS%20INSTITUCIONALES.html'},150)};
// ---------- ARIA ----------
var af=null;function aria(q){if(!af){af=document.createElement('iframe');af.src='aria-widget.html';af.title='ARIA';af.allow='autoplay';af.style.cssText='position:fixed;right:0;bottom:0;width:150px;height:250px;border:0;background:transparent;z-index:50;color-scheme:light';document.body.appendChild(af);
  addEventListener('message',function(e){if(e.source!==af.contentWindow||!e.data||!e.data.aria)return;var o=e.data.aria==='abierto';af.style.width=o?'min(370px,100vw)':'150px';af.style.height=o?'min(680px,100vh)':'250px'});
  af.addEventListener('load',function(){setTimeout(function(){af.contentWindow.postMessage({ariaPregunta:q},'*')},400)},{once:true})}else af.contentWindow.postMessage({ariaPregunta:q},'*')}
$('#mAria').onclick=function(){menu(false);aria('¿De qué trata '+TITLE+'?')};
})();
</script></body></html>
