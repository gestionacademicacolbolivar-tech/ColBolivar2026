<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12306e">
<meta name="robots" content="noindex">
<title>Resultados de la prueba · ColBolívar</title>
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/pruebas.css">
<style>
.hdr{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}.hdr h2{font-size:1.3rem}
.est{display:inline-block;font:800 .74rem Nunito,sans-serif;padding:.15em .7em;border-radius:99px;color:#fff;background:var(--g)}.est.c{background:#7b8a80}
.qb{cursor:pointer;border-radius:10px;padding:4px 6px;margin:0 -6px;transition:background .15s}.qb:hover{background:#f3f8f3}.qb .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:75%}
.qd{border:1px solid var(--line);border-radius:12px;background:#fafcfa;padding:10px 14px;margin:4px 0 10px}.qd .o{display:grid;grid-template-columns:1fr 70px;gap:8px;align-items:center;margin:6px 0;font-size:.9rem}.qd .o.ok b{color:#14532d}.qd .o small{display:block;color:var(--mut)}
.qd .mini{height:10px;border-radius:99px;background:#e6efe7;overflow:hidden}.qd .mini i{display:block;height:100%;background:var(--r)}.qd .o.ok .mini i{background:var(--g)}
.alert{border-left:5px solid var(--r);background:#fdecec;border-radius:10px;padding:8px 12px;margin:6px 0;font-size:.9rem;color:#7b1620}
.ab{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}.ab p{white-space:pre-wrap;background:#f7faf7;border-radius:8px;padding:6px 10px;margin:6px 0;font-size:.92rem}.ab input{width:90px;display:inline-block}
.tabs2{display:flex;gap:6px;margin-bottom:10px}
</style>
</head>
<body>
<header class="top"><div class="in"><img src="assets/img/escudo.webp" alt="Escudo del colegio"><div><h1>Resultados de la prueba</h1><p>Reporte para el docente</p></div><a class="back" href="pruebas.html">← Mis pruebas</a></div></header>
<main id="app">
<section class="card" id="gate"><h2>Abrir resultados</h2><p class="sub">Escribe el código de la prueba y tu <b>código de docente</b> (o la clave de esa prueba).</p>
<div class="g2"><div><label class="f">Código de la prueba</label><input type="text" id="gc" maxlength="8" style="text-transform:uppercase"></div><div><label class="f">Tu código de docente o clave</label><input type="password" id="gp" maxlength="12" autocomplete="off" placeholder="D-XXXXXX"></div></div>
<div id="ge"></div><div class="row" style="margin-top:12px"><button class="btn p" id="gb">Ver resultados</button></div></section>
<div id="rep" hidden></div>
</main>
<script src="assets/js/qrcode.js"></script>
<script src="assets/js/pruebas-comun.js"></script>
<script>
(function(){
var $=function(q){return document.querySelector(q)},E=PR.E,D=null,cod='',pin='',auto=null,abiertoQ={},ord='orden',fCurso='',fBusca='',fAl=false,sortK='nota',sortD=1;
var TIPOS={'PESTAÑA_OCULTA':'salió de la pestaña','VENTANA_SIN_FOCO':'cambió de ventana','PANTALLA_COMPLETA':'salió de pantalla completa','COPIAR':'intentó copiar','PEGAR':'intentó pegar','CLIC_DERECHO':'clic derecho','CAPTURA':'captura de pantalla'};
function tipoF(t){return TIPOS[t]||(/^TECLA_/.test(t)?'tecla prohibida ('+t.slice(6)+')':t)}
function alertaTxt(e){return (e.fraude||[]).map(function(x){return 'P'+x.q+': '+tipoF(x.t)}).join(' · ')}
var COL=['#2b7a3a','#f58220','#12306e','#d92d3a','#7a4fb5','#0b8da6'];
function colPct(p){return p>=70?'#2fa84f':p>=40?'#e0a100':'#d92d3a'}
function err(m){$('#ge').innerHTML=m?'<div class="msg a">'+E(m)+'</div>':''}
var qs=new URLSearchParams(location.search);cod=(qs.get('c')||'').toUpperCase();$('#gc').value=cod;
var guardada=PR.misPruebas().filter(function(p){return p.codigo===cod})[0],cd=PR.codigoDocente();if(guardada){$('#gp').value=guardada.pin;cargar()}else if(cod&&cd){$('#gp').value=cd;cargar()}
$('#gb').addEventListener('click',function(){cod=$('#gc').value.trim().toUpperCase();pin=$('#gp').value.trim();cargar()});
function cargar(sil){cod=$('#gc').value.trim().toUpperCase();pin=$('#gp').value.trim();if(!cod||!pin){err('Escribe el código y la clave.');return Promise.resolve()}
 return PR.api('resultados',{codigo:cod,pin:pin}).then(function(j){D=j;$('#gate').hidden=true;$('#rep').hidden=false;if(/^D-/i.test(pin))PR.codigoDocente(pin);else if(!PR.misPruebas().some(function(p){return p.codigo===cod}))PR.guardarPrueba({codigo:cod,pin:pin,titulo:j.meta.titulo,fecha:new Date().toISOString()});pinta()})
 .catch(function(e){if(sil)return;$('#gate').hidden=false;err(e.message)})}
/* ---------- cálculos ---------- */
function prom(a){return a.length?a.reduce(function(s,x){return s+x},0)/a.length:0}
function agrupa(campo){var m={};D.preguntas.forEach(function(q){if(q.tipo!=='multiple'||!q[campo])return;var g=m[q[campo]]=m[q[campo]]||{k:q[campo],ok:0,n:0,q:0};g.ok+=q.aciertos;g.n+=q.respondieron;g.q++});return Object.keys(m).map(function(k){return m[k]})}
function barras(items,fmt){return '<div class="bars">'+items.map(function(x){var p=x.n?Math.round(x.ok/x.n*100):0;return '<div class="bar" style="--c:'+colPct(p)+'"><div class="t"><span>'+E(x.k)+'</span><small>'+p+'% · '+x.q+' preg.</small></div><div class="rail"><div class="fill" style="width:'+p+'%"></div></div></div>'}).join('')+'</div>'}
function segs(s){return s===null||s===undefined?'':(s>=60?Math.floor(s/60)+' min '+(s%60)+' s':s+' s')}
function mmss(s){return Math.floor(s/60)+':'+('0'+Math.round(s%60)).slice(-2)}
/* ---------- dibujo ---------- */
function pinta(){var M=D.meta,est=D.estudiantes,N=est.length,notas=est.map(function(e){return e.nota}),multi=D.preguntas.filter(function(q){return q.tipo==='multiple'}),abi=D.preguntas.filter(function(q){return q.tipo==='abierta'});
 var cerrada=M.estado!=='activa',aprob=notas.filter(function(n){return n>=3}).length,h='';
 h+='<section class="card"><div class="hdr"><div><h2>'+E(M.titulo)+'</h2><p class="sub">'+[M.area,M.grado&&'Grado '+M.grado,M.cursos.join(', ')].filter(String).map(E).join(' · ')+' · código <b>'+E(M.codigo)+'</b> · <span class="est '+(cerrada?'c':'')+'">'+(cerrada?'Cerrada':'Abierta')+'</span></p></div>'
 +'<div class="row noprint"><button class="btn sm" id="tog">'+(cerrada?'🔓 Reabrir':'🔒 Cerrar prueba')+'</button><button class="btn sm" id="cp">📋 Enlace</button><button class="btn sm" id="csv">⬇ Excel (CSV)</button><button class="btn sm" id="imp">🖨️ Imprimir informe</button><label class="chip" style="display:inline-flex;gap:5px;align-items:center"><input type="checkbox" id="au"'+(auto?' checked':'')+'> Actualizar solo</label><button class="btn sm" id="rf">↻</button></div></div></section>';
 if(!N){h+='<div class="card"><h2>Aún nadie ha entregado</h2><p class="sub">Comparte el enlace o el código QR. Esta página se puede actualizar sola.</p><div class="row" style="justify-content:center"><div style="width:200px">'+PR.qr(PR.linkPrueba(M.codigo),6)+'</div></div><p class="foot">'+E(PR.linkPrueba(M.codigo))+'</p></div>';$('#rep').innerHTML=h;enlazar();return}
 est.forEach(function(e){e.alertas=(e.fraude||[]).length});var minN=Math.min.apply(null,notas),maxN=Math.max.apply(null,notas);
 h+='<div class="kpis"><div class="kpi"><b>'+N+'</b><span>entregas</span></div><div class="kpi" style="--c:'+PR.colorNota(prom(notas))+'"><b>'+PR.nota(prom(notas))+'</b><span>nota promedio (0–5)</span></div><div class="kpi" style="--c:#12306e"><b>'+Math.round(aprob/N*100)+'%</b><span>aprueban (≥ 3,0)</span></div><div class="kpi" style="--c:#2fa84f"><b>'+PR.nota(maxN)+'</b><span>nota más alta</span></div><div class="kpi" style="--c:#d92d3a"><b>'+PR.nota(minN)+'</b><span>nota más baja</span></div><div class="kpi" style="--c:#7a4fb5"><b>'+mmss(prom(est.map(function(e){return e.segundos})))+'</b><span>tiempo medio</span></div>'+(est.some(function(e){return e.alertas})?'<div class="kpi" style="--c:#d92d3a"><b>'+est.filter(function(e){return e.alertas}).length+'</b><span>con alertas de seguridad</span></div>':'')+'</div>';
 /* alertas */
 var al=multi.filter(function(q){return q.respondieron>=3}).map(function(q){var p=q.aciertos/q.respondieron*100,mx=Math.max.apply(null,q.dist),dom=q.dist.indexOf(mx);return p<30?'<div class="alert">⚠️ <b>Pregunta '+q.n+'</b>: solo '+Math.round(p)+'% acertó'+(dom!==q.correcta&&mx>q.aciertos?' y la opción más elegida fue «'+E(q.opciones[dom])+'»':'')+'. Revisa si la clave es correcta o si el tema no se entendió.</div>':''}).join('');
 if(al)h+='<section class="card"><h2>Para revisar</h2>'+al+'</section>';
 /* distribución */
 var bins=[0,0,0,0,0],lab=['0 – 0,9','1 – 1,9','2 – 2,9','3 – 3,9','4 – 5'];notas.forEach(function(n){bins[Math.min(4,Math.floor(n))]++});var mb=Math.max.apply(null,bins);
 h+='<section class="card"><h2>Distribución de notas</h2><p class="sub">Cuántos estudiantes sacaron cada rango.</p><div class="cols">'+bins.map(function(b,i){return '<div class="col"><b>'+b+'</b><i style="height:'+Math.max(3,Math.round(b/mb*100))+'%;--c:'+(i<3?'#d92d3a':i<4?'#e0a100':'#2fa84f')+'"></i><span>'+lab[i]+'</span></div>'}).join('')+'</div></section>';
 /* por pregunta */
 var lst=multi.slice();if(ord==='dificil')lst.sort(function(a,b){return a.aciertos/(a.respondieron||1)-b.aciertos/(b.respondieron||1)});
 h+='<section class="card"><div class="hdr"><div><h2>Aciertos por pregunta</h2><p class="sub">Toca una pregunta para ver qué opciones eligieron.</p></div><div class="chips noprint" id="ordc"><button class="chip '+(ord==='orden'?'on':'')+'" data-o="orden">En orden</button><button class="chip '+(ord==='dificil'?'on':'')+'" data-o="dificil">Más difíciles primero</button></div></div><div class="bars" id="pq">'
 +lst.map(function(q){var p=q.respondieron?Math.round(q.aciertos/q.respondieron*100):0,ab=abiertoQ[q.id];return '<div><div class="bar qb" data-q="'+q.id+'" style="--c:'+colPct(p)+'"><div class="t"><span>'+q.n+'. '+E(q.pregunta)+'</span><small>'+p+'% ('+q.aciertos+'/'+q.respondieron+')'+(q.tiempoMedio!==null&&q.tiempoMedio!==undefined?' · ⏱ '+segs(q.tiempoMedio):'')+'</small></div><div class="rail"><div class="fill" style="width:'+p+'%"></div></div></div>'+(ab?detalle(q):'')+'</div>'}).join('')+'</div></section>';
 /* por competencia/componente/nivel */
 [['competencia','Por competencia'],['componente','Por componente'],['nivel','Por nivel de dificultad']].forEach(function(c){var g=agrupa(c[0]);if(g.length)h+='<section class="card"><h2>'+c[1]+'</h2><p class="sub">Porcentaje de aciertos del grupo.</p>'+barras(g)+'</section>'});
 /* por curso */
 var cm={};est.forEach(function(e){var k=(e.curso||'—').trim();(cm[k]=cm[k]||[]).push(e)});var cks=Object.keys(cm).sort();
 if(cks.length>1)h+='<section class="card"><h2>Comparación por curso</h2><p class="sub">Nota promedio de cada grupo.</p><div class="cols">'+cks.map(function(k,i){var a=prom(cm[k].map(function(e){return e.nota}));return '<div class="col"><b>'+PR.nota(a)+'</b><i style="height:'+Math.max(3,Math.round(a/5*100))+'%;--c:'+COL[i%COL.length]+'"></i><span>'+E(k)+'<br>('+cm[k].length+')</span></div>'}).join('')+'</div></section>';
 /* abiertas */
 if(abi.length)h+='<section class="card"><h2>Preguntas abiertas por calificar</h2><p class="sub">Pon el puntaje de cada respuesta; la nota final se recalcula sola.</p>'+abi.map(function(q){return '<h3 style="font-size:1rem;margin:10px 0 4px">'+q.n+'. '+E(q.pregunta)+' <small>(máx. '+q.puntos+')</small></h3>'+(q.modelo?'<div class="msg i"><b>Respuesta modelo:</b> '+E(q.modelo)+(q.criterios.length?'<br><b>Criterios:</b> '+q.criterios.map(E).join(' · '):'')+'</div>':'')+est.map(function(e){return '<div class="ab"><b>'+E(e.nombre)+'</b> <small>'+E(e.curso)+'</small><p>'+(E(e.abiertas[q.id]||'')||'<i>Sin respuesta</i>')+'</p><span class="noprint">Puntaje: <input type="number" min="0" max="'+q.puntos+'" step="0.5" data-e="'+e.id+'" data-q="'+q.id+'" value="'+(e.pts[q.id]===undefined?'':e.pts[q.id])+'"> <button class="btn sm" data-sv="'+e.id+'">Guardar</button></span></div>'}).join('')}).join('')+'</section>';
 /* estudiantes */
 var ls=est.filter(function(e){return(!fCurso||(e.curso||'—')===fCurso)&&(!fBusca||e.nombre.toLowerCase().indexOf(fBusca)>=0)&&(!fAl||e.alertas||e.forzada)});ls.sort(function(a,b){var x=a[sortK],y=b[sortK];return(x>y?1:x<y?-1:0)*sortD});
 h+='<section class="card"><h2>Estudiantes</h2><div class="row noprint" style="margin:6px 0"><select id="fc" style="max-width:180px"><option value="">Todos los cursos</option>'+cks.map(function(k){return '<option'+(fCurso===k?' selected':'')+'>'+E(k)+'</option>'}).join('')+'</select><input type="text" id="fb" placeholder="Buscar por nombre…" value="'+E(fBusca)+'" style="max-width:240px"><label class="chip" style="display:inline-flex;gap:5px;align-items:center"><input type="checkbox" id="fal"'+(fAl?' checked':'')+'> Solo con alertas</label></div><div class="scroll"><table class="tbl"><thead><tr>'+[['nombre','Nombre'],['curso','Curso'],['aciertos','Aciertos'],['nota','Nota'],['segundos','Tiempo'],['alertas','Alertas'],['fecha','Entregó']].map(function(c){return '<th data-s="'+c[0]+'">'+c[1]+(sortK===c[0]?(sortD>0?' ▲':' ▼'):'')+'</th>'}).join('')+'</tr></thead><tbody>'
 +ls.map(function(e){return '<tr><td>'+E(e.nombre)+(e.intento>1?' <small>(intento '+e.intento+')</small>':'')+'</td><td>'+E(e.curso)+'</td><td>'+e.aciertos+'/'+e.total+'</td><td><span class="pill" style="--c:'+PR.colorNota(e.nota)+'">'+PR.nota(e.nota)+(e.provisional?'*':'')+'</span></td><td>'+mmss(e.segundos)+'</td><td>'+(e.forzada==='salidas'?'<span class="pill" style="--c:#d92d3a" title="La prueba se entregó sola por superar el máximo de salidas">🚫 por salidas</span> ':e.forzada==='tiempo'?'<span class="pill" style="--c:#7a4fb5" title="Se entregó sola al acabarse el tiempo">⏱ por tiempo</span> ':'')+(e.alertas?'<span class="pill" style="--c:#e0a100" title="'+E(alertaTxt(e))+'">⚠ '+e.alertas+'</span>':(e.forzada?'':'<span style="color:var(--mut)">—</span>'))+'</td><td>'+E((e.fecha||'').slice(5,16).replace('T',' '))+'</td></tr>'}).join('')+'</tbody></table></div><p class="sub" style="margin-top:6px">* nota provisional: faltan preguntas abiertas por calificar. ⚠ Alertas: salidas de la pantalla de la prueba o intentos de copiar (pasa el cursor para ver el detalle).</p></section>';
 $('#rep').innerHTML=h+'<p class="foot">Este reporte es un apoyo para el seguimiento; las notas oficiales se registran en la plataforma institucional.</p>';enlazar()}
function detalle(q){var tot=q.respondieron||1;return '<div class="qd">'+(q.enunciado?'<p class="sub" style="margin-bottom:4px">'+E(q.enunciado)+'</p>':'')+q.opciones.map(function(o,j){var c=q.dist[j],ok=j===q.correcta;return '<div class="o '+(ok?'ok':'')+'"><div><b>'+'ABCDEF'.charAt(j)+') '+E(o)+(ok?' ✓':'')+'</b>'+(!ok&&q.err[j]?'<small>Error que indica: '+E(q.err[j])+'</small>':'')+'<div class="mini"><i style="width:'+Math.round(c/tot*100)+'%"></i></div></div><span>'+c+' ('+Math.round(c/tot*100)+'%)</span></div>'}).join('')+(q.omitidas?'<p class="sub">Sin responder: '+q.omitidas+'</p>':'')+(q.tiempoMedio!==null&&q.tiempoMedio!==undefined?'<p class="sub">⏱ Tiempo medio en esta pregunta: <b>'+segs(q.tiempoMedio)+'</b></p>':'')+(q.just?'<p class="sub" style="margin-top:6px"><b>Justificación:</b> '+E(q.just)+'</p>':'')+'</div>'}
/* ---------- eventos ---------- */
function enlazar(){var g=function(i){return document.getElementById(i)};
 if(g('tog'))g('tog').onclick=function(){PR.api('estado',{codigo:cod,pin:pin,estado:D.meta.estado==='activa'?'cerrada':'activa'}).then(function(){return cargar(true)}).catch(function(e){alert(e.message)})};
 if(g('cp'))g('cp').onclick=function(){var u=PR.linkPrueba(cod),b=this;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){b.textContent='✔ Copiado'},function(){prompt('Copia este enlace:',u)})};
 if(g('imp'))g('imp').onclick=function(){print()};if(g('rf'))g('rf').onclick=function(){cargar(true)};
 if(g('au'))g('au').onchange=function(){clearInterval(auto);auto=this.checked?setInterval(function(){if(!document.hidden)cargar(true)},20000):null};
 if(g('csv'))g('csv').onclick=csv;
 var oc=g('ordc');if(oc)oc.onclick=function(e){var b=e.target.closest('button');if(b){ord=b.dataset.o;pinta()}};
 var pq=g('pq');if(pq)pq.onclick=function(e){var b=e.target.closest('.qb');if(b){abiertoQ[b.dataset.q]=!abiertoQ[b.dataset.q];pinta()}};
 var fc=g('fc');if(fc)fc.onchange=function(){fCurso=this.value;pinta()};var fa=g('fal');if(fa)fa.onchange=function(){fAl=this.checked;pinta()};var fb=g('fb');if(fb)fb.oninput=function(){fBusca=this.value.toLowerCase();var p=this.selectionStart;pinta();var n=g('fb');n.focus();n.setSelectionRange(p,p)};
 [].forEach.call(document.querySelectorAll('th[data-s]'),function(t){t.onclick=function(){if(sortK===t.dataset.s)sortD*=-1;else{sortK=t.dataset.s;sortD=1}pinta()}});
 [].forEach.call(document.querySelectorAll('[data-sv]'),function(b){b.onclick=function(){var id=b.dataset.sv,pts={};[].forEach.call(document.querySelectorAll('input[data-e="'+id+'"]'),function(i){if(i.value!=='')pts[i.dataset.q]=+i.value});b.textContent='Guardando…';PR.api('calificar',{codigo:cod,pin:pin,id:id,pts:pts}).then(function(){return cargar(true)}).catch(function(e){alert(e.message)})}})}
function csv(){var q=D.preguntas.filter(function(x){return x.tipo==='multiple'}),f=function(v){v=String(v===undefined?'':v);return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 var rows=[['Nombre','Curso','Intento','Aciertos','Total','Nota (0-5)','Provisional','Tiempo (min)','Salidas','Alertas','Entrega automática','Fecha'].concat(q.map(function(x){return 'P'+x.n}))];
 D.estudiantes.forEach(function(e){rows.push([e.nombre,e.curso,e.intento,e.aciertos,e.total,String(e.nota).replace('.',','),e.provisional?'sí':'no',(e.segundos/60).toFixed(1).replace('.',','),e.salidas,(e.fraude||[]).length,e.forzada||'',e.fecha].concat(q.map(function(x){var v=e.ok[x.id];return v===null||v===undefined?'':v})))});
 var b=new Blob(['\ufeff'+rows.map(function(r){return r.map(f).join(';')}).join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='resultados-'+cod+'.csv';a.click()}
})();
</script>
</body>
</html>
