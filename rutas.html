<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12306e">
<title>¿Qué hago si…? · ColBolívar</title>
<meta name="description" content="Guía paso a paso para atender situaciones de convivencia y emergencias en el Colegio Integrado Simón Bolívar, con la página exacta del Manual de convivencia y del PEGRD.">
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#2b7a3a;--gd:#1c4f27;--o:#f58220;--n:#12306e;--r:#d92d3a;--ink:#16241b;--mut:#4a5b50;--bg:#eef4ee;--card:#fff;--line:#d3e0d5}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font:17px/1.5 Nunito,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{font-family:Sora,Nunito,sans-serif;line-height:1.15;color:var(--gd)}
a{color:inherit}a:focus-visible,button:focus-visible{outline:3px solid var(--o);outline-offset:3px}
.top{background:linear-gradient(135deg,#0b1a44,#12306e 60%,#1c4f27);color:#fff;position:relative;overflow:hidden;isolation:isolate}
.top:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(500px 220px at 85% 0,rgba(255,200,70,.25),transparent 70%),repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 38px),repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 38px)}
.top .in{max-width:1000px;margin:0 auto;padding:14px clamp(14px,3vw,30px) 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top img{width:56px;height:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.top h1{color:#fff;font-size:clamp(1.3rem,4vw,2rem)}.top p{opacity:.85;font-size:.92rem}
.top .back{margin-left:auto;text-decoration:none;font-weight:700;font-size:.9rem;padding:.45em 1em;border:1px solid rgba(255,255,255,.5);border-radius:999px;transition:background .2s}
.top .back:hover{background:rgba(255,255,255,.16)}
main{max-width:1000px;margin:0 auto;padding:16px clamp(14px,3vw,30px) 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 6px 16px rgba(12,42,24,.07)}
.btn{display:inline-flex;align-items:center;gap:.5em;font:700 .95rem Nunito,sans-serif;text-decoration:none;cursor:pointer;border:2px solid var(--g);background:#fff;color:var(--gd);border-radius:999px;padding:.55em 1.1em;transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 12px rgba(255,190,60,.8)}.btn.p{background:var(--g);color:#fff}.btn.o{background:var(--o);border-color:var(--o);color:#2b1500}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font:700 .8rem Nunito,sans-serif;border:1px solid var(--line);background:#fff;border-radius:999px;padding:.3em .85em;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--gd);color:#fff;border-color:var(--gd)}
.foot{margin-top:18px;text-align:center;color:var(--mut);font-size:.86rem}code{background:#eef4ee;padding:.05em .4em;border-radius:5px;font-size:.88em}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.borr{background:#fff8e1;border:1px solid #f0d58a;border-left:5px solid var(--o);color:#6b4a00;font-size:.86rem;border-radius:12px;padding:10px 14px;margin-bottom:14px}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.pk{text-align:left;cursor:pointer;font:inherit;background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;transition:transform .15s,border-color .15s,box-shadow .15s}
.pk:hover,.pk:focus-visible{transform:translateY(-3px);border-color:var(--g);box-shadow:0 8px 20px rgba(12,42,24,.15)}.pk .i{font-size:2rem}.pk b{display:block;font:700 1.05rem Sora,sans-serif;color:var(--gd);margin:4px 0}.pk small{color:var(--mut)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;font-size:.78rem}.crumbs span{background:#e4efe6;color:var(--gd);border-radius:99px;padding:.15em .7em}
.q h2{font-size:clamp(1.25rem,3.6vw,1.6rem);margin-bottom:8px}.q .ay{color:var(--mut);font-size:.92rem;margin-bottom:10px}
.call{border-radius:12px;padding:10px 14px;margin:10px 0;font-size:.93rem}.call.a{background:#fdecec;border:1px solid #f3b9bd;border-left:5px solid var(--r);color:#7b1620}.call.i{background:#eaf3ff;border:1px solid #b9d2f3;border-left:5px solid var(--n);color:#12306e}
.ops{display:grid;gap:10px;margin-top:12px}.op{text-align:left;cursor:pointer;font:700 1rem Nunito,sans-serif;background:#fff;border:2px solid var(--g);color:var(--ink);border-radius:14px;padding:13px 16px;transition:transform .15s,background .15s,box-shadow .15s}
.op:hover,.op:focus-visible{background:#eaf5ed;transform:translateX(4px);box-shadow:0 0 12px rgba(255,190,60,.7)}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.res .tp{font:800 .78rem Sora,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}.res h2{font-size:clamp(1.4rem,4vw,1.9rem);margin:2px 0 6px}.res .rs{color:var(--mut);margin-bottom:10px}
.res ol{counter-reset:s;list-style:none;display:grid;gap:8px;margin:10px 0}.res ol>li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;background:#f4f9f3;border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.res ol>li:before{content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--g);color:#fff;font:800 .9rem Sora,sans-serif}
.res h3{font-size:.95rem;margin:14px 0 6px}.res ul{margin-left:1.1em}
.fu{display:flex;flex-wrap:wrap;gap:8px}
@media print{.top .back,.nav,.borr .x{display:none}body{background:#fff}.card{box-shadow:none}}
</style>
</head>
<body>
<header class="top"><div class="in"><img src="assets/img/escudo.webp" alt="Escudo del colegio"><div><h1>¿Qué hago si…?</h1><p>Guía paso a paso basada en el Manual de convivencia y el PEGRD.</p></div><a class="back" href="index.html">← Volver al portal</a></div></header>
<main id="app"><div class="borr" id="borr"></div><div id="v" aria-live="polite"></div></main>
<script>
var $=function(q,r){return (r||document).querySelector(q)},E=function(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var D,V=$('#v'),docs;
function vis(f,p,t){return 'visor.html?'+new URLSearchParams({f:docs[f].f,t:docs[f].n+(t?' · '+t:''),p:p}).toString()}
function ruta(){var h=(location.hash||'').slice(1);return h?h.split('.'):[]}
function ir(path){location.hash=path.length?path.join('.'):'';if(!path.length)render()}
function render(){var path=ruta();
 if(!path.length){V.innerHTML='<div class="card"><h2 style="margin-bottom:4px">¿Qué situación necesitas atender?</h2><p style="color:var(--mut);margin-bottom:12px">Elige una ruta y responde unas preguntas. Te dirá los pasos, los responsables y dónde está en el documento oficial.</p><div class="pick">'+D.rutas.map(function(r){return '<button class="pk" data-r="'+r.inicio+'"><span class="i">'+r.icono+'</span><b>'+E(r.titulo)+'</b><small>'+E(r.desc)+'</small></button>'}).join('')+'</div></div>';return}
 var id=path[path.length-1],n=D.nodos[id];if(!n){ir([]);return}
 var crumbs='';for(var i=0;i<path.length-1;i++){var a=D.nodos[path[i]],sig=path[i+1],o=(a.op||[]).filter(function(x){return x.a===sig})[0];if(a&&a.p&&o)crumbs+='<span>'+E(a.p.replace(/\?$/,''))+': <b>'+E(o.t)+'</b></span>'}
 var h='<div class="card '+(n.r?'res':'q')+'">'+(crumbs?'<div class="crumbs">'+crumbs+'</div>':'');
 if(n.r){h+='<div class="tp">'+n.icono+' '+E(n.tipo||'')+'</div><h2>'+E(n.titulo)+'</h2><p class="rs">'+E(n.resumen)+'</p>';
  (n.alertas||[]).forEach(function(a){h+='<div class="call a">⚠️ '+E(a)+'</div>'});
  h+='<h3>Pasos a seguir</h3><ol>'+n.pasos.map(function(s){return '<li><span>'+E(s)+'</span></li>'}).join('')+'</ol>';
  if(n.responsables&&n.responsables.length)h+='<h3>Quiénes intervienen</h3><div class="chips">'+n.responsables.map(function(x){return '<span class="chip on" style="cursor:default">'+E(x)+'</span>'}).join('')+'</div>';
  if(n.formatos&&n.formatos.length)h+='<h3>Formatos y registros</h3><ul>'+n.formatos.map(function(x){return '<li>'+E(x)+'</li>'}).join('')+'</ul>';
  h+='<h3>Dónde está en el documento oficial</h3><div class="fu">'+(n.fuentes||[]).map(function(f){return '<a class="btn" target="_blank" rel="noopener" href="'+E(vis(f.d,f.p,f.t))+'">📄 '+E(docs[f.d].n)+' · pág. '+f.p+' ↗</a>'}).join('')+'</div>';
  if(n.siguiente)h+='<div class="nav">'+n.siguiente.map(function(s){return '<button class="btn o" data-go="'+s.a+'">'+E(s.t)+' →</button>'}).join('')+'</div>';
  h+='<div class="nav"><button class="btn" data-back>← Atrás</button><button class="btn" data-home>Empezar de nuevo</button><button class="btn" onclick="print()">🖨️ Imprimir</button></div></div>'}
 else{h+='<h2>'+E(n.p)+'</h2>'+(n.ayuda?'<p class="ay">'+E(n.ayuda)+'</p>':'');
  if(n.alerta)h+='<div class="call a">⚠️ '+E(n.alerta)+'</div>';if(n.antes)h+='<div class="call i">ℹ️ '+E(n.antes)+(n.fuente?' <a target="_blank" rel="noopener" href="'+E(vis(n.fuente.d,n.fuente.p,n.fuente.t))+'">(ver en el '+E(docs[n.fuente.d].n)+', pág. '+n.fuente.p+')</a>':'')+'</div>';
  h+='<div class="ops">'+n.op.map(function(o){return '<button class="op" data-go="'+o.a+'">'+E(o.t)+'</button>'}).join('')+'</div><div class="nav"><button class="btn" data-back>← Atrás</button><button class="btn" data-home>Empezar de nuevo</button></div></div>'}
 V.innerHTML=h;window.scrollTo({top:0,behavior:'smooth'})}
V.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var p=ruta();
 if(b.dataset.r)ir([b.dataset.r]);else if(b.dataset.go)ir(p.concat(b.dataset.go));else if('back' in b.dataset)ir(p.slice(0,-1));else if('home' in b.dataset)ir([])});
addEventListener('hashchange',render);
fetch('datos/rutas-atencion.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(j){D=j;docs=j.docs;$('#borr').innerHTML='<b>'+(j.estado==='borrador'?'Borrador en validación.':'')+'</b> '+E(j.aviso);render()}).catch(function(){V.innerHTML='<p class="foot">No se pudo cargar la guía. Intenta de nuevo en unos minutos.</p>'});

</script>
</body>
</html>
