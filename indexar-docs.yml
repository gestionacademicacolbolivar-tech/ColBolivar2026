name: Indexar documentos para ARIA
on:
  push:
    branches: [main]
    paths-ignore: ["indice-docs.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  indexar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pypdf beautifulsoup4 python-docx
      - run: python scripts/indexar_docs.py
      - run: |
          git config user.name "aria-bot"; git config user.email "aria-bot@users.noreply.github.com"
          git add indice-docs.json; git diff --cached --quiet || (git commit -m "Actualizar índice de ARIA [skip ci]" && git push)
