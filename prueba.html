<!DOCTYPE html>
<html lang="es">
<head>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{--az:#12306e;--az2:#2457c5;--am:#ffd23f}
body{font-size:18px;background:linear-gradient(160deg,#eaf2ff,#eef7ee 55%,#fff6e6);min-height:100vh;-webkit-tap-highlight-color:transparent}
main{max-width:760px;padding:12px clamp(12px,3vw,22px) 90px}
.hd{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#0b1a44,var(--az) 65%,#1c4f27);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.hd .f1{display:flex;align-items:center;gap:10px;padding:8px clamp(12px,3vw,22px)}.hd img{width:34px;height:34px;object-fit:contain}.hd b{font:700 .92rem Sora,sans-serif;flex:1;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chipH{font:800 .85rem Sora,sans-serif;background:rgba(255,255,255,.16);border-radius:99px;padding:.2em .8em;white-space:nowrap}.chipH.u{background:var(--r);animation:parp 1s infinite}.chipH.a{background:#e0a100;color:#2b1500}
@keyframes parp{50%{opacity:.6}}
.dots{display:flex;gap:4px;padding:0 clamp(12px,3vw,22px) 8px;flex-wrap:wrap}.dots button{flex:1;min-width:14px;max-width:34px;height:9px;border-radius:99px;border:0;background:rgba(255,255,255,.28);cursor:pointer;padding:0;transition:all .2s}.dots button.si{background:#8ad46a}.dots button.ex{background:#f59e0b}.dots button.ac{background:#fff;transform:scaleY(1.7);box-shadow:0 0 8px rgba(255,255,255,.8)}.dots button:disabled{cursor:default}
.vista{background:#fff3c4;color:#6b4a00;text-align:center;font-weight:800;font-size:.85rem;padding:5px}
.card{border-radius:20px}
.est{border:1px solid #cdd8f0;border-left:5px solid var(--az2);background:#f6f9ff;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:.98rem}.est h3{font-size:1rem;color:var(--az);margin-bottom:4px}.est p{margin:4px 0}.est .ins{font-size:.82rem;color:var(--mut)}
.est p .np{font-weight:800;color:var(--az2);margin-right:.35em}
.enun{font-size:.98rem;color:#33443a;margin-bottom:6px}.preg{font:700 1.18rem/1.4 Nunito,sans-serif;margin-bottom:12px}
.gimg{display:block;max-width:100%;max-height:340px;margin:8px auto;border-radius:12px}.gcap{text-align:center;font-size:.82rem;font-style:italic;color:var(--mut);margin:-2px 0 8px}
.gtab{border-collapse:collapse;margin:8px auto;font-size:.95rem}.gtab caption{font-weight:700;font-style:italic;padding-bottom:4px}.gtab th,.gtab td{border:1px solid #9bb09f;padding:4px 10px;text-align:center}.gtab th{background:#eef4ee}
.gbox{background:#f5f5f5;border:1px solid #cfd6d0;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.95rem}.gbox b{display:block}.gbox small{color:var(--mut)}
.ops{position:relative}
.op{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;text-align:left;width:100%;font:700 1.05rem/1.35 Nunito,sans-serif;background:#fff;border:2px solid #d3deef;border-radius:16px;padding:10px 12px;margin-bottom:10px;cursor:pointer;color:var(--ink);transition:border-color .15s,background .15s,transform .15s,box-shadow .15s}
.op:hover:not(:disabled){border-color:var(--az2);transform:translateX(3px)}.op b{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#e6eefc;color:var(--az);font:800 1rem Sora,sans-serif}
.op img{max-width:100%;max-height:120px;border-radius:8px;display:block;margin-top:4px}
.op.sel{border-color:var(--az2);background:#e9f0ff;box-shadow:0 0 0 3px rgba(36,87,197,.2)}.op.sel b{background:var(--az2);color:#fff}
.op:disabled{cursor:not-allowed;opacity:.55;transform:none}
.cand{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#fff8e1,#fff);border:2px solid #f0d58a;border-radius:18px;padding:10px 14px;margin:0 0 12px}
.cand img.bot{width:62px;height:auto;flex:none}.cand .tx{flex:1;font-weight:800;color:#6b4a00;line-height:1.25}.cand .tx small{display:block;font-weight:600;color:#8a6a1a}
.ring{position:relative;width:72px;height:72px;flex:none}.ring svg{transform:rotate(-90deg);width:72px;height:72px}.ring circle{fill:none;stroke-width:8}.ring .bg{stroke:#f0e2b4}.ring .fg{stroke:#f59e0b;stroke-linecap:round;transition:stroke-dashoffset .25s linear}.ring span{position:absolute;inset:0;display:grid;place-items:center;font:800 1.35rem Sora,sans-serif;color:#6b4a00}
.libre{animation:pop .5s ease}@keyframes pop{0%{transform:scale(.97);box-shadow:0 0 0 0 rgba(47,168,79,.7)}60%{box-shadow:0 0 0 14px rgba(47,168,79,0)}100%{box-shadow:none}}
.lim{height:8px;border-radius:99px;background:#e1e8f5;overflow:hidden;margin:0 0 10px}.lim i{display:block;height:100%;background:linear-gradient(90deg,#2fa84f,#f59e0b,#d92d3a);width:100%;transition:width .25s linear}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:12px;position:sticky;bottom:0;background:linear-gradient(transparent,#eef4ee 35%);padding:16px 0 10px}
.btn.big{font-size:1.05rem;padding:.7em 1.4em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin:12px 0}.grid button{font:800 1rem Sora,sans-serif;border:2px solid var(--line);background:#fff;border-radius:12px;padding:.55em 0;cursor:pointer}.grid button.si{background:#eaf5ed;border-color:var(--g);color:var(--gd)}.grid button.no{background:#fff3e0;border-color:var(--o);color:#8a4b00}
/* portada */
.por{display:grid;grid-template-columns:300px 1fr;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 22px 50px rgba(18,48,110,.22);margin-top:8px}
.por .izq{background:linear-gradient(160deg,var(--az2),var(--az) 55%,#1c4f27);color:#fff;text-align:center;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.por .izq img.bot{width:150px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3));animation:flota 3s ease-in-out infinite}@keyframes flota{50%{transform:translateY(-6px)}}
.por .izq h1{color:#fff;font:700 1.55rem Sora,sans-serif;text-transform:uppercase;letter-spacing:.04em}.por .izq .gr{background:var(--am);color:#12306e;font:800 1rem Sora,sans-serif;border-radius:12px;padding:.2em 1em;box-shadow:0 3px 0 #c9a000}.por .izq small{opacity:.9;font-weight:700;line-height:1.3}
.por .der{padding:20px 22px}
.reglas{display:grid;gap:7px;margin:12px 0;font-size:.93rem}.reglas div{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;background:#f6f9ff;border:1px solid #dbe5f7;border-radius:12px;padding:6px 10px}.reglas img{width:26px;height:26px;object-fit:contain}
.go{width:100%;justify-content:center;font:800 1.15rem Sora,sans-serif;padding:.75em;border-radius:16px;border:0;background:linear-gradient(#2fa84f,#1f8a3b);color:#fff;box-shadow:0 5px 0 #166b2d;cursor:pointer;transition:transform .1s}.go:active{transform:translateY(3px);box-shadow:0 2px 0 #166b2d}.go:disabled{background:#cbd5e1;box-shadow:0 5px 0 #a8b4c6;color:#8896ab;cursor:not-allowed}
@media(max-width:680px){.por{grid-template-columns:1fr}.por .izq{flex-direction:row;text-align:left;padding:14px}.por .izq img.bot{width:84px}.por .izq h1{font-size:1.15rem}}
/* resultado */
.rr{text-align:center}.rr img.bot{width:130px}.ringN{width:150px;height:150px;border-radius:50%;margin:8px auto;display:grid;place-items:center;border:10px solid var(--c);background:#fff}.big2{font:800 clamp(3rem,16vw,4.6rem)/1 Sora,sans-serif;color:var(--c)}
.dt{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff;overflow:hidden}.dt summary{cursor:pointer;padding:9px 12px;font-weight:700;display:flex;gap:8px;align-items:center}.dt .b{padding:0 12px 10px;font-size:.95rem}.dt .ok{color:#14532d}.dt .no{color:#7b1620}.dt.ok{border-left:5px solid var(--g)}.dt.mal{border-left:5px solid var(--r)}
.cen{text-align:center;padding:26px 10px}.cen img.bot{width:130px}
/* fraude */
#fr{position:fixed;inset:0;z-index:100;background:rgba(10,20,50,.86);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}#fr[hidden]{display:none}
#fr .caja{background:#fff;border-radius:24px;max-width:430px;width:100%;text-align:center;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5);border-top:8px solid var(--r)}#fr img.bot{width:120px}#fr h2{color:var(--r);font-size:1.3rem}#fr p{margin:6px 0}
.noselect{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.noselect textarea{-webkit-user-select:text;user-select:text}
@media print{body{display:none!important}}
</style>
</head>
<body>
<div id="vistaB" class="vista" hidden>👀 VISTA PREVIA — así lo verá el estudiante. No se guarda nada.</div>
<div class="hd" id="hd" hidden><div class="f1"><img src="assets/img/escudo.webp" alt=""><b id="hT">Prueba</b><span class="chipH a" id="fr0" hidden></span><span class="chipH" id="tm" hidden></span></div><div class="dots" id="dots" hidden></div></div>
<main id="app" aria-live="polite"><div class="cen"><img class="bot" src="assets/img/prueba/bot_piensa.webp" alt=""><p>Cargando la prueba…</p></div></main>
<div id="fr" hidden role="alertdialog" aria-modal="true"><div class="caja"><img class="bot" src="assets/img/prueba/bot_vigila.webp" alt=""><h2 id="frT">¡Atención!</h2><p id="frM"></p><div class="ring" style="margin:10px auto"><svg viewBox="0 0 80 80"><circle class="bg" cx="40" cy="40" r="34"/><circle class="fg" id="frFg" cx="40" cy="40" r="34" stroke-dasharray="213.6" stroke-dashoffset="0"/></svg><span id="frN">15</span></div><p style="font-size:.85rem;color:var(--mut)">Esto quedó registrado para tu docente.</p><button class="btn p big" id="frOk" disabled style="width:100%;justify-content:center">Espera…</button></div></div>
<script src="assets/js/pruebas-comun.js"></script>
<script src="assets/js/confetti.min.js"></script>
<script>
(function(){
var $=function(q){return document.querySelector(q)},E=PR.E,app=$('#app'),IMG='assets/img/prueba/';
var cod=(new URLSearchParams(location.search).get('c')||'').toUpperCase().replace(/[^A-Z0-9]/g,''),VISTA=cod==='VISTA',LK='pr_'+cod;
var M,PB,CL,ST,OP,orden=[],opts={},tick=null,enviando=false,fuera=null,frTimer=null,iniciado=false,ultTick=Date.now(),frActivo=false;
function guardar(){if(VISTA)return;PR.LS(LK,ST)}
function pantalla(h){app.innerHTML=h;window.scrollTo(0,0)}
function msg(img,t,p,extra){pantalla('<div class="cen"><img class="bot" src="'+IMG+img+'.webp" alt=""><h2>'+t+'</h2><p class="sub">'+(p||'')+'</p>'+(extra||'')+'</div>')}
if(!cod){msg('bot_duerme','Falta el código de la prueba','Escanea el código QR o usa el enlace que te dio tu profe.');return}
function arrancar(j){M=j.meta;PB=j.publico;CL=j.clave||null;OP=M.opciones||{};ST=VISTA?null:PR.LS(LK);
 if(ST&&ST.resultado){$('#hT').textContent=M.titulo;$('#hd').hidden=false;resultado(ST.resultado);return}
 if(!j.abierta.si&&!(ST&&ST.nombre&&!ST.enviado)){var m=j.abierta.motivo;msg('bot_duerme',m==='aun_no'?'La prueba aún no abre':'La prueba ya está cerrada',m==='aun_no'?'Abre el '+new Date(j.abierta.abre).toLocaleString('es-CO',{dateStyle:'long',timeStyle:'short'})+'.':'Si crees que es un error, habla con tu profe.');return}
 $('#hT').textContent=M.titulo;$('#hd').hidden=false;
 if(ST&&ST.nombre&&!ST.enviado){preparar();empezar()}else portada()}
if(VISTA){$('#vistaB').hidden=false;try{var v=JSON.parse(sessionStorage.getItem('cb_vista'));if(!v)throw 0;arrancar({meta:v.meta,publico:v.publico,clave:v.clave,abierta:{si:true}})}catch(e){msg('bot_duerme','No hay vista previa','Vuelve a la página del docente y pulsa «Probar como estudiante».')}}
else PR.api('prueba',{codigo:cod},'GET').then(arrancar).catch(function(e){msg('bot_duerme',e.codigo==='no_existe'?'No encontramos esa prueba':'No se pudo cargar',E(e.message),'<button class="btn p" onclick="location.reload()">Reintentar</button>')});

/* ---------- utilidades de tiempos ---------- */
function piensaDe(q){return q.piensa!==null&&q.piensa!==undefined?q.piensa:(OP.piensa||0)}
function limiteDe(q){return q.limite!==null&&q.limite!==undefined?q.limite:(OP.limite||0)}
function qActual(){return PB.preguntas[orden[ST.i]]}
function fm(){return OP.fraude||{modo:'off'}}
/* ---------- portada ---------- */
function portada(){var n=PB.preguntas.length,F=fm(),anyP=OP.piensa>0||PB.preguntas.some(function(q){return q.piensa>0}),anyL=OP.limite>0||PB.preguntas.some(function(q){return q.limite>0});
 var reglas=[['reloj',M.minutos?'Tienes <b>'+M.minutos+' minutos</b> en total.':'No hay límite de tiempo total.']];
 if(anyP)reglas.push(['bombilla','Cada pregunta tiene un <b>tiempo para pensar</b>: las opciones se desbloquean al terminar.']);
 if(anyL)reglas.push(['reloj','Algunas preguntas tienen <b>tiempo máximo</b> para responder.']);
 if(OP.volver===false)reglas.push(['candado','<b>No podrás volver</b> a preguntas anteriores.']);
 if(F.modo!=='off')reglas.push(['escudo',F.modo==='registrar'?'Se <b>registra</b> si sales de la prueba.':F.modo==='estricto'?'Si sales de la prueba <b>'+F.maxSalidas+' veces</b>, se entrega automáticamente.':'Si sales de la prueba verás un aviso y <b>quedará registrado</b>.']);
 reglas.push(['estrella',M.modo==='repaso'?'Es un <b>repaso</b>: puedes repetirlo y verás las respuestas al final.':'Tienes <b>'+M.intentos+' intento'+(M.intentos>1?'s':'')+'</b>.']);
 var cursos=M.cursos&&M.cursos.length?'<select id="cur" class="t"><option value="">Elige tu curso…</option>'+M.cursos.map(function(c){return '<option>'+E(c)+'</option>'}).join('')+'</select>':'<input type="text" id="cur" maxlength="20" placeholder="Ej.: 5-A">';
 pantalla('<div class="por"><div class="izq"><img class="bot" src="'+IMG+'bot_hola.webp" alt="Mascota que te saluda"><div><h1>'+E(M.area||'Prueba')+'</h1>'+(M.grado?'<div class="gr">GRADO '+E(M.grado)+'</div>':'')+'<small style="display:block;margin-top:8px">'+E(M.titulo)+'<br>'+n+' pregunta'+(n>1?'s':'')+(M.docente?' · Prof. '+E(M.docente):'')+'</small></div></div>'
 +'<div class="der"><label class="f" for="nom">Nombre completo</label><input type="text" id="nom" maxlength="70" autocomplete="name" placeholder="Nombre y apellido"><label class="f" for="cur">Curso</label>'+cursos+'<div class="reglas">'+reglas.map(function(r){return '<div><img src="'+IMG+r[0]+'.webp" alt="">'+'<span>'+r[1]+'</span></div>'}).join('')+'</div><div id="e0"></div><button class="go" id="go" disabled>🚀 Iniciar prueba</button></div></div>');
 function ok(){$('#go').disabled=!($('#nom').value.trim().length>=3&&$('#cur').value.trim())}
 $('#nom').addEventListener('input',ok);$('#cur').addEventListener('input',ok);$('#cur').addEventListener('change',ok);
 $('#go').addEventListener('click',function(){var nom=$('#nom').value.trim(),cu=$('#cur').value.trim();
  ST={nombre:nom,curso:cu,seed:Math.floor(Math.random()*2147483647),resp:{},abiertas:{},i:0,maxI:0,inicio:Date.now(),salidas:0,cid:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8),vistos:{},lockIni:{},tq:{},fraudes:[],expiradas:{}};guardar();
  if(F.pantallaCompleta){try{(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen).call(document.documentElement)}catch(e){}}
  preparar();empezar()})}

/* ---------- orden distinto para cada estudiante ---------- */
function preparar(){var rnd=PR.semilla(ST.seed),unidades=[],ult=null;
 PB.preguntas.forEach(function(q,i){if(q.estimulo&&ult&&ult.est===q.estimulo)ult.q.push(i);else{ult={est:q.estimulo||'',q:[i]};unidades.push(ult)}});
 if(M.mezclar)unidades=PR.mezclar(unidades,rnd);orden=[];unidades.forEach(function(u){u.q.forEach(function(i){orden.push(i)})});
 PB.preguntas.forEach(function(q){if(q.tipo==='abierta')return;var ix=q.opciones.map(function(_,k){return k});opts[q.id]=(q.fijo||OP.mezclarOpc===false)?ix:PR.mezclar(ix,rnd)})}

/* ---------- prueba ---------- */
function empezar(){if(iniciado)return;iniciado=true;pinta();vigilar();tick=setInterval(reloj,250);
 window.addEventListener('beforeunload',function(e){if(ST&&!ST.enviado&&!VISTA){e.preventDefault();e.returnValue=''}});
 window.addEventListener('online',function(){if(ST&&ST.pendiente)entregar(ST.forzada)});reloj()}
function reloj(){if(!ST||ST.enviado||enviando)return;var ahora=Date.now(),dt=Math.min(2,(ahora-ultTick)/1000);ultTick=ahora;
 // total
 if(M.minutos){var r=Math.max(0,ST.inicio+M.minutos*60000-ahora),m=Math.floor(r/60000),s=Math.floor(r%60000/1000),tm=$('#tm');tm.hidden=false;tm.textContent='⏱ '+m+':'+(s<10?'0':'')+s;tm.classList.toggle('u',r<60000);if(r<=0&&!VISTA){entregar('tiempo');return}if(r<=0&&VISTA){entregar('tiempo');return}}
 if(!document.hidden&&!frActivo&&orden.length&&ST.i<orden.length){var q=qActual();ST.tq[q.id]=(ST.tq[q.id]||0)+dt;
  var lim=limiteDe(q),pen=piensaDe(q);
  // candado para pensar
  var lk=$('#cand');if(lk){var ini=ST.lockIni[q.id],rest=Math.max(0,(ini+pen*1000-ahora)/1000);
   if(rest<=0){var ops=document.querySelectorAll('.op');ops.forEach(function(o){o.disabled=!!ST.expiradas[q.id]});lk.remove();var os=$('.ops');if(os){os.classList.add('libre')}}
   else{$('#candN').textContent=Math.ceil(rest);$('#candFg').style.strokeDashoffset=String(213.6*(1-rest/pen))}}
  // límite para responder
  var lb=$('#limFill');if(lim>0&&lb&&!ST.expiradas[q.id]){var t0=ST.lockIni[q.id]+pen*1000,usado=(ahora-t0)/1000;if(usado<0)lb.style.width='100%';else{lb.style.width=Math.max(0,100-usado/lim*100)+'%';$('#limN').textContent=Math.max(0,Math.ceil(lim-usado))+' s';
    if(usado>=lim){ST.expiradas[q.id]=true;guardar();if(ST.i<orden.length-1){ST.i++;ST.maxI=Math.max(ST.maxI,ST.i);guardar();pinta()}else{revision()}}}}}
 if(Math.round(ahora/1000)%5===0)guardar()}
function iniciarPregunta(q){if(ST.lockIni[q.id]===undefined){ST.lockIni[q.id]=Date.now();ST.vistos[q.id]=true;guardar()}}
function grafico(o){var h='';if(o.img&&/^data:image\/(webp|png|jpeg);base64,/.test(o.img))h+='<img class="gimg" alt="Imagen de apoyo de la pregunta" src="'+o.img+'">';
 if(o.vis&&o.vis.t==='tabla')h+='<table class="gtab">'+(o.vis.titulo?'<caption>'+E(o.vis.titulo)+'</caption>':'')+'<tr>'+o.vis.headers.map(function(x){return '<th>'+E(x)+'</th>'}).join('')+'</tr>'+o.vis.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+E(c)+'</td>'}).join('')+'</tr>'}).join('')+'</table>';
 if(o.vis&&o.vis.t==='texto')h+='<div class="gbox">'+(o.vis.titulo?'<b>'+E(o.vis.titulo)+'</b>':'')+E(o.vis.texto)+(o.vis.fuente?'<small>'+E(o.vis.fuente)+'</small>':'')+'</div>';
 if(h&&o.leyenda)h+='<div class="gcap">'+E(o.leyenda)+'</div>';return h}
function barra(){var d=$('#dots');d.hidden=false;d.innerHTML=orden.map(function(ix,p){var q=PB.preguntas[ix],r=q.tipo==='abierta'?(ST.abiertas[q.id]||'').trim():ST.resp[q.id]!==undefined,c=p===ST.i?'ac':ST.expiradas[q.id]&&!r?'ex':r?'si':'';var puede=OP.volver!==false||p<=ST.maxI;return '<button class="'+c+'" data-p="'+p+'" aria-label="Pregunta '+(p+1)+'"'+(puede?'':' disabled')+'></button>'}).join('')}
function pinta(){if(ST.i>=orden.length){revision();return}var q=qActual();iniciarPregunta(q);barra();
 var pen=piensaDe(q),lim=limiteDe(q),rest=Math.max(0,(ST.lockIni[q.id]+pen*1000-Date.now())/1000),exp=!!ST.expiradas[q.id],bloq=rest>0||exp,h='<div class="card noselect">';
