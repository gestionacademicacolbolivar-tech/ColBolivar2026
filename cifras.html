<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12306e">
<title>Colegio en cifras · ColBolívar</title>
<meta name="description" content="Panel de datos del Colegio Integrado Simón Bolívar: documentos, procesos de calidad, comunidad y actividad del portal, con gráficas que se actualizan solas.">
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#2b7a3a;--gd:#1c4f27;--o:#f58220;--n:#12306e;--r:#d92d3a;--ink:#16241b;--mut:#4a5b50;--bg:#eef4ee;--card:#fff;--line:#d3e0d5}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font:17px/1.5 Nunito,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{font-family:Sora,Nunito,sans-serif;line-height:1.15;color:var(--gd)}
a{color:inherit}a:focus-visible,button:focus-visible{outline:3px solid var(--o);outline-offset:3px}
.top{background:linear-gradient(135deg,#0b1a44,#12306e 60%,#1c4f27);color:#fff;position:relative;overflow:hidden;isolation:isolate}
.top:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(500px 220px at 85% 0,rgba(255,200,70,.25),transparent 70%),repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 38px),repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 38px)}
.top .in{max-width:1180px;margin:0 auto;padding:16px clamp(14px,3vw,30px) 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top img{width:64px;height:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.top h1{color:#fff;font-size:clamp(1.4rem,4vw,2.2rem)}.top p{opacity:.85;font-size:.95rem}
.top .back{margin-left:auto;text-decoration:none;font-weight:700;font-size:.9rem;padding:.45em 1em;border:1px solid rgba(255,255,255,.5);border-radius:999px;transition:background .2s}
.top .back:hover{background:rgba(255,255,255,.16)}
main{max-width:1180px;margin:0 auto;padding:16px clamp(14px,3vw,30px) 40px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:-34px;position:relative}
.kpi{background:var(--card);border-radius:16px;padding:14px 16px;border:1px solid var(--line);border-top:4px solid var(--c,var(--g));box-shadow:0 8px 20px rgba(12,42,24,.1)}
.kpi b{display:block;font:800 clamp(1.6rem,4.2vw,2.4rem)/1 Sora,sans-serif;color:var(--c,var(--g))}.kpi span{font-size:.88rem;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 6px 16px rgba(12,42,24,.07)}
.card.w2{grid-column:1/-1}.card h2{font-size:1.08rem}.card .sub{color:var(--mut);font-size:.86rem;margin:2px 0 12px}
.bars{display:grid;gap:10px}.bar .t{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;font-weight:700}.bar .t small{font-weight:600;color:var(--mut)}
.bar .rail{height:14px;border-radius:99px;background:#e6efe7;overflow:hidden;margin-top:4px}
.bar .fill{height:100%;width:0;border-radius:99px;background:var(--c,var(--g));transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.bar .fill.b2{background:var(--c2,#9bc7a4);margin-top:0}
.show .fill{width:var(--w)}
.row2{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.leg{display:grid;gap:6px;font-size:.9rem}.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;background:var(--c)}
svg text{font-family:Nunito,sans-serif}svg.line{max-height:200px}
.donut circle{fill:none;stroke-width:22;transition:stroke-dasharray 1.3s cubic-bezier(.2,.8,.2,1)}
.cols{display:flex;align-items:flex-end;gap:5px;height:130px;margin-top:8px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%;font-size:.7rem;color:var(--mut)}
.col i{display:block;width:100%;border-radius:6px 6px 0 0;background:linear-gradient(var(--o),#ffb455);height:0;transition:height 1.1s cubic-bezier(.2,.8,.2,1)}
.show .col i{height:var(--h)}.col.cur i{background:linear-gradient(var(--g),#5fb26f)}
.line path.l{fill:none;stroke:var(--g);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1200;stroke-dashoffset:1200;transition:stroke-dashoffset 1.8s ease}
.show .line path.l{stroke-dashoffset:0}.line path.a{fill:url(#ga);opacity:0;transition:opacity 1.2s .8s}.show .line path.a{opacity:1}
.line circle{fill:#fff;stroke:var(--g);stroke-width:2.5}
.pend{display:grid;place-items:center;text-align:center;gap:6px;min-height:150px;border:2px dashed #b9cdbc;border-radius:12px;padding:14px;color:var(--mut);font-size:.9rem}
.pend b{color:var(--gd);font-size:1rem}code{background:#eef4ee;padding:.05em .4em;border-radius:5px;font-size:.88em}
.foot{margin-top:18px;text-align:center;color:var(--mut);font-size:.86rem}
.live{display:inline-flex;align-items:center;gap:6px}.live:before{content:"";width:9px;height:9px;border-radius:50%;background:#2fbf5b;box-shadow:0 0 0 0 rgba(47,191,91,.6);animation:lp 2s infinite}
@keyframes lp{70%{box-shadow:0 0 0 8px rgba(47,191,91,0)}100%{box-shadow:0 0 0 0 rgba(47,191,91,0)}}
@media(max-width:820px){.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.row2{grid-template-columns:1fr;justify-items:center}.top .back{margin-left:0}}
@media(prefers-reduced-motion:reduce){.live:before{animation:none}}
</style>
</head>
<body>
<header class="top"><div class="in"><img src="assets/img/escudo.webp" alt="Escudo del colegio"><div><h1>Colegio en cifras</h1><p>Datos reales del portal, actualizados automáticamente cada noche.</p></div><a class="back" href="index.html">← Volver al portal</a></div></header>
<main id="app" aria-live="polite"><p class="foot">Cargando datos…</p></main>
<script>
(function(){
var $=function(q,r){return (r||document).querySelector(q)},E=function(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var RM=matchMedia('(prefers-reduced-motion:reduce)').matches,MES=['E','F','M','A','M','J','J','A','S','O','N','D'],COL=['#2b7a3a','#f58220','#12306e','#d92d3a','#7a4fb5'];
var fmt=function(n){return Number(n).toLocaleString('es-CO')};
function kpi(n,l,c){return '<div class="kpi" style="--c:'+c+'"><b data-n="'+n+'">0</b><span>'+l+'</span></div>'}
function barras(items,max,sub){return '<div class="bars">'+items.map(function(x){return '<div class="bar" style="--c:'+(x.c||'var(--g)')+'"><div class="t"><span>'+E(x.l)+'</span><small>'+E(x.s||'')+'</small></div><div class="rail"><div class="fill" style="--w:'+Math.max(3,Math.round(x.v/max*100))+'%"></div></div></div>'}).join('')+'</div>'}
function dona(items){var tot=items.reduce(function(a,x){return a+x.v},0)||1,R=70,C=2*Math.PI*R,off=0,svg='<svg class="donut" viewBox="0 0 200 200" width="170" height="170" role="img" aria-label="Distribución por sede"><g transform="rotate(-90 100 100)">';
 items.forEach(function(x){var L=x.v/tot*C;svg+='<circle cx="100" cy="100" r="'+R+'" stroke="'+x.c+'" stroke-dasharray="0 '+C+'" data-d="'+L+' '+(C-L)+'" stroke-dashoffset="'+(-off)+'"/>';off+=L});
 return svg+'</g><text x="100" y="104" text-anchor="middle" font-size="30" font-weight="800" fill="#1c4f27">'+fmt(tot)+'</text><text x="100" y="124" text-anchor="middle" font-size="12" fill="#4a5b50">personas</text></svg>'}
function cols(vals,cur){var m=Math.max.apply(null,vals.concat([1]));return '<div class="cols">'+vals.map(function(v,i){return '<div class="col'+(i===cur?' cur':'')+'" title="'+v+'"><span>'+v+'</span><i style="--h:'+Math.max(4,Math.round(v/m*100))+'%"></i><span>'+MES[i]+'</span></div>'}).join('')+'</div>'}
function linea(pts,etq){var W=520,H=170,p=26,m=Math.max.apply(null,pts.map(function(x){return x.v}).concat([1])),n=pts.length,xs=function(i){return p+i*(W-2*p)/Math.max(1,n-1)},ys=function(v){return H-p-(v/m)*(H-2*p)};
 var d=pts.map(function(x,i){return (i?'L':'M')+xs(i).toFixed(1)+' '+ys(x.v).toFixed(1)}).join(' ');
 return '<svg class="line" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Serie"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b7a3a" stop-opacity=".35"/><stop offset="1" stop-color="#2b7a3a" stop-opacity="0"/></linearGradient></defs><path class="a" d="'+d+' L'+xs(n-1)+' '+(H-p)+' L'+xs(0)+' '+(H-p)+'Z"/><path class="l" d="'+d+'"/>'
  +pts.map(function(x,i){return '<circle cx="'+xs(i).toFixed(1)+'" cy="'+ys(x.v).toFixed(1)+'" r="4"><title>'+E(x.e)+': '+x.v+'</title></circle>'+(i%Math.ceil(n/6)===0||i===n-1?'<text x="'+xs(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="11" fill="#4a5b50">'+E(x.e)+'</text>':'')}).join('')+'</svg>'}
function pend(t,msg){return '<div class="pend"><b>'+t+'</b><span>'+msg+'</span></div>'}
fetch('datos/cifras-auto.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(D){
 var d=D.documentos,a=D.aria,q=D.calidad,c=D.comunidad,ac=D.actividad,mn=D.manual||{},h='';
 var ev=q.evidencias;
 h+='<div class="kpis">'+kpi(d.total,'documentos institucionales',COL[0])+kpi(d.paginas,'páginas de documentos',COL[1])+kpi(a.temas,'temas que ARIA responde al instante',COL[2])+kpi(a.fragmentos,'fragmentos de texto buscables',COL[3])+'</div><div class="grid">';
 var mx=Math.max.apply(null,d.por_categoria.map(function(x){return x.n}));
 h+='<section class="card"><h2>Documentos por categoría</h2><p class="sub">PDF publicados en el portal y sus páginas.</p>'+barras(d.por_categoria.map(function(x,i){return{l:x.c,v:x.n,c:COL[i%5],s:x.n+' docs · '+fmt(x.p)+' págs.'}}),mx)+'</section>';
 var mp=Math.max.apply(null,q.gestiones.map(function(g){return g.subprocesos}).concat([1]));
 h+='<section class="card"><h2>Procesos de calidad</h2><p class="sub">Subprocesos documentados por gestión · '+ev+' evidencias del PEI enlazadas.</p>'+barras(q.gestiones.map(function(g){return{l:(g.emoji||'')+' '+g.nombre,v:g.subprocesos,c:g.color,s:g.procesos+' procesos · '+g.subprocesos+' subprocesos'}}),mp)+'</section>';
 var sed=Object.keys(c.por_sede).sort().map(function(k,i){return{l:'Sede '+k,v:c.por_sede[k],c:COL[i%5]}});
 h+='<section class="card"><h2>Comunidad por sede</h2><p class="sub">Personas registradas en el calendario de cumpleaños.</p><div class="row2">'+dona(sed)+'<div class="leg">'+sed.map(function(x){return '<div><i style="--c:'+x.c+'"></i>'+x.l+': <b>'+x.v+'</b></div>'}).join('')+'</div></div></section>';
 h+='<section class="card"><h2>Cumpleaños por mes</h2><p class="sub">El mes actual aparece en verde.</p>'+cols(c.por_mes,new Date().getMonth())+'</section>';
 h+='<section class="card w2"><h2>Actividad del portal</h2><p class="sub"><span class="live">Última actualización de contenidos: '+E(ac.ultimo_cambio||'—')+'</span> · cambios publicados por semana (últimas 12).</p>'+linea(ac.semanas.map(function(x){return{e:x.s.slice(5),v:x.n}}))+'</section>';
 var mt=mn.matricula||{},ps=mt.por_sede||[],pn=mt.por_nivel||[];
 h+='<section class="card"><h2>Matrícula '+(mt.anio||'')+'</h2><p class="sub">Estudiantes por sede y nivel (datos oficiales).</p>'+((ps.length||pn.length)?barras((ps.length?ps:pn).map(function(x,i){return{l:x.n,v:x.v,c:COL[i%5],s:fmt(x.v)}}),Math.max.apply(null,(ps.length?ps:pn).map(function(x){return x.v}))):pend('Pendiente de datos oficiales','Rectoría puede cargarlos en <code>datos/cifras-manual.json</code> y la gráfica aparece sola.'))+'</section>';
 var ic=(mn.icfes||{}).serie||[];
 h+='<section class="card"><h2>Resultados ICFES (puntaje global)</h2><p class="sub">Evolución por año.</p>'+(ic.length>1?linea(ic.map(function(x){return{e:String(x.a),v:x.v}})):pend('Pendiente de datos oficiales','Se necesitan al menos 2 años en <code>icfes.serie</code> de <code>datos/cifras-manual.json</code>.'))+'</section>';
 var vs=(mn.visitas||{}).serie||[];
 h+='<section class="card w2"><h2>Uso del portal</h2><p class="sub">Visitas por mes.</p>'+(vs.length>1?linea(vs.map(function(x){return{e:x.e,v:x.v}})):pend('Pendiente de un contador de visitas','Se puede conectar un contador gratuito (p. ej. GoatCounter) y cargar las visitas mensuales en <code>visitas.serie</code>.'))+'</section>';
 h+='</div><p class="foot">Datos generados el '+E((D.generado||'').slice(0,10))+' · se actualizan solos cada noche · base: documentos publicados, procesos de calidad, base de ARIA y calendario de la comunidad.</p>';
 $('#app').innerHTML=h;
 /* animaciones al aparecer */
 function contar(el){var n=+el.dataset.n,t0=null;if(RM){el.textContent=fmt(n);return}requestAnimationFrame(function f(t){t0=t0||t;var k=Math.min(1,(t-t0)/1200);el.textContent=fmt(Math.round(n*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(f)})}
 function mostrar(el){el.classList.add('show');[].forEach.call(el.querySelectorAll('[data-n]'),contar);[].forEach.call(el.querySelectorAll('circle[data-d]'),function(c){c.setAttribute('stroke-dasharray',c.dataset.d)})}
 var io=('IntersectionObserver' in window&&!RM)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){mostrar(e.target);io.unobserve(e.target)}})},{threshold:.2}):null;
 [].forEach.call(document.querySelectorAll('.kpis,.card'),function(el){io?io.observe(el):mostrar(el)});
}).catch(function(){$('#app').innerHTML='<p class="foot">No se pudieron cargar los datos. Intenta de nuevo en unos minutos.</p>'});
})();
</script>
</body>
</html>
