/* ====== ARIA AVATAR VISUAL v1.6 — estilos del widget flotante y arrastrable ====== */
/* Los !important en las imágenes evitan que estilos globales del HTML de la clase (ej. img{...}) recorten o deformen el avatar de ARIA */
#aria-fab{
  position:fixed; right:18px; bottom:100px; z-index:9999;
  width:112px; border:none; background:transparent; padding:0; cursor:grab;
  filter:drop-shadow(0 8px 14px rgba(30,20,90,.28));
  touch-action:none; user-select:none; -webkit-user-select:none;
  animation:aria-fab-respirar 3.2s ease-in-out infinite;
  transition:transform .15s ease;
}
#aria-fab:hover{ transform:scale(1.06); animation-play-state:paused; }
@keyframes aria-fab-respirar{
  0%,100%{ transform:translateY(0) scale(1); }
  50%{ transform:translateY(-3px) scale(1.015); }
}
#aria-fab img{
  width:100% !important; height:auto !important; max-width:100% !important; max-height:none !important;
  min-width:0 !important; min-height:0 !important; object-fit:contain !important;
  display:block !important; pointer-events:none; flex-shrink:0;
  transition:opacity .12s ease;
}
#aria-fab:active{ cursor:grabbing; animation:none; }
#aria-fab.aria-arrastrando{ filter:drop-shadow(0 12px 20px rgba(30,20,90,.4)); animation:none; }

#aria-panel{
  display:none; flex-direction:column; gap:10px;
  width:330px; max-width:90vw; background:#fff; border-radius:18px;
  box-shadow:0 16px 40px rgba(30,20,90,.22); padding:14px;
  position:fixed; right:18px; bottom:18px; z-index:9999;
  transform-origin:bottom right;
}
#aria-panel.aria-abierto{ display:flex; animation:aria-panel-abrir .22s cubic-bezier(.2,.9,.3,1.2); }
@keyframes aria-panel-abrir{
  from{ opacity:0; transform:scale(.92) translateY(10px); }
  to{ opacity:1; transform:scale(1) translateY(0); }
}

.aria-panel-header{ display:flex; align-items:center; gap:10px; }
.aria-panel-header img{
  width:78px !important; height:auto !important; max-width:none !important; max-height:none !important;
  min-width:0 !important; min-height:0 !important; object-fit:contain !important;
  display:block !important; flex-shrink:0;
  transition:opacity .12s ease;
}
.aria-panel-titulo{ flex:1; display:flex; flex-direction:column; line-height:1.15; }
.aria-panel-titulo strong{ color:#4E3CC9; font-size:15px; }
.aria-panel-titulo span{ font-size:11px; color:#888; }
#aria-cerrar-btn{
  border:none; background:#F1F1F4; color:#555; width:30px; height:30px; border-radius:50%;
  font-size:15px; cursor:pointer; line-height:1; align-self:flex-start;
  transition:background .15s ease, transform .15s ease;
}
#aria-cerrar-btn:hover{ background:#E3505A; color:#fff; transform:rotate(90deg); }

/* Espacio de chat real: aquí queda visible todo el historial de la conversación */
#aria-chat{
  background:#F7F7FB; border-radius:14px; padding:10px;
  height:260px; overflow-y:auto; line-height:1.4;
  display:flex; flex-direction:column; gap:8px;
  scroll-behavior:smooth;
}
#aria-chat::-webkit-scrollbar{ width:6px; }
#aria-chat::-webkit-scrollbar-thumb{ background:#D8D3FF; border-radius:6px; }
.aria-msg{
  max-width:82%; padding:9px 12px; border-radius:14px; font-size:13.5px;
  color:#333; word-wrap:break-word; animation:aria-aparecer .18s cubic-bezier(.2,.8,.3,1.1);
}
.aria-msg a{ color:#4E3CC9; }
@keyframes aria-aparecer{ from{ opacity:0; transform:translateY(6px) scale(.98);} to{ opacity:1; transform:translateY(0) scale(1);} }
.aria-msg-aria{
  align-self:flex-start; border-bottom-left-radius:4px;
  background:linear-gradient(135deg,#F4F2FF,#ECFBFF); border:1.5px solid #E4DDFF;
}
.aria-msg-usuario{
  align-self:flex-end; border-bottom-right-radius:4px;
  background:#6C63FF; color:#fff; border:1.5px solid #6C63FF;
}

/* Botón de voz: grande, visible, cambia de color según el estado — nunca ambiguo */
#aria-voz-btn{
  border:none; border-radius:14px; padding:12px 10px; font-size:14px; font-weight:700;
  cursor:pointer; width:100%; transition:background .15s ease;
}
#aria-voz-btn.aria-voz-off{ background:#E7E7EE; color:#555; }
#aria-voz-btn.aria-voz-on{ background:#22C55E; color:#fff; }

.aria-input-fila{ display:flex; gap:8px; }
#aria-input{
  flex:1; border:1.5px solid #DDD; border-radius:12px; padding:10px 12px; font-size:13.5px; outline:none;
}
#aria-input:focus{ border-color:#6C63FF; }
#aria-enviar-btn{
  border:none; background:#6C63FF; color:#fff; width:42px; border-radius:12px; font-size:16px; cursor:pointer;
}
#aria-enviar-btn:hover{ background:#4E3CC9; }

@media (max-width:420px){
  #aria-panel{ width:82vw; }
  #aria-fab{ width:92px; }
}

/* Indicador "ARIA está pensando..." — vive dentro del chat como una burbuja más */
.aria-escribiendo{ display:flex; gap:5px; padding:10px 12px; }
.aria-escribiendo span{
  width:8px; height:8px; border-radius:50%; background:#B3A6FF;
  animation:aria-rebote 1s infinite ease-in-out;
}
.aria-escribiendo span:nth-child(2){ animation-delay:.15s; }
.aria-escribiendo span:nth-child(3){ animation-delay:.3s; }
@keyframes aria-rebote{
  0%,60%,100%{ transform:translateY(0); opacity:.5; }
  30%{ transform:translateY(-6px); opacity:1; }
}

/* Input más amigable, con foco visible y bonito */
#aria-input{ border-radius:16px; background:#FAFAFC; transition:background .15s ease, box-shadow .15s ease; }
#aria-input:focus{ background:#fff; box-shadow:0 0 0 3px rgba(108,99,255,.15); }
#aria-enviar-btn{
  border-radius:16px; box-shadow:0 3px 8px rgba(108,99,255,.35);
  transition:transform .12s ease, box-shadow .12s ease;
}
#aria-enviar-btn:hover{ transform:translateY(-1px); box-shadow:0 5px 12px rgba(108,99,255,.45); }
#aria-enviar-btn:active{ transform:translateY(0) scale(.96); }
#aria-voz-btn{ transition:background .15s ease, transform .1s ease; }
#aria-voz-btn:hover{ transform:translateY(-1px); }
#aria-voz-btn:active{ transform:translateY(0) scale(.97); }

/* Pequeño "rebote" en el avatar cuando llega una respuesta nueva — sensación de vida */
.aria-rebotar{ animation:aria-rebote-avatar .35s ease; }
@keyframes aria-rebote-avatar{
  0%{ transform:scale(1); } 40%{ transform:scale(1.08); } 100%{ transform:scale(1); }
}
</style>

<script>
let intentosQuizDemo = 0;
function responderQuizDemo(btn, esCorrecta){
  const fb = document.getElementById('quiz-demo-feedback');
  const botones = document.querySelectorAll('#quiz-demo-opciones button');
  botones.forEach(b => b.disabled = true);
  if (esCorrecta){
    fb.textContent = '✅ ¡Correcto!';
    if (window.ariaSonar) ariaSonar('acierto');
    if (window.ariaReaccionar) ariaReaccionar('correcto');
    intentosQuizDemo = 0;
    setTimeout(() => botones.forEach(b => b.disabled = false), 1200);
    return;
  }
  intentosQuizDemo++;
  if (window.ariaSonar) ariaSonar('falloSuave');
  if (intentosQuizDemo >= 2){
    fb.textContent = '';
    if (window.ariaReaccionar) ariaReaccionar('dificil');
    // Este quiz no tiene un método propio en el banco (es de la clase, no de METODOS_ARIA),
    // así que aquí se dispara un mensaje proactivo genérico. Si la pregunta SÍ correspondiera
    // a un método del banco, en vez de este texto fijo se llamaría:
    //   registrarFalloQuizComoMetodoAria('el_id_del_metodo')  y luego reusar cascadaDeIntentosAria
    if (window.ARIA_MENSAJE_PROACTIVO){
      window.ARIA_MENSAJE_PROACTIVO('Vi que esta pregunta te ha costado un par de intentos 😊 Un ángulo recto es el que forma una "L" perfecta, como la esquina de una hoja de papel — mide exactamente 90°. ¿Quieres que te explique cómo medirlo con un transportador?', 'triste');
    }
    intentosQuizDemo = 0;
  } else {
    fb.textContent = '❌ Casi... inténtalo una vez más.';
    setTimeout(() => botones.forEach(b => b.disabled = false), 600);
  }
}
</script>

<script>
// ═══════════════════════════════════════════════════════════════════════
// v2.8.0 — ARIA_FX: efectos visuales del avatar (cambio suave de expresión, aura de color,
// ráfagas de partículas por emoción, modo "pensando" y modo "hablando").
// Solo usa animaciones del navegador (sin librerías) y se puede apagar con el botón
// "✨ Efectos". Respeta "reducir movimiento" del sistema. No toca la lógica de seguridad de ARIA.
// ═══════════════════════════════════════════════════════════════════════
(function(){
  const reducir = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  let activo = !reducir;
  try { const g = localStorage.getItem('aria_efectos'); if (g !== null) activo = (g === '1'); } catch(e){ /* sin almacenamiento */ }
  window.__ariaHablaTk = 0;

  const puedeAnimar = () => activo && typeof Element.prototype.animate === 'function';
  const imgs = () => [document.getElementById('aria-avatar-img'), document.getElementById('aria-fab-img')].filter(Boolean);
  const panelAbierto = () => { const p = document.getElementById('aria-panel'); return !!(p && p.classList.contains('aria-abierto')); };

  const COLORES = { logro:'#FFC53D', genial:'#FFB020', carino:'#FF5C9A', animo:'#35C28A', motivacion:'#FF8A3D',
    academico:'#6C63FF', pista:'#2EB5FF', practica:'#7B61FF', duda:'#8E8AFF', confundida:'#9AA0B5', pena:'#F28BA8',
    triste:'#6D8CE0', saludo:'#6C63FF', despedida:'#8E8AFF', alerta:'#E3505A', pensando:'#A89BFF', dormida:'#7A86B6', regalo:'#FF5C9A', habla:'#6C63FF' };
  const PARTICULAS = { logro:['🎉','⭐','✨','🎊'], genial:['⭐','✨','🌟'], carino:['💜','💖','✨'], animo:['💪','✨','🔥'],
    motivacion:['🚀','✨','⭐'], academico:['💡','✨','📘'], pista:['🔎','💡','✨'], practica:['✏️','🧮','✨'],
    duda:['❓','🤔'], confundida:['❓','💭'], pena:['💧','😅'], triste:['💧','💙'], saludo:['👋','✨'],
    despedida:['👋','✨','💜'], dormida:['💤'], regalo:['🎁','✨'] };
  const EXPLOSIVAS = ['logro','genial','animo','motivacion','regalo','saludo','despedida'];
  let vivas = 0;

  // Cambio suave de expresión: baja un poco, cambia la imagen ya decodificada y vuelve con un destello.
  function cambiar(els, src){
    (els || []).filter(Boolean).forEach(el => {
      if (!el.getAttribute('src') || !puedeAnimar()){ el.src = src; return; }
      if (el.getAttribute('src') === src) return;
      const tok = (el.__fxTok = (el.__fxTok || 0) + 1);
      let a1;
      try { a1 = el.animate([{ opacity:1 }, { opacity:.15 }], { duration:90, fill:'forwards' }); }
      catch(e){ el.src = src; return; }
      a1.finished.then(() => {
        if (el.__fxTok !== tok){ a1.cancel(); return; }
        el.src = src;
        return (el.decode ? el.decode() : Promise.resolve()).catch(() => {});
      }).then(() => {
        if (el.__fxTok !== tok){ a1.cancel(); return; }
        a1.cancel();
        el.animate([{ opacity:.15, filter:'brightness(1.35)' }, { opacity:1, filter:'brightness(1)' }], { duration:240, easing:'ease-out' });
      }).catch(() => { a1.cancel(); el.src = src; });
    });
  }

  function aura(categoria, el){
    const c = COLORES[categoria] || COLORES.pensando;
    try {
      el.animate([
        { filter:'drop-shadow(0 0 0 transparent)' },
        { filter:'drop-shadow(0 0 18px ' + c + ') drop-shadow(0 0 7px ' + c + ')', offset:.35 },
        { filter:'drop-shadow(0 0 0 transparent)' }
      ], { duration:1500, easing:'ease-in-out' });
    } catch(e){}
  }

  function rafaga(categoria, el){
    const lista = PARTICULAS[categoria]; if (!lista) return;
    const r = el.getBoundingClientRect(); if (!r.width) return;
    const cx = r.left + r.width / 2, cy = r.top + r.height * 0.38;
    const n = EXPLOSIVAS.includes(categoria) ? 12 : 6;
    for (let i = 0; i < n && vivas < 28; i++){
      const sp = document.createElement('span');
      sp.className = 'aria-fx-particula';
      sp.textContent = lista[Math.floor(Math.random() * lista.length)];
      sp.style.left = (cx - 11) + 'px'; sp.style.top = (cy - 11) + 'px';
      sp.style.fontSize = (16 + Math.random() * 14) + 'px';
      document.body.appendChild(sp); vivas++;
      let dx, dy;
      if (EXPLOSIVAS.includes(categoria)){
        const ang = Math.random() * Math.PI, rad = 55 + Math.random() * 70;
        dx = Math.cos(ang) * rad * (Math.random() < .5 ? -1 : 1); dy = -Math.abs(Math.sin(ang)) * rad - 25;
      } else { dx = (Math.random() - .5) * 70; dy = -(55 + Math.random() * 60); }
      const giro = (Math.random() - .5) * 120, dur = 1000 + Math.random() * 700, retraso = i * 55;
      const fin = () => { sp.remove(); vivas = Math.max(0, vivas - 1); };
      try {
        const an = sp.animate([
          { transform:'translate(0,0) scale(.3) rotate(0deg)', opacity:0 },
          { transform:'translate(' + (dx * .5) + 'px,' + (dy * .5) + 'px) scale(1.1) rotate(' + (giro * .5) + 'deg)', opacity:1, offset:.35 },
          { transform:'translate(' + dx + 'px,' + dy + 'px) scale(.8) rotate(' + giro + 'deg)', opacity:0 }
        ], { duration:dur, delay:retraso, easing:'cubic-bezier(.2,.7,.3,1)', fill:'both' });
        an.onfinish = fin; an.oncancel = fin;
      } catch(e){ fin(); }
    }
  }

  // Reacción completa a una respuesta de ARIA: aura de color + ráfaga de partículas.
  function reaccionar(categoria){
    if (!puedeAnimar()) return;
    const visible = document.getElementById(panelAbierto() ? 'aria-avatar-img' : 'aria-fab-img');
    imgs().forEach(el => aura(categoria, el));
    if (visible) rafaga(categoria, visible);
  }

  // Modos continuos (pensando / hablando): se guardan para poder cancelarlos.
  function modoContinuo(clave, on, mov, brillo, duracion){
    imgs().forEach(el => {
      (el[clave] || []).forEach(a => { try { a.cancel(); } catch(e){} });
      el[clave] = [];
      if (!on || !puedeAnimar()) return;
      try {
        el[clave].push(el.animate(mov, { duration:duracion, direction:'alternate', iterations:Infinity, easing:'ease-in-out' }));
        el[clave].push(el.animate(brillo, { duration:duracion * 1.4, direction:'alternate', iterations:Infinity, easing:'ease-in-out' }));
      } catch(e){}
    });
  }
  function pensando(on){
    const c = COLORES.pensando;
    modoContinuo('__fxPens', on,
      [{ transform:'rotate(-3deg) translateY(0)' }, { transform:'rotate(3deg) translateY(-2px)' }],
      [{ filter:'drop-shadow(0 0 2px ' + c + ')' }, { filter:'drop-shadow(0 0 13px ' + c + ')' }], 650);
  }
  let hablaTimer = null;
  function hablando(on, ms){
    clearTimeout(hablaTimer);
    const c = COLORES.habla;
    modoContinuo('__fxHabla', on,
      [{ transform:'scale(1)' }, { transform:'scale(1.045)' }],
      [{ filter:'drop-shadow(0 0 2px ' + c + ')' }, { filter:'drop-shadow(0 0 11px ' + c + ')' }], 340);
    // Red de seguridad: si el navegador nunca avisa que terminó de hablar, se apaga solo.
    if (on) hablaTimer = setTimeout(() => modoContinuo('__fxHabla', false), Math.min(60000, ms || 20000));
  }
  let ultimoPulso = 0;
  function palabra(){
    if (!puedeAnimar()) return;
    const t = Date.now(); if (t - ultimoPulso < 130) return; ultimoPulso = t;
    imgs().forEach(el => { try { el.animate([{ transform:'scale(1)' }, { transform:'scale(1.07)' }, { transform:'scale(1)' }], { duration:170 }); } catch(e){} });
  }

  // Botón "✨ Efectos"
  const btn = document.getElementById('aria-efectos-btn');
  function pintarBoton(){
    if (!btn) return;
    btn.textContent = activo ? '✨ Efectos: activados' : '🚫 Efectos: apagados';
    btn.classList.toggle('aria-voz-on', activo);
    btn.classList.toggle('aria-voz-off', !activo);
  }
  if (btn){
    pintarBoton();
    btn.addEventListener('click', () => {
      activo = !activo;
      try { localStorage.setItem('aria_efectos', activo ? '1' : '0'); } catch(e){}
      if (!activo){ pensando(false); modoContinuo('__fxHabla', false); }
      pintarBoton();
    });
  }

  window.ARIA_FX = { cambiar, reaccionar, pensando, hablando, palabra, get activo(){ return activo; } };
})();
</script>

<script>
function normalizaTexto(t){
  return (t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}
function elegirAlAzar(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function escaparHtmlAria(t){
  const d = document.createElement('div');
  d.textContent = String(t);
  return d.innerHTML;
}

function responderAriaBase(pregunta){
  const n = normalizaTexto(pregunta);
  if (/tonta|tonto|estupid|fea|feo|callate|odio esto/.test(n)) return 'Eso no se dice 😕 Aquí nos tratamos con respeto — sigamos con la clase, ¿sí?';
  if (/^hola|buenos dias|buenas tardes|buenas noches|q hubo|que hubo/.test(n)) return elegirAlAzar([
    '¡Hola! ¿En qué te ayudo hoy con la clase? 😊',

  ]);
  if (/chao|adios|hasta luego|nos vemos|me voy/.test(n)) return elegirAlAzar([

  if (/gracias|te quiero|eres genial/.test(n)) return elegirAlAzar([
    '¡Gracias a ti por tu cariño! Me alegra poder acompañarte 💜',
    '¡Con muchísimo gusto! Para eso estoy 😊',

  return null;
}

// básica sin sonar repetitiva ni caer en "no sé" ante preguntas comunes de

  if (arr.length <= 1) return arr[0];

  while (idx === ariaUltimoIndicePorBanco[clave]);

  return arr[idx];

const ARIA_CHISTES = [

const ARIA_CONVERSACION_SOCIAL = [
  { tema:'estado', pal:['como estas','como te sientes','que tal estas','como vas','como andas','que mas'],

  { tema:'gustos', pal:['cual es tu color favorito','cual es tu comida favorita','cual es tu animal favorito','que te gusta','cual es tu juego favorito'],
    resp: () => elegirAlAzar([

    ])},
  { tema:'real', pal:['eres un robot de verdad','eres real','existes de verdad'],
    resp: () => elegirAlAzar([
      'Soy un asistente virtual — no tengo cuerpo físico, vivo dentro del computador para acompañarte en tus clases 😊',

    ])},
  { tema:'aburrido', pal:['estoy aburrido','estoy aburrida','me aburro','no tengo nada que hacer'],
    resp: () => elegirAlAzar([
      '¡Vamos a cambiar eso! ¿Quieres que te cuente un chiste, o seguimos con la clase? 😊',

    ])},
  { tema:'feliz', pal:['estoy feliz','estoy contento','estoy contenta','que alegria'],
    resp: () => elegirAlAzar([

  { tema:'chiste', pal:['cuentame un chiste','dime un chiste','hazme reir','sabes algun chiste','cuentame algo gracioso'],

  { tema:'curiosidad', pal:['dato curioso','cuentame algo interesante','sabias que','cuentame una curiosidad','dime algo curioso'],

function respuestaConversacionSocialAria(pregunta){
  const n = normalizaTexto(pregunta);
  for (const item of ARIA_CONVERSACION_SOCIAL){
    if (item.pal.some(p => n.includes(p))){
      const r = item.resp();
      if (r){
        if (item.tema !== 'otro') ariaUltimoTemaSocial = item.tema;
        return r;
      }
    }
  }
  return null;
}

function responderAria(pregunta){
  // 🛡️ v2.5 — Filtro de lenguaje inapropiado: se revisa ANTES que cualquier otra lógica.
  if (typeof contieneLenguajeInapropiadoAria === 'function' && contieneLenguajeInapropiadoAria(pregunta)){
    return respuestaFiltroLenguajeAria(pregunta);
  }
  // 💜 v2.6 — Insinuación romántica hacia ARIA: se responde siempre de forma cálida y NO
  // romántica, y jamás debe terminar cayendo en una búsqueda de Wikipedia al azar.
  if (typeof esIntentoRomanticoAria === 'function' && esIntentoRomanticoAria(pregunta)){
    return respuestaIntentoRomanticoAria();
  }
  const base = responderAriaBase(pregunta);
  if (base) return base;
  const social = respuestaConversacionSocialAria(pregunta);
  if (social) return social;
  // ¿Pregunta por el tema/objetivo de la clase de hoy? Se resuelve aparte porque
  // casi nunca hay coincidencia literal de palabras clave con el contenido.
  if (typeof esPreguntaTemaClaseAria === 'function' && esPreguntaTemaClaseAria(pregunta)){
    return respuestaTemaClaseAria();
  }
  // Prioridad más alta: ¿el estudiante pegó o escribió (casi) literal una pregunta de quiz/evalFinal?
  // Ver Prioridad 30-B del PROMPT_MAESTRO — nunca se debe revelar la respuesta.
  if (typeof detectarPreguntaCopiadaAria === 'function'){
    const copiada = detectarPreguntaCopiadaAria(pregunta);
    if (copiada) return orientacionSocraticaAria(copiada);
  }
  if (typeof esPreguntaOrientacionAria === 'function' && esPreguntaOrientacionAria(pregunta)){
    return respuestaOrientacionSlideAria();
  }
  // Prioridad alta (v2.0): si la pregunta suena a pedido de explicación de un concepto o de
  // un proceso ("explícame...", "¿cómo se hace...?", "¿qué es...?", "¿cómo funciona...?"),
  // ARIA lee TODO el contenido ya indexado de la clase y arma una explicación completa —
  // con pasos numerados si el texto original los trae — en vez de solo un fragmento corto.
  // Nunca toca una diapositiva de tipo "quiz" (eso lo protege detectarTipoSlideAria arriba).
  //
  // v2.2 — CASCADA DE INTENTOS: en vez de un solo intento con un solo umbral, ARIA prueba,
  // en orden, el banco de métodos pedagógicos reutilizable (alta confianza), la explicación
  // profunda de ESTA clase, la búsqueda general en la clase, y por último una pasada tolerante
  // a errores de escritura sobre el banco de métodos. Solo si las 4 fallan, sigue con el
  // diccionario y, si tampoco hay nada, la respuesta honesta final (y queda registrada la duda).
  const desdeCascada = cascadaDeIntentosAria(pregunta);
  if (desdeCascada) return desdeCascada;
  const desdeDiccionario = respuestaDiccionarioAmpliadoAria(pregunta);
  if (desdeDiccionario) return desdeDiccionario;
  return elegirAlAzar([
    'No encontré información sobre ese tema en los documentos del colegio. ¿Podría reformular la pregunta o indicarme el nombre del documento?',
    'No dispongo de esa información en los documentos disponibles. Intente con otras palabras o con el nombre del documento.'
  ]);
}

<script>
// ═══════════════════════════════════════════════════════════════════════
// v2.4 — SONIDO SINTETIZADO CON WEB AUDIO API (cero archivos de audio, ~2 KB de código)
// Todos los efectos se generan con osciladores en el momento — no se descarga ni se
// incrusta ningún .mp3/.wav, así que no pesa nada extra en el HTML.
// Respeta el interruptor de sonido (localStorage) y arranca en silencio si el
// navegador no ha tenido ninguna interacción todavía (política de autoplay).
// ═══════════════════════════════════════════════════════════════════════
let ariaAudioCtx = null;
let ariaSonidoActivo = (localStorage.getItem('aria_sonido_activo') ?? '1') === '1';

function ariaObtenerAudioCtx(){
  if (!ariaAudioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ariaAudioCtx = new AC();
  }
  if (ariaAudioCtx.state === 'suspended') ariaAudioCtx.resume();
  return ariaAudioCtx;
}

// Reproduce una nota simple: frecuencia (Hz), duración (s), tipo de onda y volumen
function ariaTono(freq, duracion, tipo, volumen, retardo){
  if (!ariaSonidoActivo) return;
  const ctx = ariaObtenerAudioCtx();
  if (!ctx) return;
  const inicio = ctx.currentTime + (retardo || 0);
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = tipo || 'sine';
  osc.frequency.setValueAtTime(freq, inicio);
  gain.gain.setValueAtTime(0, inicio);
  gain.gain.linearRampToValueAtTime(volumen ?? 0.18, inicio + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, inicio + duracion);
  osc.connect(gain).connect(ctx.destination);
  osc.start(inicio);
  osc.stop(inicio + duracion + 0.02);
}

// Biblioteca de efectos — cada uno es una secuencia corta de ariaTono()
const ARIA_SONIDOS = {
  acierto:   () => { ariaTono(880,.11,'sine',.16,0); ariaTono(1318,.16,'sine',.14,.09); },
  falloSuave:() => { ariaTono(220,.16,'sine',.12,0); ariaTono(180,.18,'sine',.10,.07); },
  logro:     () => { [523,659,784,1047].forEach((f,i)=>ariaTono(f,.16,'triangle',.15,i*.09)); },
  clic:      () => { ariaTono(600,.05,'sine',.08,0); },
  notificacion:()=>{ ariaTono(740,.09,'sine',.12,0); ariaTono(988,.12,'sine',.12,.08); },
  despedida: () => { [659,523,392].forEach((f,i)=>ariaTono(f,.14,'sine',.12,i*.09)); }
};
function ariaSonar(nombre){ if (ARIA_SONIDOS[nombre]) ARIA_SONIDOS[nombre](); }
window.ariaSonar = ariaSonar;

// Interruptor de sonido — persiste entre sesiones igual que la voz
function ariaAlternarSonido(){
  ariaSonidoActivo = !ariaSonidoActivo;
  localStorage.setItem('aria_sonido_activo', ariaSonidoActivo ? '1' : '0');
  if (ariaSonidoActivo) ariaSonar('clic');
  return ariaSonidoActivo;
}
window.ariaAlternarSonido = ariaAlternarSonido;
window.ariaSonidoEstaActivo = () => ariaSonidoActivo;

// Desbloquea el audio en el primer toque del usuario (requisito de casi todos los
// navegadores móviles) sin que el profe tenga que hacer nada especial.
['pointerdown','keydown'].forEach(ev => {
  window.addEventListener(ev, () => { ariaObtenerAudioCtx(); }, { once:true, passive:true });
});

</script>

<script>
// ═══════════════════════════════════════════════════════════════════════
// v2.5 — MEMORIA DE SESIÓN COMPLETA + FILTRO DE LENGUAJE + GENERADOR DE
// EJERCICIOS + RESUMEN DE FIN DE CLASE.
// Todo lo de este archivo vive en memoria mientras dura la sesión (se
// reinicia si se recarga la página — es lo correcto: cada clase es un
// acompañamiento nuevo).
// ═══════════════════════════════════════════════════════════════════════

// ── 1) MEMORIA DE SESIÓN: qué temas se tocaron, cuántas veces, qué tan a
//    fondo se explicaron, y si costó trabajo — no solo el último mensaje. ──
const ariaSesionTemas = {}; // id del método -> { metodo, usos, nivelMax, tuvoRefuerzo, primeraVez }

function registrarTemaEnSesionAria(metodo, nivelAlcanzado, fueRefuerzo){
  let e = ariaSesionTemas[metodo.id];
  if (!e){
    e = { metodo, usos: 0, nivelMax: 0, tuvoRefuerzo: false, primeraVez: Date.now() };
    ariaSesionTemas[metodo.id] = e;
  }
  e.usos++;
  e.nivelMax = Math.max(e.nivelMax, nivelAlcanzado || 0);
  if (fueRefuerzo) e.tuvoRefuerzo = true;
  return e;
}

// Frase de conexión con un tema anterior de la MISMA materia, para que ARIA
// hable como quien recuerda la clase, no como quien responde cada pregunta
// aislada. Se usa solo la PRIMERA vez que se toca un método nuevo.
function conectarConTemaAnteriorAria(metodoNuevo){
  const previos = Object.values(ariaSesionTemas)
    .filter(e => e.metodo.id !== metodoNuevo.id && e.metodo.materia === metodoNuevo.materia)
    .sort((a,b) => b.primeraVez - a.primeraVez);
  if (!previos.length) return '';
  return `Esto se parece un poco a lo que vimos hace un rato con <strong>"${previos[0].metodo.titulo}"</strong> — los dos son de ${metodoNuevo.materia === 'aritmetica' ? 'Aritmética' : 'Tecnología'}. `;
}

// ── Resumen de fin de clase: 2-3 líneas REALES, no genéricas, basadas en lo
//    que de verdad pasó en la sesión. Se dispara cuando ARIA detecta despedida. ──
function generarResumenFinDeClaseAria(){
  const temas = Object.values(ariaSesionTemas);
  if (!temas.length) return null; // no se tocó ningún tema del banco — no hay nada real que resumir

  const conCosto = temas.filter(t => t.tuvoRefuerzo || t.nivelMax >= 2)
                         .sort((a,b) => b.nivelMax - a.nivelMax || (b.tuvoRefuerzo - a.tuvoRefuerzo));
  const vistos = temas.map(t => t.metodo.titulo);

  let linea1 = `📚 Hoy vimos ${vistos.length === 1 ? '"' + vistos[0] + '"' : vistos.length + ' temas: ' + vistos.join(', ')}.`;
  let linea2;
  if (conCosto.length){
    const nombres = conCosto.slice(0,2).map(t => `"${t.metodo.titulo}"`).join(' y ');
    linea2 = `Lo que más trabajo te costó fue ${nombres} — te recomiendo repasarlo antes de la próxima clase.`;
  } else {
    linea2 = `Todo lo que preguntaste te quedó claro a la primera — ¡muy bien hecho! 🎉`;
  }
  return `${linea1} ${linea2}`;
}

// ── 2) FILTRO DE LENGUAJE INAPROPIADO — manejo amable pero firme ──
// Lista deliberadamente breve (groserías/insultos comunes en español de uso escolar),
// NO exhaustiva — el objetivo es redirigir con cariño, no "cazar" cada variante posible.
const ARIA_LENGUAJE_INAPROPIADO = /\b(idiota|estupid[oa]|imbecil|malparid[oa]|marica|maric[oó]n|pendej[oa]|mierda|hijueputa|hijo\s*de\s*puta|gonorrea|malnacid[oa]|zorra|put[oa]|verga|culo|cagad[oa])\b/;

let ariaContadorLenguajeInapropiado = 0;

function contieneLenguajeInapropiadoAria(texto){
  return ARIA_LENGUAJE_INAPROPIADO.test(normalizaTexto(texto));
}

function registrarLenguajeInapropiadoAria(pregunta){
  try{
    const clave = 'aria_lenguaje_inapropiado';
    const lista = JSON.parse(localStorage.getItem(clave) || '[]');
    lista.push({ mensaje: String(pregunta).slice(0,200), fecha: new Date().toISOString() });
    localStorage.setItem(clave, JSON.stringify(lista.slice(-50)));
  } catch(e){ /* sin localStorage, no se registra, pero ARIA igual responde */ }
}

function respuestaFiltroLenguajeAria(pregunta){
  ariaContadorLenguajeInapropiado++;
  registrarLenguajeInapropiadoAria(pregunta);
  if (ariaContadorLenguajeInapropiado === 1){
    return 'Prefiero que hablemos con respeto 🙂 Sigo aquí para ayudarte con la clase cuando quieras — ¿en qué te ayudo?';
  }
  return 'En serio, hablemos con respeto — es importante para mí 💜 No voy a responder a ese tipo de lenguaje, pero con gusto seguimos con la clase cuando estés listo/a.';
}

// ── 3) GENERADOR DE EJERCICIOS A LA MEDIDA (mismo método, datos nuevos) ──
function ariaAleatorio(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }

// Un generador por método con solución numérica clara. Los métodos de Tecnología
// (algoritmo, diagrama de flujo, hardware/software, contraseña) no tienen una
// respuesta numérica única, así que en vez de eso ofrecen una TAREA para practicar.
const ARIA_GENERADORES_EJERCICIO = {
  suma_fracciones_igual_denom: () => {
    const den = ariaAleatorio(5,10), a = ariaAleatorio(1,den-2), b = ariaAleatorio(1,den-a);
    return { enunciado:`¿Cuánto es ${a}/${den} + ${b}/${den}?`, respuesta:`${a+b}/${den}` , tolerancia:['fraccion']};
  },
  suma_fracciones_distinto_denom: () => {
    const d1 = ariaAleatorio(2,5), d2 = ariaAleatorio(2,5) === d1 ? d1+1 : ariaAleatorio(2,5);
    const n1 = ariaAleatorio(1,d1-1), n2 = ariaAleatorio(1,d2-1);
    const den = d1*d2, num = n1*d2 + n2*d1;
    return { enunciado:`¿Cuánto es ${n1}/${d1} + ${n2}/${d2}? (déjalo sin simplificar, en /${den})`, respuesta:`${num}/${den}`, tolerancia:['fraccion'] };
  },
  multiplicacion_decimales: () => {
    const a = (ariaAleatorio(11,29)/10).toFixed(1), b = ariaAleatorio(2,9);

    return { enunciado:`¿Cuánto es ${a} × ${b}?`, respuesta: resp, tolerancia:['decimal'] };
  },
  division_decimales: () => {
    const b = ariaAleatorio(2,5), resp = ariaAleatorio(2,9), a = (b*resp).toFixed(1);
    return { enunciado:`¿Cuánto es ${a} ÷ ${b}?`, respuesta: String(resp), tolerancia:['decimal'] };
  },
  regla_de_tres_simple: () => {
    const x1 = ariaAleatorio(2,5), precio1 = ariaAleatorio(2,9)*1000, x2 = x1 + ariaAleatorio(1,4);
    const resp = (precio1/x1)*x2;
    return { enunciado:`Si ${x1} cuadernos cuestan $${precio1.toLocaleString('es-CO')}, ¿cuánto cuestan ${x2} cuadernos?`, respuesta: String(resp), tolerancia:['entero'] };
  },
  porcentaje: () => {
    const pct = [10,20,25,50][ariaAleatorio(0,3)], base = ariaAleatorio(2,20)*10;
    return { enunciado:`¿Cuánto es el ${pct}% de ${base}?`, respuesta: String((pct/100)*base), tolerancia:['entero'] };

  perimetro: () => {
    const l = ariaAleatorio(3,12), a = ariaAleatorio(3,12);

  area_rectangulo: () => {
    const l = ariaAleatorio(3,12), a = ariaAleatorio(3,12);

  },
  mcm: () => {
    const a = ariaAleatorio(2,6), b = ariaAleatorio(2,6);
    const mcm = (x,y)=>{ const gcd=(m,n)=>n?gcd(n,m%n):m; return (x*y)/gcd(x,y); };

  contrasena_segura: () => ({ tarea:'Inventa (sin usar datos reales tuyos) una contraseña seguida de ejemplo que cumpla las 3 reglas que vimos. Cuéntamela para revisarla juntos (no la uses de verdad en ninguna cuenta).' })
};

let ariaEjercicioActivo = null;        // { metodo, respuesta, tolerancia, intentos }
let ariaOfertaEjercicioPendiente = null; // { metodo } — ARIA ya ofreció, espera sí/no

function generarEjercicioMetodoAria(metodo){
  const gen = ARIA_GENERADORES_EJERCICIO[metodo.id];
  if (!gen) return null;
  const resultado = gen();
  if (resultado.tarea){
    // Tarea abierta (Tecnología) — no se autoevalúa con un número
    ariaEjercicioActivo = null;
    return `✏️ <strong>Para practicar "${metodo.titulo}":</strong><br>${resultado.tarea}<br><br>Cuéntame cómo te fue e intentamos juntos si te trabas.`;
  }
  ariaEjercicioActivo = { metodo, respuesta: resultado.respuesta, intentos: 0 };
  return `✏️ <strong>Practiquemos "${metodo.titulo}":</strong><br>${resultado.enunciado}<br><br>Escríbeme tu respuesta cuando la tengas.`;
}

// Compara la respuesta del estudiante con la esperada, tolerando espacios,
// comas/puntos decimales equivalentes, y fracciones escritas como "a/b".
function respuestasCoincidenAria(dada, esperada){
  const limpiar = s => String(s).trim().replace(/\s+/g,'').replace(',', '.');
  return limpiar(dada) === limpiar(esperada);
}

function evaluarRespuestaEjercicioAria(pregunta){
  if (!ariaEjercicioActivo) return null;
  const { metodo, respuesta } = ariaEjercicioActivo;
  // Extrae un posible número/fracción de la respuesta del estudiante
  const match = pregunta.match(/-?\d+([.,]\d+)?(\/\d+)?/);
  const dada = match ? match[0] : pregunta.trim();

  if (respuestasCoincidenAria(dada, respuesta)){
    ariaEjercicioActivo = null;
    return `✅ ¡Exacto! Ya dominas "${metodo.titulo}". 🎉 ¿Quieres otro ejercicio o seguimos con otra cosa?`;
  }
  ariaEjercicioActivo.intentos++;
  if (ariaEjercicioActivo.intentos >= 2){
    const resp = respuesta;
    ariaEjercicioActivo = null;
    return `Casi — la respuesta era <strong>${resp}</strong>. No pasa nada, repasemos el método:<br><br>` + armarExplicacionMetodoAria(metodo, 0);
  }
  return `Esa no es todavía 🤔 Repasa el paso a paso de "${metodo.titulo}" e inténtalo una vez más.`;
}

// v2.6 — ARIA ENTIENDE MEJOR (errores de escritura, sin tildes, sin signos,

//
// 🔧 IMPORTANTE: varias funciones de este archivo SOBRESCRIBEN a las

// en JavaScript, cuando dos <script> del mismo documento declaran una
// función con el mismo nombre, la última declaración que se ejecuta es la

// ═══════════════════════════════════════════════════════════════════════
function normalizaTexto(t){
  let s = (t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  // Quita signos de puntuación que no aportan nada a la comparación, pero que
  // SÍ pueden romper patrones que empiezan al inicio del texto (ej. "¡no!"

  s = s.replace(/[¿?¡!.,;:()"'`]/g, ' ');

  // misma letra a solo una, así se parece mucho más a la palabra real.
  s = s.replace(/([a-zñ])\1{2,}/g, '$1');

  // palabra completa (con \b), para no alterar esas letras dentro de otras
  // palabras. "aquí" se escribe muchísimo como "aki"/"aca" fonéticamente,
  // y la "h" muda se come seguido ("hago"->"ago", "hay"->"ay").
  s = s.replace(/\bq\b/g, 'que').replace(/\bk\b/g, 'que')
       .replace(/\bxq\b/g, 'porque').replace(/\bpq\b/g, 'porque').replace(/\bporq\b/g, 'porque')
       .replace(/\btb\b/g, 'tambien').replace(/\btmb\b/g, 'tambien')
       .replace(/\bpa\b/g, 'para').replace(/\bxfa\b/g, 'porfavor').replace(/\bporfa\b/g, 'porfavor')
       .replace(/\baki\b/g, 'aqui').replace(/\backa\b/g, 'aca')
       .replace(/\bkiero\b/g, 'quiero').replace(/\bkieres\b/g, 'quieres').replace(/\bkiere\b/g, 'quiere')
       .replace(/\bke\b/g, 'que');

  return s.replace(/\s+/g, ' ').trim();

//    ("aquí", "hago", "tengo"). Con el umbral viejo (0 de tolerancia hasta
//    4 letras) esos casos casi nunca calzaban. ──
function distanciaLevenshteinAria(a, b){
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({length:n+1}, (_,i)=>i);
  for (let i=1;i<=m;i++){
    const cur = [i];
    for (let j=1;j<=n;j++){
      cur[j] = a[i-1]===b[j-1] ? prev[j-1] : 1 + Math.min(prev[j-1], prev[j], cur[j-1]);

function seParecenAria(palabraEstudiante, palabraClave){
  if (palabraEstudiante === palabraClave) return true;
  const tolerancia = palabraClave.length <= 3 ? 0 : (palabraClave.length <= 6 ? 1 : 2);

//    "importantes" (largo > 3) de la frase clave aparezcan, cada una tolerando
//    pequeños errores de escritura, en cualquier orden dentro del mensaje. Si
//    la frase clave no tiene ninguna palabra larga (ej. "te amo"), se usa
//    coincidencia exacta de substring como respaldo. ──
function coincideFraseAproximadaAria(textoNorm, fraseClave){
  const palabrasTexto = textoNorm.split(/\s+/).filter(Boolean);
  const palabrasClave = fraseClave.split(/\s+/).filter(p => p.length > 3);
  if (!palabrasClave.length) return textoNorm.includes(fraseClave);
  return palabrasClave.every(pc => palabrasTexto.some(pt => seParecenAria(pt, pc)));

  return listaFrases.some(f => textoNorm.includes(f) || coincideFraseAproximadaAria(textoNorm, f));

// v2.8.0 — Emociones que Gemini puede elegir (todas existen como expresión de ARIA).
// 'alerta' y 'despedida' quedan fuera a propósito: las decide el código (filtros y resumen de fin de clase).
const ARIA_EMOCIONES_IA = ['academico','pista','practica','logro','genial','animo','motivacion','carino','duda','confundida','pena','triste','saludo','pensando'];
function extraerEmocionAria(texto){
  let emocion = null, limpio = String(texto || '');
  const m = limpio.match(/^\s*\[\s*([A-Za-zÁÉÍÓÚáéíóúÑñ_]+)\s*\]\s*/);
  if (m){
    const e = m[1].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    if (ARIA_EMOCIONES_IA.includes(e)) emocion = e;
    limpio = limpio.slice(m[0].length);
  }
  limpio = limpio.replace(new RegExp('\\[(?:' + ARIA_EMOCIONES_IA.join('|') + ')\\]\\s*', 'gi'), '').trim();
  return { texto: limpio, emocion };
}
window.ARIA_EMOCION_IA = null;

// Llama a la IA real. Devuelve el texto de la respuesta, o null si algo falló.
// v2.7.5 — (1) Si un modelo está saturado (503) lo REINTENTA con espera corta antes de pasar al
// siguiente; (2) los diagnósticos usan console.log con el prefijo [ARIA → Gemini] para que SIEMPRE
// se vean en F12; (3) maxOutputTokens 1024 + thinkingLevel 'low'; (4) cuenta UNA vez por pregunta.
const ariaEsperar = ms => new Promise(r => setTimeout(r, ms));

async function preguntarIAExternaAria(pregunta, contextoSlide){
  if (!GEMINI_API_KEY || GEMINI_API_KEY === 'PEGA_TU_CLAVE_AQUI'){
    console.log('[ARIA → Gemini] no hay clave configurada (pégala en la línea 11 del archivo: window.ARIA_CLAVE_GEMINI)');
    return null;
  }
  if (ariaIaExternaUsosSesion >= ARIA_IA_EXTERNA_TOPE_SESION){
    console.log('[ARIA → Gemini] se alcanzó el tope de preguntas de esta sesión:', ARIA_IA_EXTERNA_TOPE_SESION);
    return null;
  }
  ariaIaExternaUsosSesion++;
  window.ARIA_EMOCION_IA = null;

  const cuerpo = {
    system_instruction: { parts: [{ text: ARIA_INSTRUCCION_SISTEMA + ((window.ARIA_KB && ARIA_KB.contexto(pregunta)) ? `\n\nInformación oficial del colegio (úsala para responder; si la respuesta no está aquí, dilo con honestidad):\n${ARIA_KB.contexto(pregunta)}` : '') + ((window.ARIA_DOCS && ARIA_DOCS.contexto && ARIA_DOCS.contexto(pregunta)) ? `\n\nFragmentos de documentos institucionales relacionados (cita el documento y la página cuando los uses):\n${ARIA_DOCS.contexto(pregunta)}` : '') + (contextoSlide ? `\n\nTema de la diapositiva actual: "${contextoSlide}".` : '') }] },
    contents: [{ role: 'user', parts: [{ text: pregunta }] }],
    generationConfig: { maxOutputTokens: 1024, temperature: 0.6, thinkingConfig: { thinkingLevel: 'low' } }
  };

  const INTENTOS_POR_MODELO = 2;   // 1 intento + 1 reintento si está saturado
  const ESPERA_REINTENTO_MS = 1200;

  for (const modelo of GEMINI_MODELOS){
    for (let intento = 1; intento <= INTENTOS_POR_MODELO; intento++){
      const controlador = new AbortController();
      const timeout = setTimeout(() => controlador.abort(), 12000);
      try{
        const resp = await fetch(urlModeloGemini(modelo), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-goog-api-key': GEMINI_API_KEY },
          body: JSON.stringify(cuerpo),
          signal: controlador.signal
        });
        clearTimeout(timeout);

        if (resp.status === 429){
          console.log('[ARIA → Gemini]', modelo, '429: límite de peticiones por minuto');
          window.ARIA_EMOCION_IA = 'pena';
          return 'Ahora mismo tengo muchas preguntas encima 😅 dame un momentico e inténtalo de nuevo, o mientras tanto pregúntame algo de lo que ya vimos en la clase.';
        }
        if (resp.status === 503){
          console.log('[ARIA → Gemini]', modelo, '503 saturado, intento', intento, 'de', INTENTOS_POR_MODELO);
          if (intento < INTENTOS_POR_MODELO){ await ariaEsperar(ESPERA_REINTENTO_MS); continue; }
          break; // pasa al siguiente modelo
        }
        if (resp.status === 404){
          console.log('[ARIA → Gemini]', modelo, '404: ese modelo no existe para tu cuenta — pruebo el siguiente');
          break;
        }
        if (resp.status === 400 || resp.status === 403 || resp.status === 401){
          const detalle = await resp.text().catch(() => '');
          console.log('[ARIA → Gemini] error', resp.status, '— revisa la clave de API:', detalle.slice(0, 400));
          return null;
        }
        if (!resp.ok){
          const detalle = await resp.text().catch(() => '');
          console.log('[ARIA → Gemini]', modelo, 'error', resp.status, detalle.slice(0, 300));
          break;
        }

        const datos = await resp.json();
        for (const c of (datos?.candidates || [])){
          const p = (c?.content?.parts || []).find(x => typeof x?.text === 'string' && x.text.trim());
          if (p){
            const r = extraerEmocionAria(p.text.trim());
            if (r.texto){
              window.ARIA_EMOCION_IA = r.emocion;
              console.log('[ARIA → Gemini] respondió', modelo, '— emoción:', r.emocion || '(ninguna, usa reglas)');
              return r.texto;
            }
          }
        }
        console.log('[ARIA → Gemini]', modelo, 'respondió sin texto utilizable:', JSON.stringify(datos).slice(0, 500));
        break;
      } catch(e){
        clearTimeout(timeout);
        console.log('[ARIA → Gemini]', modelo, 'falló (red o tiempo agotado):', e.message);
        break;
      }
    }
  }
  console.log('[ARIA → Gemini] ningún modelo pudo responder en este momento');
  return null;
}

</script>

// Índice normalizado (se construye una vez al cargar el archivo)
const METODOS_ARIA_INDICE = METODOS_ARIA.map(m => ({
  ...m,
  disparadoresNorm: m.disparadores.map(d => normalizaTexto(d)),
  textoBusquedaNorm: normalizaTexto([m.titulo, ...m.disparadores].join(' '))
}));

// ═══════════════════════════════════════════════════════════════════════
// v2.3 — CASCADA DE INTENTOS + EXPLICAR MEJOR (no solo distinto) + ANDAMIAJE
// SOCRÁTICO + REFUERZO PROACTIVO.
// ═══════════════════════════════════════════════════════════════════════

// Distancia de Levenshtein compacta — para tolerar errores de escritura
function distanciaLevenshteinAria(a, b){
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({length:n+1}, (_,i)=>i);
  for (let i=1;i<=m;i++){
    const cur = [i];
    for (let j=1;j<=n;j++){
      cur[j] = a[i-1]===b[j-1] ? prev[j-1] : 1 + Math.min(prev[j-1], prev[j], cur[j-1]);
    }
    prev = cur;
  }
  return prev[n];
}
function seParecenAria(palabraEstudiante, palabraClave){
  if (palabraEstudiante === palabraClave) return true;
  const tolerancia = palabraClave.length <= 4 ? 0 : (palabraClave.length <= 7 ? 1 : 2);
  return distanciaLevenshteinAria(palabraEstudiante, palabraClave) <= tolerancia;
}

// ── Memoria de sesión (se reinicia si se recarga la página; eso está bien:
// cada clase es una sesión nueva de acompañamiento) ──
let ariaUltimoMetodoExplicado = null;   // { metodo, nivel }  0=pasos 1=analogia 2=visual 3=ejemplo
let ariaEsperandoSocratico   = null;    // { metodo } — ARIA ya hizo la pregunta guía, espera respuesta
const ariaMetodosYaIniciados = new Set(); // métodos cuya pregunta guía ya se hizo esta sesión
const ariaContadorMetodo     = {};        // cuántas veces se ha preguntado por cada método esta sesión

const NIVEL_EXPLICACION = ['pasos','analogia','visual','ejemplo'];

function armarExplicacionMetodoAria(metodo, nivel){
  nivel = Math.max(0, Math.min(3, nivel));
  ariaUltimoMetodoExplicado = { metodo, nivel };
  if (typeof registrarTemaEnSesionAria === 'function') registrarTemaEnSesionAria(metodo, nivel, false);
  const encabezado = `📘 <strong>${metodo.titulo}</strong>`;
  if (nivel === 0){
    const cuerpo = metodo.pasos.map((p,i)=>`${i+1}) ${p}`).join('<br>');
    return `${encabezado}:<br>${cuerpo}<br><br>¿Te quedó claro, o te lo explico de otra forma?`;
  }
  if (nivel === 1){
    return `${encabezado} — de otra forma 🙂:<br>${metodo.analogia}<br><br>¿Así se entiende mejor, o probamos con una comparación visual?`;
  }
  if (nivel === 2){
    return `${encabezado} — con un dibujo simple 👀:<br>${metodo.visual}<br><br>¿Ya tiene más sentido, o te muestro un ejemplo ya resuelto?`;
  }
  // v2.5 — Nivel más profundo: además del ejemplo, ARIA ofrece generar un ejercicio a la medida
  if (typeof ARIA_GENERADORES_EJERCICIO !== 'undefined' && ARIA_GENERADORES_EJERCICIO[metodo.id]){
    ariaOfertaEjercicioPendiente = { metodo };
    return `${encabezado} — con un ejemplo resuelto 🧮:<br>${metodo.ejemplo}<br><br>¿Quieres que te arme un ejercicio parecido para practicar? (escribe "sí" o "no")`;
  }
  return `${encabezado} — con un ejemplo resuelto 🧮:<br>${metodo.ejemplo}<br><br>Ahora inténtalo tú con tu propio ejercicio, usando el mismo método. Si te trabas en algún paso, dime exactamente cuál y seguimos desde ahí.`;
}

// ¿El estudiante está pidiendo otra forma de explicación? (en vez de un tema nuevo)
function esPeticionDeOtraExplicacionAria(pregunta){
  return /no entendi|no entiendo|explicamelo de otra forma|explicamelo diferente|de otra manera|no me quedo claro|sigo sin entender|otra explicacion|no le entendi/.test(normalizaTexto(pregunta));
}

// ── ANDAMIAJE SOCRÁTICO: detectar sí/no a la pregunta guía ──
function esRespuestaAfirmativaAria(t){
  return /^\s*(si|sí|s|claro|obvio|si\s*se|si\s*la\s*se|si\s*lo\s*se|si\s*entiendo|ajam|aja|de\s*una|ya\s*se|la\s*se|lo\s*se)\b/.test(normalizaTexto(t));
}
function esRespuestaNegativaAria(t){
  return /^\s*(no|no\s*se|no\s*la\s*se|no\s*lo\s*se|no\s*entiendo|nel|no\s*realmente|ni\s*idea|no\s*mucho)\b/.test(normalizaTexto(t));
}

// Primer contacto con un método: si tiene pregunta guía y aún no se hizo esta sesión,
// ARIA pregunta primero y ESPERA la respuesta antes de soltar la explicación completa.
function iniciarOExplicarMetodoAria(metodo){
  const conector = (typeof conectarConTemaAnteriorAria === 'function') ? conectarConTemaAnteriorAria(metodo) : '';
  if (metodo.preguntaGuia && !ariaMetodosYaIniciados.has(metodo.id)){
    ariaMetodosYaIniciados.add(metodo.id);
    ariaEsperandoSocratico = { metodo };
    return `${conector}Antes de explicarte, una pregunta rápida 🤔 ${metodo.preguntaGuia}`;
  }
  const explicacion = armarExplicacionMetodoAria(metodo, 0);
  return conector ? conector + explicacion : explicacion;
}

// ── REFUERZO PROACTIVO: si ya preguntó por este método antes, no espera a que
// insista — ofrece más detalle de una vez, sin necesidad de que el estudiante lo pida.
function registrarUsoMetodoAria(id){
  ariaContadorMetodo[id] = (ariaContadorMetodo[id] || 0) + 1;
  return ariaContadorMetodo[id];
}
function manejarMetodoEncontradoAria(metodo){
  const usos = registrarUsoMetodoAria(metodo.id);
  if (usos >= 2){
    // Ya preguntó por esto antes (o quedó registrado por un fallo de quiz relacionado):
    // se salta la pregunta socrática y da de una vez pasos + analogía juntos.
    ariaMetodosYaIniciados.add(metodo.id);
    ariaUltimoMetodoExplicado = { metodo, nivel: 1 };
    if (typeof registrarTemaEnSesionAria === 'function') registrarTemaEnSesionAria(metodo, 1, true);
    const pasos = metodo.pasos.map((p,i)=>`${i+1}) ${p}`).join('<br>');
    return `👀 Veo que esto te ha costado un poco — vamos con calma y más detalle 💪<br><br>` +
           `📘 <strong>${metodo.titulo}</strong>:<br>${pasos}<br><br>` +
           `Dicho de otra forma: ${metodo.analogia}<br><br>` +
           `¿Quieres además una comparación visual o un ejemplo ya resuelto?`;
  }
  return iniciarOExplicarMetodoAria(metodo);
}

// Búsquedas en el banco de métodos (exacta y tolerante a errores de escritura)
function buscarMetodoExactoAria(pregunta){
  const n = normalizaTexto(pregunta);
  for (const m of METODOS_ARIA_INDICE){
    if (m.disparadoresNorm.some(d => n.includes(d))) return m;
  }
  return null;
}
function buscarMetodoTolerante(pregunta){
  const palabras = normalizaTexto(pregunta).split(/[^a-z0-9ñ]+/).filter(p => p.length > 3);
  if (!palabras.length) return null;
  let mejor = null, mejorPuntaje = 0;
  METODOS_ARIA_INDICE.forEach(m => {
    const clave = m.textoBusquedaNorm.split(/[^a-z0-9ñ]+/).filter(p => p.length > 3);
    let puntaje = 0;
    palabras.forEach(pe => { if (clave.some(pc => seParecenAria(pe, pc))) puntaje++; });
    if (puntaje > mejorPuntaje){ mejorPuntaje = puntaje; mejor = m; }
  });
  return mejorPuntaje >= 2 ? mejor : null;
}

// ── Registro de dudas no resueltas: insumo para el Panel Docente ──
function registrarDudaNoResueltaAria(pregunta){
  try{
    const clave = 'aria_dudas_no_resueltas';
    const lista = JSON.parse(localStorage.getItem(clave) || '[]');
    lista.push({ pregunta: String(pregunta).slice(0,200), fecha: new Date().toISOString() });
    localStorage.setItem(clave, JSON.stringify(lista.slice(-100)));
  } catch(e){ /* si no hay localStorage disponible, simplemente no se registra */ }
}

// ── API pública para el refuerzo proactivo por FALLOS DE QUIZ (no solo por chat) ──
// La clase la llama así cuando el estudiante falla 2 veces la misma pregunta y esa
// pregunta está asociada a un método del banco: registrarFalloQuizComoMetodoAria('regla_de_tres_simple')
function registrarFalloQuizComoMetodoAria(metodoId){
  const metodo = METODOS_ARIA_INDICE.find(m => m.id === metodoId);
  if (!metodo) return null;
  registrarUsoMetodoAria(metodoId); // cuenta como "primer uso" -> la próxima vez ya será refuerzo
  return metodo;
}

// ═══════════════════════════════════════════════════════════════════════
// PUNTO DE ENTRADA DE LA CASCADA
// ═══════════════════════════════════════════════════════════════════════
function cascadaDeIntentosAria(pregunta){
  // -3) ¿Hay un ejercicio activo esperando la respuesta del estudiante? (v2.5)
  if (typeof ariaEjercicioActivo !== 'undefined' && ariaEjercicioActivo){
    const resultadoEjercicio = evaluarRespuestaEjercicioAria(pregunta);
    if (resultadoEjercicio) return resultadoEjercicio;
  }
  // -2) ¿ARIA ofreció un ejercicio y está esperando sí/no? (v2.5)
  if (typeof ariaOfertaEjercicioPendiente !== 'undefined' && ariaOfertaEjercicioPendiente){
    const { metodo } = ariaOfertaEjercicioPendiente;
    ariaOfertaEjercicioPendiente = null;
    if (esRespuestaAfirmativaAria(pregunta)){
      const ejercicio = generarEjercicioMetodoAria(metodo);
      if (ejercicio) return ejercicio;
    }
    // Negativa o ambigua: sigue la conversación con normalidad (no se queda esperando).
  }
  // -1) ¿ARIA está esperando la respuesta a una pregunta socrática? Resolver eso PRIMERO,
  //     antes de tratar el mensaje como una pregunta nueva.
  if (ariaEsperandoSocratico){
    const { metodo } = ariaEsperandoSocratico;
    ariaEsperandoSocratico = null;
    if (esRespuestaNegativaAria(pregunta)){
      return `${metodo.microFundamento}<br><br>Ahora sí, vamos con el método completo 😊:<br><br>` + armarExplicacionMetodoAria(metodo, 0);
    }
    // Afirmativa o ambigua: no nos quedamos esperando para siempre, pasamos a explicar.
    return armarExplicacionMetodoAria(metodo, 0);
  }

  // 0) Continuar profundizando en lo último explicado, si el estudiante lo pide
  if (esPeticionDeOtraExplicacionAria(pregunta) && ariaUltimoMetodoExplicado){
    const siguienteNivel = Math.min(3, ariaUltimoMetodoExplicado.nivel + 1);
    return armarExplicacionMetodoAria(ariaUltimoMetodoExplicado.metodo, siguienteNivel);
  }

  // 1) Coincidencia exacta en el banco de métodos (alta confianza) — con andamiaje/refuerzo
  const metodoExacto = buscarMetodoExactoAria(pregunta);
  if (metodoExacto) return manejarMetodoEncontradoAria(metodoExacto);

  // 2) Explicación profunda leyendo TODA la clase (Prioridad 30-C, si está cargada)
  if (typeof esPreguntaDeExplicacionAria === 'function' && esPreguntaDeExplicacionAria(pregunta)){
    if (typeof ARIA_INDICE_CLASE !== 'undefined' && !ARIA_INDICE_CLASE.length &&
        typeof indexarContenidoClaseAria === 'function') indexarContenidoClaseAria();
    if (typeof explicarConceptoOProcesoAria === 'function'){
      const explicacionProfunda = explicarConceptoOProcesoAria(pregunta);
      if (explicacionProfunda) return explicacionProfunda;
    }
  }

  // 3) Búsqueda general en el contenido de la clase (umbral normal)
  if (typeof buscarEnClaseAria === 'function'){
    const desdeClase = buscarEnClaseAria(pregunta);
    if (desdeClase) return desdeClase;
  }

  // 4) Último intento: banco de métodos con tolerancia a errores de escritura
  const metodoTolerante = buscarMetodoTolerante(pregunta);
  if (metodoTolerante) return manejarMetodoEncontradoAria(metodoTolerante);

  // 5) Honestidad final — ARIA nunca inventa, pero deja constancia de la duda
  registrarDudaNoResueltaAria(pregunta);
  return null;
}

<script>
// ── Agrupación por categoría (para variedad: varias imágenes pueden compartir categoría) ──
const ARIA_IMG_POR_CATEGORIA = {};
Object.values(ARIA_AVATAR_IMG).forEach(img => {
  (ARIA_IMG_POR_CATEGORIA[img.cat] = ARIA_IMG_POR_CATEGORIA[img.cat] || []).push(img.src);
});

function elegirImagenAria(categoria){
  const pool = ARIA_IMG_POR_CATEGORIA[categoria] || ARIA_IMG_POR_CATEGORIA['pensando'];
  return pool[Math.floor(Math.random() * pool.length)];
}

// ── Heurística: decide qué expresión mostrar según la pregunta y la respuesta ya generadas.
// No modifica responderAria() ni su orden de prioridades — solo "lee" el resultado para
// decidir qué cara poner. Si nada calza, usa 'pensando' como expresión neutra por defecto. ──
function categoriaExpresionAria(pregunta, respuesta){
  const p = normalizaTexto(pregunta || '');
  const r = normalizaTexto(respuesta || '');

  if (/no esta bien|no se hace|no lo voy a responder|profe luis lo|el profe lo va a saber|queda anotado|no me gusta que me hables/.test(r)) return 'alerta';
  if (/busque en wikipedia/.test(r)) return 'academico';
  if (/jaja|que tierno|no puedo ser novia|no puedo ser novio/.test(r)) return 'pena';
  if (/todavia estoy aprendiendo|sigo aprendiendo|dias de creada|nacihoy mismo|no tengo esa informacion|esa no la conozco|me quedo grande/.test(r)) return 'confundida';
  if (/^(hola|buenos dias|buenas tardes|buenas noches|hey|holaa*)\b/.test(p) && p.length < 30) return 'saludo';
  if (/chao|adios|hasta luego|nos vemos|me voy|hasta manana/.test(p)) return 'despedida';
  if (/correcto|excelente|felicidades|lo lograste|muy bien hecho|lo conseguiste/.test(r)) return 'logro';
  if (/tu puedes|animo|no te rindas|sigue intentando|vas muy bien/.test(r)) return 'animo';
  if (/lo estas haciendo genial|genial|que bien|buen trabajo|muy bien/.test(r)) return 'genial';
  if (/no entiendo nada|es muy dificil|no puedo con esto|es muy complicado|me equivoque|fracase/.test(p)) return 'triste';
  if (/dame una pista|ayudame con esto|no se como empezar|estoy atascado|estoy atascada/.test(p)) return 'pista';
  if (/practica|ejercicio|resolver|calcula|operacion/.test(p)) return 'practica';
  if (/matematicas|tecnologia|ciencia|hipotesis|experimento|historia|valores|respeto|responsabilidad/.test(p)) return 'academico';
  if (/gracias|te quiero|eres genial|me caes bien|te felicito/.test(p)) return 'carino';
  if (/\?$/.test((pregunta||'').trim())) return 'duda';
  return 'pensando';
}

</script>

<script>
// ═══════════════════════════════════════════════════════════════════════
// v2.1 — ARIA CON EXPRESIVIDAD FÍSICA: 6 poses oficiales + animación por estado
// Cada pose ya trae su globo de texto dibujado, así que se muestra como "reacción"
// flotante (sobre el botón de ARIA) y también reemplaza el avatar de las categorías afines.
// ═══════════════════════════════════════════════════════════════════════
const ARIA_SPRITES = {
  correcto: 'assets/aria/c8a411b9a0.webp',
  genial: 'assets/aria/75b586d770.webp',
  sigues_aqui: 'assets/aria/674286ee9f.webp',
  tu_puedes: 'assets/aria/777199803b.webp',
  dificil: 'assets/aria/dc6541147e.webp',
  nos_vemos: 'assets/aria/6ddea362d4.webp'
};

// Qué pose reemplaza a qué categoría del avatar (las demás categorías siguen igual)
const ARIA_SPRITE_POR_CATEGORIA = {
  logro:'correcto', animo:'tu_puedes', despedida:'nos_vemos', dormida:'sigues_aqui',
  triste:'dificil', confundida:'dificil', carino:'genial', genial:'genial'
};
Object.keys(ARIA_SPRITE_POR_CATEGORIA).forEach(cat => {
  ARIA_IMG_POR_CATEGORIA[cat] = [ARIA_SPRITES[ARIA_SPRITE_POR_CATEGORIA[cat]]];
});

// Estado de reacción -> pose + animación CSS
const ARIA_REACCIONES = {
  correcto:    { sprite:'correcto',    anim:'aria-anim-saltar'  },
  genial:      { sprite:'genial',      anim:'aria-anim-rebotar' },
  ayuda:       { sprite:'sigues_aqui', anim:'aria-anim-latir'   },
  animo:       { sprite:'tu_puedes',   anim:'aria-anim-saltar'  },
  dificil:     { sprite:'dificil',     anim:'aria-anim-temblar' },
  despedida:   { sprite:'nos_vemos',   anim:'aria-anim-saludar' }
};

let ariaReaccionTimer = null;
// API pública: la clase la llama así -> ariaReaccionar('correcto') / ('dificil') / ...
function ariaReaccionar(estado, ms){
  const r = ARIA_REACCIONES[estado];
  if (!r) return;
  let cont = document.getElementById('aria-reaccion');
  if (!cont){
    cont = document.createElement('div');
    cont.id = 'aria-reaccion';
    cont.innerHTML = '<img alt="ARIA reacciona">';
    document.body.appendChild(cont);
  }
  const img = cont.querySelector('img');
  img.src = ARIA_SPRITES[r.sprite];
  cont.className = '';
  void cont.offsetWidth;                 // reinicia la animación si se repite el estado
  cont.className = 'aria-reaccion-visible ' + r.anim;
  clearTimeout(ariaReaccionTimer);
  ariaReaccionTimer = setTimeout(() => { cont.className = ''; }, ms || 3200);
}
window.ariaReaccionar = ariaReaccionar;
