<script>
// ── Selección de voz: femenina, latinoamericana, evitando el acento de España ──
let ARIA_VOZ_ELEGIDA = null;

function elegirVozFemeninaLatina(){
  if (!window.speechSynthesis) return null;
  const voces = window.speechSynthesis.getVoices() || [];
  if (!voces.length) return null;

  const candidatasEs = voces.filter(v => v.lang.toLowerCase().startsWith('es'));
  if (!candidatasEs.length) return null;

  const codigosLatam = ['es-419','es-us','es-mx','es-co','es-ar','es-cl','es-pe','es-ve',
                         'es-ec','es-gt','es-do','es-hn','es-sv','es-ni','es-py','es-bo',
                         'es-uy','es-pr','es-cr','es-pa'];
  const nombresFemeninos = ['female','mujer','paulina','sabina','helena','lucia','lupe',
                             'esperanza','camila','valentina','isabela','monica','marisol',
                             'soledad','rosa','carmen','maria','fernanda','dalia','ines',
                             'francisca','catalina','angelica','estefania','mia'];

  const esLatam = v => codigosLatam.some(cod => v.lang.toLowerCase().startsWith(cod));
  const pareceFemenina = v => nombresFemeninos.some(n => v.name.toLowerCase().includes(n));

  return (
    candidatasEs.find(v => esLatam(v) && pareceFemenina(v)) ||
    candidatasEs.find(esLatam) ||
    candidatasEs.find(v => pareceFemenina(v) && !v.lang.toLowerCase().startsWith('es-es')) ||
    candidatasEs.find(v => !v.lang.toLowerCase().startsWith('es-es')) ||
    candidatasEs[0]
  );
}

function inicializarVozAria(){
  ARIA_VOZ_ELEGIDA = elegirVozFemeninaLatina();
}
if (window.speechSynthesis){
  inicializarVozAria();
  window.speechSynthesis.onvoiceschanged = inicializarVozAria;
}

</script>

<script>
// ============================================================
// LECTOR DEL CONTENIDO DE LA CLASE — ARIA puede responder sobre
// cualquier diapositiva/slide que ya esté en el HTML de la clase
// ============================================================
const ARIA_PALABRAS_VACIAS = new Set(['para','como','sobre','donde','cuando','porque','cual',
  'cuales','esta','estos','estas','desde','entre','pero','este','esto','sirve','sirven',
  'hacer','puedo','quiero','saber','tiene','tienen','hace','dime','explica','explicame']);

// Intenta reconocer automáticamente cómo está armada la clase (distintas clases de HTML del
// profe Luis pueden usar distintos nombres de contenedor para cada diapositiva/pantalla)
function indexarContenidoClaseAria(){
  const selectoresPosibles = [
    '.slide', '.diapositiva', '.pantalla', '[data-slide]',
    '.contenido-slide', '.screen', 'main section', 'section'
  ];
  let nodos = [];
  for (const sel of selectoresPosibles){
    const encontrados = document.querySelectorAll(sel);
    if (encontrados.length >= 2){ nodos = Array.from(encontrados); break; }
  }
  if (!nodos.length) return [];

  const indice = [];
  nodos.forEach((nodo, i) => {
    const titEl = nodo.querySelector('h1,h2,h3,.titulo-slide,.slide-titulo,.titulo');
    const titulo = titEl ? titEl.textContent.trim() : ('la parte ' + (i + 1) + ' de la clase');
    let texto = (nodo.innerText || nodo.textContent || '').trim().replace(/\s+/g, ' ');
    if (texto.length < 25) return; // ignora slides casi vacías (portadas, transiciones)
    indice.push({ titulo, texto, textoNorm: normalizaTexto(texto), nodo });
  });
  return indice;
}

// ============================================================
// DETECCIÓN DE LA DIAPOSITIVA ACTUAL — para que ARIA sepa
// exactamente dónde está el estudiante en este momento y pueda
// orientarlo sobre "qué debo hacer aquí" sin dar respuestas.
// Funciona por heurística genérica porque cada clase del profe
// Luis puede navegar sus diapositivas de forma distinta.
// ============================================================
function estaVisibleAria(el){
  if (!el || !el.isConnected) return false;
  const estilo = window.getComputedStyle(el);
  if (estilo.display === 'none' || estilo.visibility === 'hidden' || parseFloat(estilo.opacity || '1') === 0) return false;
  if (el.offsetParent === null && estilo.position !== 'fixed') return false;
  const rect = el.getBoundingClientRect();
  if (rect.width < 5 && rect.height < 5) return false;
  return true;
}

function obtenerSlideActualAria(){
  if (!ARIA_INDICE_CLASE.length) return null;

  // 1) Prioriza marcadores explícitos de "activa/actual" si la clase los usa
  const selectoresActivos = [
    '.active', '.activa', '.activo', '.slide-actual', '.current',
    '[aria-current="true"]', '[aria-current="step"]', '.is-active', '.show', '.mostrar'
  ];
  for (const item of ARIA_INDICE_CLASE){
    if (!item.nodo) continue;
    for (const sel of selectoresActivos){
      if (item.nodo.matches && item.nodo.matches(sel) && estaVisibleAria(item.nodo)) return item;
    }
  }

  // 2) Si no hay marcador claro, busca cuál diapositiva está realmente visible en pantalla
  const visibles = ARIA_INDICE_CLASE.filter(item => item.nodo && estaVisibleAria(item.nodo));
  if (visibles.length === 1) return visibles[0];
  if (visibles.length > 1){
    // Si varias son "visibles" a la vez (layout raro), toma la más centrada en la pantalla
    const centroPantalla = window.innerHeight / 2;
    visibles.sort((a, b) => {
      const ra = a.nodo.getBoundingClientRect(), rb = b.nodo.getBoundingClientRect();
      return Math.abs((ra.top + ra.bottom) / 2 - centroPantalla) - Math.abs((rb.top + rb.bottom) / 2 - centroPantalla);
    });
    return visibles[0];
  }
  return null;
}

// Heurística de TIPO de diapositiva: quiz/evaluación vs. explicación de concepto vs. actividad
function detectarTipoSlideAria(item){
  if (!item || !item.nodo) return 'general';
  const nodo = item.nodo;
  const tieneOpciones = !!nodo.querySelector(
    'input[type="radio"], input[type="checkbox"], .opcion, .opciones, .opcion-quiz, .respuesta-opcion, .quiz-opcion, .alternativa'
  );
  const tieneBotonVerificar = !!Array.from(nodo.querySelectorAll('button, .btn'))
    .find(b => /verificar|comprobar|revisar respuesta|enviar respuesta|responder|corregir/.test(normalizaTexto(b.textContent || '')));
  const claseIndicaQuiz = /quiz|pregunta|evaluacion|examen|test/.test(normalizaTexto(nodo.className || ''));
  const textoIndicaQuiz = /^\s*(a\)|b\)|c\)|1\)|2\))/m.test(item.texto) || /¿.*\?/.test(item.texto);

  if (tieneOpciones || tieneBotonVerificar || claseIndicaQuiz){
    return 'quiz';
  }
  const tieneArrastrar = !!nodo.querySelector('[draggable="true"], .arrastrable, .dropzone, .drag');
  const tieneInputTexto = !!nodo.querySelector('input[type="text"], textarea');
  if (tieneArrastrar || tieneInputTexto){
    return 'actividad';
  }
  if (textoIndicaQuiz && (nodo.querySelectorAll('li,p').length <= 6)){
    return 'quiz';
  }
  return 'concepto';
}

// Frases de orientación por tipo de diapositiva — varias variantes para que no suene repetitivo,
// y con mención al profe Luis solo en algunas (no todas) para que se sienta natural.
const ARIA_ORIENTACION_POR_TIPO = {
  quiz: [
    'Aquí estás en una pregunta 🧩 Lee con calma el enunciado, revisa bien la información que te dio el profe Luis en las diapositivas anteriores, y luego mira cada opción una por una. Si de alguna estás segur@ de que NO es la correcta, descártala primero — así te quedan menos opciones para pensar. Yo no puedo darte la respuesta, ¡pero confío en que la puedes resolver! 💪',
    'Esta parte es de evaluación, así que te toca pensar un poquito 😊 Vuelve a leer la pregunta despacio y fíjate qué palabras clave tiene. Luego revisa las opciones: descarta primero las que veas claramente que no encajan, y entre las que queden, elige la que mejor se explique con lo que vimos en la clase. No te doy la respuesta, pero sí puedo ayudarte a pensar si me cuentas en qué opción dudas.',
    'Ojo, esta es una pregunta de la clase del profe Luis 📋 Antes de responder, repasa lo que se explicó en las diapositivas anteriores — ahí suele estar la pista. Analiza cada opción y ve descartando las que no tengan sentido; eso te deja con menos para escoger. ¡Tú puedes!'
  ],
  concepto: [
    'Aquí el profe Luis te está explicando un concepto nuevo 📖 Te recomiendo leerlo con calma y fijarte muy bien en los ejemplos — casi siempre ahí está la clave para entenderlo. Cuando termines de leer, si te queda una duda puntual, pregúntamela con gusto.',
    'En esta diapositiva hay una explicación importante. Lo mejor es que la leas completa, sin saltarte partes, y revises bien los ejemplos que te dan — eso te va a ayudar mucho en lo que sigue después. Si algo no te queda claro, dime exactamente qué parte y te ayudo a entenderla.',
    'Esta parte es de teoría 🧠 Léela con calma y presta atención a los ejemplos que te da el profe Luis; muchas veces la actividad que sigue se resuelve fijándose justo en esos ejemplos.'
  ],
  actividad: [
    'Esta es una actividad para practicar 🙌 Lee bien las instrucciones antes de empezar y ve con calma paso por paso. Si te trabas en algo puntual, cuéntame qué parte y te doy una pista, sin darte la respuesta completa.',
    'Aquí te toca poner manos a la obra 💪 Revisa las instrucciones de la diapositiva y recuerda lo que se explicó antes en la clase — eso te va a servir para resolverla. Si necesitas una pista puntual, aquí estoy.'
  ],
  general: [
    'Mira con calma lo que dice esta parte de la clase 👀 Si me cuentas qué parte no entiendes, te ayudo a orientarte sin darte la respuesta directa.',
    'Lee bien el contenido de esta diapositiva; si tienes una duda específica sobre algo de aquí, pregúntamela y te ayudo a pensarla.'
  ]
};

function respuestaOrientacionSlideAria(){
  const actual = obtenerSlideActualAria();
  if (!actual){
    return 'Lee con calma lo que dice esta parte de la clase 👀 Si me dices qué parte específica no entiendes, te ayudo a pensarla sin darte la respuesta directa.';
  }
  const tipo = detectarTipoSlideAria(actual);
  const variantes = ARIA_ORIENTACION_POR_TIPO[tipo] || ARIA_ORIENTACION_POR_TIPO.general;
  return elegirAlAzar(variantes);
}

// Detecta si el estudiante está preguntando "qué debo hacer aquí" en cualquiera de sus formas
function esPreguntaOrientacionAria(pregunta){
  const n = normalizaTexto(pregunta);
  return /que (debo |tengo que |hay que )?hacer aqui|que hago aqui|que hago aca|que se hace aqui|que se hace aca|como hago esto|como se hace esto|que es esto|no entiendo que hacer|no se que hacer|ayuda con esto|en que voy|que sigue aqui|como resuelvo esto/.test(n);
}

// ============================================================
// PREGUNTA DE QUIZ COPIADA/PEGADA — Prioridad 30-B del PROMPT_MAESTRO.
// Si el estudiante pega o escribe (casi) literal una pregunta de evaluación,
// ARIA orienta el PROCESO para pensarla, nunca revela ni descarta opciones.
// Funciona en dos modos, para servir tanto en esta demo como integrada en
// cualquier clase real:
//  A) Modo "clase real": si la página expone las variables globales SL/GLOSARIO
//     del PROMPT_MAESTRO, compara contra el texto exacto de cada pregunta y
//     usa la pistaAyuda que el profe Luis haya escrito para esa pregunta.
//  B) Modo genérico (esta demo, o una clase que aún no expone SL): busca
//     dentro del contenido ya indexado (ARIA_INDICE_CLASE) qué diapositiva es
//     de tipo "quiz" y compara el texto pegado contra el enunciado que haya
//     dentro de ella.
// ============================================================
function similitudTextoAria(a, b){
  const pa = new Set(normalizaTexto(a).split(/\W+/).filter(w => w.length > 3));
  const pb = new Set(normalizaTexto(b).split(/\W+/).filter(w => w.length > 3));
  if (!pa.size || !pb.size) return 0;
  let comunes = 0;
  pa.forEach(w => { if (pb.has(w)) comunes++; });
  return comunes / Math.min(pa.size, pb.size);
}

function detectarPreguntaCopiadaAria(pregunta){
  // Descarta preguntas muy cortas para evitar falsos positivos (ej. "¿qué es esto?")
  if (normalizaTexto(pregunta).split(/\W+/).filter(w => w.length > 3).length < 4) return null;

  // Modo A — clase real con SL/preguntas (Prioridad 5 + 30-B del PROMPT_MAESTRO)
  if (typeof SL !== 'undefined' && Array.isArray(SL)){
    let mejor = null, mejorScore = 0;
    SL.forEach(s => {
      if (!s.preguntas) return;
      s.preguntas.forEach(p => {
        const score = similitudTextoAria(pregunta, p.pregunta || '');
        if (score > mejorScore){ mejorScore = score; mejor = { origen:'datos', preg:p }; }
      });
    });
    if (mejorScore >= 0.55) return mejor;
  }

  // Modo B — genérico, usando lo ya indexado del DOM
  if (typeof ARIA_INDICE_CLASE !== 'undefined' && ARIA_INDICE_CLASE.length){
    let mejor = null, mejorScore = 0;
    ARIA_INDICE_CLASE.forEach(item => {
      if (!item.nodo || detectarTipoSlideAria(item) !== 'quiz') return;
      const score = similitudTextoAria(pregunta, item.texto);
      if (score > mejorScore){ mejorScore = score; mejor = { origen:'dom', item }; }
    });
    if (mejorScore >= 0.55) return mejor;
  }
  return null;
}

const ARIA_ORIENTACION_QUIZ_GENERICA = [
  'Esa es una pregunta de evaluación 🧩 No te puedo dar la respuesta, pero sí ayudarte a pensarla: vuelve a leer el contexto de arriba con calma y fíjate en el dato clave. Luego compara cada una de las opciones contra ese dato — la que mejor encaje es tu respuesta.',
  'El profe Luis diseñó esta pregunta para que pienses, no para copiarla 😊 Relee el contexto despacio: ¿qué información te está dando? Después mira las opciones una por una y pregúntate si cada una coincide con esa información. ¿En cuál dudas más? Cuéntame y te ayudo a pensarla, sin decirte cuál es.',
  'Esta pregunta sí cuenta para tu nota, así que no puedo resolvértela — pero te acompaño a pensarla: vuelve a leer el contexto, identifica el dato más importante, y revisa las opciones comparándolas con ese dato. Ve con calma, tú puedes.',
  'Como te explicaría el profe Luis en persona: primero relee el contexto de la pregunta, no la pregunta sola. Ahí casi siempre está la pista que necesitas para descartar las opciones que no encajan.'
];

function orientacionSocraticaAria(match){
  if (match && match.origen === 'datos' && match.preg && match.preg.pistaAyuda){
    return `🧭 ${match.preg.pistaAyuda}`;
  }
  return elegirAlAzar(ARIA_ORIENTACION_QUIZ_GENERICA);
}

let ARIA_INDICE_CLASE = [];
function inicializarIndiceClaseAria(){
  try { ARIA_INDICE_CLASE = indexarContenidoClaseAria(); }
  catch(e){ ARIA_INDICE_CLASE = []; }
}

function extraerFragmentoRelevanteAria(texto, palabras){
  const textoNorm = normalizaTexto(texto);
  let pos = -1;
  for (const p of palabras){ const i = textoNorm.indexOf(p); if (i >= 0){ pos = i; break; } }
  if (pos < 0) pos = 0;
  const inicio = Math.max(0, pos - 60);
  let fragmento = texto.substring(inicio, inicio + 220).trim();
  if (inicio > 0) fragmento = '...' + fragmento;
  if (inicio + 220 < texto.length) fragmento += '...';
  return fragmento;
}

// Búsqueda simple por coincidencia de palabras clave dentro de las diapositivas ya indexadas.
// 🔒 v2.0: NUNCA devuelve contenido de una diapositiva de tipo "quiz" — el enunciado y las
// opciones de una pregunta evaluable jamás se citan aquí, ni siquiera como "fragmento
// relacionado". Si el mejor resultado es un quiz, se descarta y se sigue buscando en el
// resto de la clase; si no queda nada más, se devuelve null (y responderAria cae en la
// orientación socrática o en el diccionario).
function buscarEnClaseAria(pregunta){
  if (!ARIA_INDICE_CLASE.length) return null;
  const palabras = aplicarSinonimosAria(normalizaTexto(pregunta))
    .split(/[^a-z0-9ñ]+/)
    .filter(p => p.length > 3 && !ARIA_PALABRAS_VACIAS.has(p));
  if (!palabras.length) return null;

  const candidatos = ARIA_INDICE_CLASE.filter(item => detectarTipoSlideAria(item) !== 'quiz');

  let mejor = null, mejorPuntaje = 0;
  candidatos.forEach(item => {
    let puntaje = 0;
    palabras.forEach(p => { if (item.textoNorm.includes(p)) puntaje++; });
    if (puntaje > mejorPuntaje){ mejorPuntaje = puntaje; mejor = item; }
  });

  const minimoNecesario = Math.max(1, Math.ceil(palabras.length * 0.34));
  if (!mejor || mejorPuntaje < minimoNecesario){
    // Respaldo: si hubo AL MENOS una coincidencia real (aunque no llegue al umbral),
    // se ofrece como pista humilde en vez de rendirse directo con "no sé" — así ARIA
    // sí "analiza toda la clase" antes de darse por vencida.
    if (mejor && mejorPuntaje >= 1){
      const fragmento = extraerFragmentoRelevanteAria(mejor.texto, palabras);
      return `No encontré algo exacto, pero esto de "${mejor.titulo}" podría estar relacionado 🤔 ${fragmento}`;
    }
    return null;
  }

  // Cuando SÍ hay un buen match en una diapositiva de concepto/actividad, se entrega una
  // explicación completa (con pasos, si el texto los trae) en vez de solo un fragmento corto —
  // ver explicarConceptoOProcesoAria(), que reutiliza este mismo "mejor" resultado.
  return construirExplicacionDesdeItemAria(mejor, palabras);
}

// ============================================================
// v2.0 — EXPLICACIÓN PROFUNDA DE CONCEPTOS Y PROCESOS ("¿cómo se hace esto?",
// "explícame X", "¿cómo funciona X?") A PARTIR DE LO QUE YA DICE LA CLASE.
// ARIA no inventa contenido nuevo: reordena y simplifica el vocabulario de lo que el
// profe Luis ya escribió en esa diapositiva, y si detecta una secuencia de pasos
// (numerados o con palabras como "primero/luego/después/finalmente") la presenta
// como lista numerada para que sea más fácil de seguir.
// ============================================================
const ARIA_DISPARADORES_EXPLICACION = /explica(me)?|como se hace|c[oó]mo se hace|como funciona|c[oó]mo funciona|que es|qu[eé] es|para que sirve|para qu[eé] sirve|no entiendo como|no entiendo c[oó]mo|ens[eé]ñame|dime como|dime c[oó]mo|pasos para|proceso de|como puedo|c[oó]mo puedo|como resuelvo|c[oó]mo resuelvo|que significa|qu[eé] significa/;

function esPreguntaDeExplicacionAria(pregunta){
  return ARIA_DISPARADORES_EXPLICACION.test(normalizaTexto(pregunta));
}

// Reconoce una secuencia de pasos dentro de un bloque de texto: numerados (1. / 1) / Paso 1)
// o marcados con palabras de secuencia (primero, luego, después, a continuación, finalmente...).
function extraerPasosAria(texto){
  const porNumero = texto.match(/(?:^|[\s.;])(\d{1,2}[\.\)]\s*[^\d]{6,200}?)(?=\s*\d{1,2}[\.\)]|$)/g);
  if (porNumero && porNumero.length >= 2){
    return porNumero.map(p => p.replace(/^[\s.;]+/, '').trim()).slice(0, 6);
  }
  const marcador = /\b(primero|para empezar|en primer lugar|luego|despues|después|a continuacion|a continuación|posteriormente|finalmente|por ultimo|por último|para terminar)\b/i;
  if (marcador.test(texto)){
    const frases = texto.split(/(?<=[\.\!\?])\s+/);
    const relevantes = frases.filter(fr => marcador.test(fr));
    if (relevantes.length >= 2) return relevantes.slice(0, 6);
  }
  return null;
}

// Baja levemente el registro del texto sin cambiar su significado — no es un resumen ni una
// reescritura libre, solo cambia conectores/verbos formales por su equivalente cotidiano.
function simplificarLenguajeAria(texto){
  return String(texto)
    .replace(/\butilizar\b/gi, 'usar')
    .replace(/\butilizamos\b/gi, 'usamos')
    .replace(/\butilizando\b/gi, 'usando')
    .replace(/\bse utiliza\b/gi, 'se usa')
    .replace(/\bpor consiguiente\b/gi, 'entonces')
    .replace(/\bcon el fin de\b/gi, 'para')
    .replace(/\bdicho de otra forma\b/gi, 'en otras palabras')
    .replace(/\bconsiste en\b/gi, 'se trata de');
}

// Arma la respuesta final a partir de una diapositiva ya elegida: si el texto trae pasos
// reconocibles, los numera; si no, entrega un fragmento más largo que el de
// extraerFragmentoRelevanteAria() (porque aquí la intención es EXPLICAR, no solo ubicar).
function construirExplicacionDesdeItemAria(item, palabras){
  const pasos = extraerPasosAria(item.texto);
  let cuerpo;
  if (pasos && pasos.length >= 2){
    cuerpo = pasos.map((p, i) => `${i + 1}) ${simplificarLenguajeAria(p)}`).join('<br>');
  } else {
    const fragmento = extraerFragmentoRelevanteAria(item.texto, palabras || []);
    cuerpo = simplificarLenguajeAria(fragmento.length > 60 ? fragmento : item.texto.slice(0, 420).trim());
  }
  return `Vamos con calma 😊 Esto lo vimos en "<strong>${item.titulo}</strong>":<br>${cuerpo}<br><br>Si alguna parte no te queda clara, cuéntame exactamente cuál y te la explico de otra manera.`;
}

// Punto de entrada específico para preguntas de tipo "explícame/cómo se hace/qué es" —
// reutiliza el mismo índice y el mismo bloqueo de contenido de quiz que buscarEnClaseAria(),
// pero se dispara con prioridad más alta cuando la pregunta suena a pedido de explicación,
// y con un umbral un poco más flexible (el estudiante que pide una explicación suele usar
// menos palabras clave que el que busca un dato puntual).
function explicarConceptoOProcesoAria(pregunta){
  if (!ARIA_INDICE_CLASE.length) return null;
  const palabras = aplicarSinonimosAria(normalizaTexto(pregunta))
    .split(/[^a-z0-9ñ]+/)
    .filter(p => p.length > 3 && !ARIA_PALABRAS_VACIAS.has(p));
  if (!palabras.length) return null;

  const candidatos = ARIA_INDICE_CLASE.filter(item => detectarTipoSlideAria(item) !== 'quiz');
  let mejor = null, mejorPuntaje = 0;
  candidatos.forEach(item => {
    let puntaje = 0;
    palabras.forEach(p => { if (item.textoNorm.includes(p)) puntaje++; });
    if (puntaje > mejorPuntaje){ mejorPuntaje = puntaje; mejor = item; }
  });

  const minimoNecesario = Math.max(1, Math.ceil(palabras.length * 0.25));
  if (!mejor || mejorPuntaje < minimoNecesario) return null;
  return construirExplicacionDesdeItemAria(mejor, palabras);
}

// ============================================================
// TEMA / OBJETIVO DE LA CLASE — preguntas tipo "¿qué voy a aprender hoy?",
// "¿cuál es el tema?", "¿cuál es el objetivo?". Estas casi nunca se pueden
// resolver por coincidencia de palabras clave (las diapositivas rara vez
// contienen literalmente la palabra "tema" u "objetivo"), así que se
// resuelven aparte, con dos modos:
//  A) Clase real con CLASE_META (Prioridad 0 / v13.0 del PROMPT_MAESTRO):
//     respuesta exacta, 100% confiable.
//  B) Genérico (esta demo, o una clase sin CLASE_META todavía): usa la
//     primera diapositiva sustancial indexada, o una cuyo título sugiera
//     que es la de bienvenida/objetivo, como mejor estimación honesta.
// ============================================================
function esPreguntaTemaClaseAria(pregunta){
  const n = normalizaTexto(pregunta);
  return /que voy a aprender|cual es el tema|de que trata|que vamos a ver|que aprendere|cual es el objetivo|de que se trata|tema de hoy|tema de la clase|tema de esta clase/.test(n);
}

function respuestaTemaClaseAria(){
  if (typeof CLASE_META !== 'undefined'){
    return `📌 Hoy en <strong>${CLASE_META.materia}</strong> el tema es <strong>"${CLASE_META.tema}"</strong>. ${CLASE_META.objetivo}`;
  }
  if (!ARIA_INDICE_CLASE.length){
    return 'Todavía no pude leer el contenido de la clase para decirte el tema exacto 🤔 Échale un vistazo a la primera diapositiva, ahí normalmente está.';
  }
  // Busca una slide cuyo título huela a "objetivo/bienvenida/tema"
  const candidataPorTitulo = ARIA_INDICE_CLASE.find(item =>
    /objetivo|bienvenid|hoy vas a|hoy aprenderas|tema de/.test(normalizaTexto(item.titulo))
  );
  const elegida = candidataPorTitulo || ARIA_INDICE_CLASE[0];
  const fragmento = elegida.texto.slice(0, 220).trim();
  return `Por lo que veo en "${elegida.titulo}" 👉 ${fragmento}${elegida.texto.length > 220 ? '…' : ''}`;
}

// ── Sinónimos y jerga común de estudiantes: se reemplazan ANTES de buscar, así
// "compu", "profe" o "mate" también activan las respuestas de "computador", "profesor" o "matematicas" ──
const ARIA_SINONIMOS = [
  [/\bcompu\b/g, 'computador'],
  [/\bprofe\b/g, 'profesor'],
  [/\bmate\b/g, 'matematicas'],
  [/\bmates\b/g, 'matematicas'],
  [/\btecno\b/g, 'tecnologia'],
  [/\bcel\b/g, 'celular'],
  [/\bwifi\b/g, 'internet'],
  [/\bmulti(plicacion)?\b/g, 'multiplicacion'],
  [/\bdivi(sion)?\b/g, 'division'],
  [/\bfrac(cion)?\b/g, 'fraccion'],
  [/\bmulti(plicar)?\b/g, 'multiplicacion'],
  [/\bsumar?\b/g, 'suma'],
  [/\brestar?\b/g, 'resta'],
  [/\bgeo\b/g, 'geometria'],
  [/\bnat(urales)?\b/g, 'ciencias naturales'],
  [/\bsoc(iales)?\b/g, 'ciencias sociales'],
  [/\blenguaje\b/g, 'lenguaje'],
  [/\beduc(acion)? fisica\b/g, 'ejercicio'],
  [/\bmusi(ca)?\b/g, 'musica'],
  [/\bhadrones\b/g, 'hadrones'],
  [/\badrones\b/g, 'hadrones'],
  [/\bbolivar\b/g, 'simon bolivar'],
];

function aplicarSinonimosAria(textoNorm){
  let t = textoNorm;
  ARIA_SINONIMOS.forEach(([patron, reemplazo]) => { t = t.replace(patron, reemplazo); });
  return t;
}

function respuestaDiccionarioAmpliadoAria(pregunta){
  const p = aplicarSinonimosAria(normalizaTexto(pregunta));
  for (const item of ARIA_DICCIONARIO_AMPLIADO){
    if (item.claves.some(clave => p.includes(normalizaTexto(clave)))) return item.respuesta;
  }
  return null;
}

<script>
// ============================================================
// CONSULTA OPCIONAL A WIKIPEDIA — último recurso, solo si ni la clase
// ni el diccionario ampliado supieron responder. Requiere internet.
// La API de Wikipedia es pública y gratuita: NO necesita ninguna clave
// secreta, así que no hay ningún dato sensible que pueda filtrarse.
// ============================================================
const ARIA_PERMITIR_WIKIPEDIA = true; // el profe Luis puede poner esto en false para desactivarlo

// Filtro de seguridad: si el resumen de Wikipedia contiene alguna de estas palabras,
// ARIA prefiere no mostrarlo (mejor decir "no lo sé" que arriesgar contenido no apto).
// El profe Luis puede ampliar esta lista con el tiempo.
const ARIA_PALABRAS_NO_APTAS_WIKI = [
  'sexual','sexo','violacion','suicid','pornograf','droga','cocaina','heroina',
  'marihuana','asesinat','genocidio','tortura','terroris','arma de fuego',
  'pistola','explosivo','desnud','masacre','abuso'
];

function contenidoSeguroParaNinosAria(texto){
  const n = normalizaTexto(texto);
  return !ARIA_PALABRAS_NO_APTAS_WIKI.some(p => n.includes(p));
}

// 👉 Copia aquí, TAL CUAL (sin cambiarles ni una coma), las frases de "no lo sé, sigo
// aprendiendo" que ya usa tu responderAria() original. Así el widget sabe cuándo intentar
// Wikipedia como bonus, sin tener que tocar la función responderAria() para nada más.
const ARIA_FRASES_NO_SE_CONOCIDAS = [
  'todavia estoy aprendiendo',
  'sigo aprendiendo',
  'no se responder eso',
  'esa no la conozco'
];

function esRespuestaDeNoSeAria(respuesta){
  const r = normalizaTexto(respuesta || '');
  return ARIA_FRASES_NO_SE_CONOCIDAS.some(frase => r.includes(normalizaTexto(frase)));
}

// Busca el título de artículo más parecido usando "opensearch" (rápido, pero exige
// que el texto esté bien escrito porque compara por prefijo, ej. "hadrones" con h).
async function buscarTituloPorOpensearchAria(termino, signal){
  const url = `https://es.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(termino)}&limit=1&namespace=0&format=json&origin=*`;
  const res = await fetch(url, { signal });
  if (!res.ok) throw new Error('opensearch respondió ' + res.status);
  const datos = await res.json();
  return (datos && datos[1] && datos[1][0]) || null;
}

// Plan B: búsqueda de texto completo (más tolerante a errores de tipeo, ej. "adrones"
// sin h). Se usa solo si la primera búsqueda no encontró nada.
async function buscarTituloPorTextoCompletoAria(termino, signal){
  const url = `https://es.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(termino)}&srlimit=1&format=json&origin=*`;
  const res = await fetch(url, { signal });
  if (!res.ok) throw new Error('query/search respondió ' + res.status);
  const datos = await res.json();
  const primero = datos && datos.query && datos.query.search && datos.query.search[0];
  return (primero && primero.title) || null;
}

// Caché simple en memoria: si alguien repite la misma pregunta, no se vuelve a llamar a Wikipedia
const ARIA_CACHE_WIKI = new Map();

async function buscarEnWikipediaAria(pregunta){
  if (!ARIA_PERMITIR_WIKIPEDIA) return null;
  if (typeof navigator !== 'undefined' && navigator.onLine === false){
    console.warn('[ARIA/Wikipedia] Se omitió la búsqueda: el navegador reporta que no hay conexión (navigator.onLine=false).');
    return null;
  }

  const termino = (typeof extraerTerminoBusquedaWikiAria === 'function')
    ? extraerTerminoBusquedaWikiAria(pregunta)
    : pregunta.replace(/[¿?¡!]/g, '').trim().toLowerCase();
  if (!termino) return null;

  if (ARIA_CACHE_WIKI.has(termino)){
    return ARIA_CACHE_WIKI.get(termino);
  }

  const controlador = new AbortController();
  const tiempoFuera = setTimeout(() => controlador.abort(), 6000);

  try {
    // 1) Intento rápido por prefijo, y si no hay resultado, intento por texto completo
    let titulo = null;
    try {
      titulo = await buscarTituloPorOpensearchAria(termino, controlador.signal);
    } catch (e1){
      console.warn('[ARIA/Wikipedia] opensearch falló, se intenta con búsqueda de texto completo:', e1);
    }
    if (!titulo){
      try {
        titulo = await buscarTituloPorTextoCompletoAria(termino, controlador.signal);
      } catch (e2){
        console.error('[ARIA/Wikipedia] búsqueda de texto completo también falló:', e2);
      }
    }
    if (!titulo){
      console.info('[ARIA/Wikipedia] No se encontró ningún artículo para: "' + termino + '"');
      return null;
    }

    // 2) Traer el resumen (extracto corto) de ese artículo
    const urlResumen = `https://es.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(titulo)}`;
    const resResumen = await fetch(urlResumen, { signal: controlador.signal });
    if (!resResumen.ok){
      console.error('[ARIA/Wikipedia] El resumen del artículo "' + titulo + '" respondió ' + resResumen.status);
      return null;
    }
    const datosResumen = await resResumen.json();

    if (datosResumen.type === 'disambiguation'){
      console.info('[ARIA/Wikipedia] "' + titulo + '" es un título ambiguo (página de desambiguación); se descarta por seguridad.');
      return null;
    }
    const extracto = datosResumen.extract;
    if (!extracto || extracto.length < 20) return null;
    if (!contenidoSeguroParaNinosAria(extracto)){
      console.info('[ARIA/Wikipedia] El resumen de "' + titulo + '" contenía una palabra filtrada; se descarta por seguridad para niños.');
      return null;
    }

    const corto = extracto.length > 320 ? extracto.slice(0, 320).trim() + '...' : extracto;
    const url = datosResumen.content_urls && datosResumen.content_urls.desktop
      ? datosResumen.content_urls.desktop.page : null;

    let html = `Busqué en Wikipedia sobre "<strong>${datosResumen.title}</strong>" 🌐<br>${corto}`;
    if (url) html += `<br><a href="${url}" target="_blank" rel="noopener">Ver artículo completo</a>`;
    ARIA_CACHE_WIKI.set(termino, html);
    return html;
  } catch (e){
    // sin internet, tiempo agotado, CORS bloqueado (típico al abrir el .html con doble clic
    // en vez de servirlo por http/https), o cualquier otra falla -> se registra para diagnóstico
    console.error('[ARIA/Wikipedia] Falló la consulta a Wikipedia:', e);
    return null;
  } finally {
    clearTimeout(tiempoFuera);
  }
}

</script>

<script>
// ============================================================
// ARIA AVATAR VISUAL v1.6 — controlador (arrastre + voz + panel + chat)
// Depende de: responderAria(pregunta), normalizaTexto(texto)  [ya definidas]
// ============================================================
(function(){
  let vozActiva = false; // 🔴 SIEMPRE inicia apagada — nunca se recuerda encendida entre sesiones
  let idleTimer = null;
  let placeholderTimer = null;

  const ARIA_PLACEHOLDERS = [
    'Escríbele a ARIA...',
    'Pregúntame algo de la clase...',
    'Ej: ¿Dónde está el manual de convivencia?',
    '¿En qué te ayudo hoy?'
  ];

  const $fab        = document.getElementById('aria-fab');
  const $fabImg     = document.getElementById('aria-fab-img');
  const $avatarImg  = document.getElementById('aria-avatar-img');
  const $chat       = document.getElementById('aria-chat');
  const $panel      = document.getElementById('aria-panel');
  const $vozBtn     = document.getElementById('aria-voz-btn');
  const $sonidoBtn  = document.getElementById('aria-sonido-btn');
  const $cerrarBtn  = document.getElementById('aria-cerrar-btn');
  const $input      = document.getElementById('aria-input');
  const $enviarBtn  = document.getElementById('aria-enviar-btn');

  function actualizarImagen(categoria){
    const src = elegirImagenAria(categoria);
    if (window.ARIA_FX){ ARIA_FX.cambiar([$fabImg, $avatarImg], src); return; } // v2.8.0 — cambio suave
    if ($fabImg) $fabImg.src = src;
    if ($avatarImg) $avatarImg.src = src;
  }

  // Agrega un mensaje al historial de chat visible y hace scroll hasta el final
  function agregarMensajeAria(rol, html){
    const div = document.createElement('div');
    div.className = 'aria-msg ' + (rol === 'usuario' ? 'aria-msg-usuario' : 'aria-msg-aria');
    div.innerHTML = html;
    $chat.appendChild(div);
    $chat.scrollTop = $chat.scrollHeight;
    return div;
  }

  // Burbuja de "ARIA está pensando..." — se agrega y se quita del propio historial
  function mostrarEscribiendo(){
    const div = document.createElement('div');
    div.className = 'aria-msg aria-msg-aria aria-escribiendo';
    div.id = 'aria-escribiendo-burbuja';
    div.innerHTML = '<span></span><span></span><span></span>';
    $chat.appendChild(div);
    $chat.scrollTop = $chat.scrollHeight;
  }
  function ocultarEscribiendo(){
    const div = document.getElementById('aria-escribiendo-burbuja');
    if (div) div.remove();
    if (window.ARIA_FX) ARIA_FX.pensando(false); // v2.8.0
  }

  function rotarPlaceholder(){
    let i = 0;
    placeholderTimer = setInterval(() => {
      if (document.activeElement === $input || $input.value) return; // no cambiar si está escribiendo
      i = (i + 1) % ARIA_PLACEHOLDERS.length;
      $input.placeholder = ARIA_PLACEHOLDERS[i];
    }, 3500);
  }

  function abrirPanel(){
    $panel.classList.add('aria-abierto');
    $fab.style.display = 'none';
    if (window.ariaSonar) ariaSonar('notificacion');
    reiniciarIdle();
  }

  function cerrarPanel(){
    $panel.classList.remove('aria-abierto');
    $fab.style.display = '';
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    clearTimeout(idleTimer);
  }

  // Si el estudiante deja el panel abierto sin usarlo, ARIA "se duerme" — discreta, no insiste
  function reiniciarIdle(){
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => actualizarImagen('dormida'), 90000);
  }

  function hablar(texto){
    if (!vozActiva || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const limpio = String(texto).replace(/<[^>]+>/g, '');
    const u = new SpeechSynthesisUtterance(limpio);
    if (ARIA_VOZ_ELEGIDA) u.voice = ARIA_VOZ_ELEGIDA;
    u.lang = ARIA_VOZ_ELEGIDA ? ARIA_VOZ_ELEGIDA.lang : 'es-419';
    u.pitch = 1.12;
    u.rate = 1.15;
    // v2.8.0 — el avatar "habla": pulsa mientras suena la voz (el token evita que un audio cancelado apague al nuevo)
    const tk = ++window.__ariaHablaTk;
    u.onstart = () => { if (window.ARIA_FX && tk === window.__ariaHablaTk) ARIA_FX.hablando(true, limpio.length * 85 + 1500); };
    u.onend = u.onerror = () => { if (window.ARIA_FX && tk === window.__ariaHablaTk) ARIA_FX.hablando(false); };
    u.onboundary = (e) => { if (window.ARIA_FX && tk === window.__ariaHablaTk && e.name === 'word') ARIA_FX.palabra(); };
    window.speechSynthesis.speak(u);
  }

  // Punto único de entrada: se llama cada vez que ARIA responde algo, desde donde sea
  function reaccionarAria(pregunta, respuesta, emocionForzada){
    if (window.ARIA_FX) ARIA_FX.pensando(false);
    // v2.8.0 — Si Gemini eligió una emoción válida, se usa; si no, siguen las reglas de siempre.
    let categoria = (emocionForzada && ARIA_IMG_POR_CATEGORIA[emocionForzada])
      ? emocionForzada : categoriaExpresionAria(pregunta, respuesta);
    // v2.5 — Resumen de fin de clase: se agrega SOLO cuando ARIA detecta una despedida real,
    // y solo si de verdad se tocó algún tema del banco de métodos en esta sesión.
    if (categoria === 'despedida' && typeof generarResumenFinDeClaseAria === 'function'){
      const resumen = generarResumenFinDeClaseAria();
      if (resumen) respuesta = respuesta + '<br><br>' + resumen;
    }
    actualizarImagen(categoria);
    if (window.ARIA_FX) ARIA_FX.reaccionar(categoria); // v2.8.0 — aura + partículas
    agregarMensajeAria('aria', respuesta);
    if (window.ariaSonar) ariaSonar(categoria === 'logro' ? 'logro' : (categoria === 'despedida' ? 'despedida' : 'notificacion'));
    hablar(respuesta);
    reiniciarIdle();
    if ($avatarImg){
      $avatarImg.classList.remove('aria-rebotar');
      void $avatarImg.offsetWidth; // fuerza reinicio de la animación aunque se repita seguido
      $avatarImg.classList.add('aria-rebotar');
    }
  }
  window.ARIA_AVATAR_REACCIONAR = reaccionarAria; // 🔗 hook público
  window.ARIA_ABRIR_PANEL = abrirPanel;
  window.ARIA_ENVIAR = function(q){ abrirPanel(); setTimeout(function(){ enviar(q); }, 380); };
  addEventListener('message', function(e){ if (e.data && typeof e.data.ariaPregunta === 'string') window.ARIA_ENVIAR(e.data.ariaPregunta); });
  // 🔗 Hook público para refuerzo proactivo (ver Prioridad 30-F): abre el panel de ARIA
  // y le hace decir algo SIN que el estudiante haya preguntado nada — para cuando falla
  // 2 veces la misma pregunta de un quiz.
  window.ARIA_MENSAJE_PROACTIVO = function(mensaje, categoria){
    abrirPanel();
    actualizarImagen(categoria || 'triste');
    if (window.ARIA_FX) ARIA_FX.reaccionar(categoria || 'triste');
    agregarMensajeAria('aria', mensaje);
    hablar(mensaje);
    reiniciarIdle();
  };

  function enviar(textoForzado){
    const texto = (textoForzado || $input.value || '').trim();
    if (!texto) return;
    $input.value = '';
    agregarMensajeAria('usuario', escaparHtmlAria(texto));
    if (window.ariaSonar) ariaSonar('clic');
    mostrarEscribiendo();
    actualizarImagen('pensando');
    if (window.ARIA_FX) ARIA_FX.pensando(true); // v2.8.0 — se inclina y brilla mientras "piensa"

    // Pequeña pausa simulando que "piensa" — se ve más viva y natural
    setTimeout(async () => {
      let desdeDocs = false, respuesta = null;
      // v2.9 — Base de conocimiento del colegio (aria-conocimiento/base-colegio.json): respuesta inmediata
      const kb = window.ARIA_KB ? await ARIA_KB.consultar(texto).catch(() => null) : null;
      if (kb && kb.fuerte){ respuesta = kb.html; desdeDocs = true; }
      if (!respuesta && window.ARIA_DOCS && ARIA_DOCS.pideDoc(texto)){ respuesta = await ARIA_DOCS.responder(texto); desdeDocs = !!respuesta; }
      if (kb && (!respuesta || /^(No encontr|El índice)/.test(String(respuesta).replace(/<[^>]+>/g, '')))){ respuesta = kb.html; desdeDocs = true; }
      if (!respuesta) respuesta = responderAria(texto);
      if (!desdeDocs && window.ARIA_DOCS && esRespuestaDeNoSeAria(respuesta)){ const d = await ARIA_DOCS.responder(texto); if (d){ respuesta = d; desdeDocs = true; } }

      // v2.7 — Si ni la clase ni el diccionario supieron responder, ARIA intenta con una IA
      // real (Gemini) como primer respaldo — a diferencia de Wikipedia, puede entender
      // preguntas abiertas o de conversación, no solo datos puntuales. Todas las protecciones
      // de código (anti-quiz, lenguaje, románticas) YA se revisaron antes en responderAria(),
      // así que para cuando llegamos aquí, la pregunta ya pasó esos filtros.
      let emocionIA = null;
      if (desdeDocs) emocionIA = 'academico';
      if (esRespuestaDeNoSeAria(respuesta) && typeof preguntarIAExternaAria === 'function'){
        const desdeIA = await preguntarIAExternaAria(texto, null);
        if (desdeIA){ respuesta = desdeIA; emocionIA = window.ARIA_EMOCION_IA || null; }
      }

      // Si la IA real no está configurada, no respondió, o se agotó el cupo de la sesión,
      // intenta Wikipedia como respaldo — pero SOLO si el mensaje de verdad parece una
      // pregunta de datos (v2.6), para no mostrar un artículo al azar sin relación.
      const pareceFactual = typeof pareceConsultaFactualAria === 'function' ? pareceConsultaFactualAria(texto) : true;
      if (esRespuestaDeNoSeAria(respuesta) && pareceFactual && typeof buscarEnWikipediaAria === 'function'){
        const desdeWikipedia = await buscarEnWikipediaAria(texto);
        if (desdeWikipedia) respuesta = desdeWikipedia;
      }

      ocultarEscribiendo();
      reaccionarAria(texto, respuesta, emocionIA);
    }, 380);
  }

  $cerrarBtn.addEventListener('click', cerrarPanel);
  $enviarBtn.addEventListener('click', () => enviar());
  $input.addEventListener('keydown', e => { if (e.key === 'Enter') enviar(); });

  $vozBtn.addEventListener('click', () => {
    vozActiva = !vozActiva;
    if (vozActiva){
      $vozBtn.textContent = '🔊 Voz activada (toca para apagar)';
      $vozBtn.classList.remove('aria-voz-off');
      $vozBtn.classList.add('aria-voz-on');

      $vozBtn.textContent = '🔇 Activar voz';
      $vozBtn.classList.remove('aria-voz-on');
      $vozBtn.classList.add('aria-voz-off');
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    }
  });

  function pintarBotonSonido(){
    const activo = window.ariaSonidoEstaActivo ? ariaSonidoEstaActivo() : true;
    $sonidoBtn.textContent = activo ? '🔈 Sonidos: activados' : '🔇 Sonidos: apagados';
    $sonidoBtn.classList.toggle('aria-voz-on', activo);
    $sonidoBtn.classList.toggle('aria-voz-off', !activo);
  }
  pintarBotonSonido();
  $sonidoBtn.addEventListener('click', () => {
    if (window.ariaAlternarSonido) ariaAlternarSonido();
    pintarBotonSonido();
  });

  // ── Arrastre libre del ícono flotante (mouse + táctil, vía Pointer Events) ──
  function habilitarArrastre(el, alSoltarSinMover){
    let arrastrando = false, seMovio = false, offsetX = 0, offsetY = 0, startX = 0, startY = 0;
    const UMBRAL = 6;

    el.addEventListener('pointerdown', (e) => {
      arrastrando = true; seMovio = false;
      el.classList.add('aria-arrastrando');
      const rect = el.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      startX = e.clientX; startY = e.clientY;
      el.style.left = rect.left + 'px';
      el.style.top = rect.top + 'px';
      el.style.right = 'auto';
      el.style.bottom = 'auto';
      el.setPointerCapture(e.pointerId);
    });

    el.addEventListener('pointermove', (e) => {
      if (!arrastrando) return;
      if (Math.abs(e.clientX - startX) > UMBRAL || Math.abs(e.clientY - startY) > UMBRAL) seMovio = true;
      const w = el.offsetWidth, h = el.offsetHeight;
      let nx = e.clientX - offsetX;
      let ny = e.clientY - offsetY;
      nx = Math.max(4, Math.min(window.innerWidth - w - 4, nx));
      ny = Math.max(4, Math.min(window.innerHeight - h - 4, ny));
      el.style.left = nx + 'px';
      el.style.top = ny + 'px';
    });

    function terminar(e){
      if (!arrastrando) return;
      arrastrando = false;
      el.classList.remove('aria-arrastrando');
      if (!seMovio && typeof alSoltarSinMover === 'function') alSoltarSinMover();
    }
    el.addEventListener('pointerup', terminar);
    el.addEventListener('pointercancel', terminar);
  }
  habilitarArrastre($fab, abrirPanel);

  // Imagen inicial discreta antes de la primera interacción
  actualizarImagen('saludo');
  agregarMensajeAria('aria', '¡Hola! Si quieres que te hable, activa mi voz aquí abajo. Si no, solo escríbeme 💜');
  rotarPlaceholder();

  // Índice del contenido de la clase (para poder responder sobre cualquier diapositiva)
  if (document.readyState === 'complete') inicializarIndiceClaseAria();
  else window.addEventListener('load', inicializarIndiceClaseAria);
})();
</script>
